<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test computeRadiativeTransfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            font-family: 'Tahoma', 'Roboto', 'Verdana', sans-serif;
            font-size: 11px;
        }
        
        /* Classe pour les éléments contenant des emojis/logos */
        .logo-item,
        .emoji-text {
            font-family: 'Tahoma', 'Roboto', 'Verdana', sans-serif;
        }
        
        /* Appliquer la police par défaut aux éléments */
        .config-value,
        .config-title,
        code,
        pre,
        h1,
        h2,
        h3,
        .epoch-btn-horizontal,
        .icon-button,
        .timeline-hourglass,
        .horloge-icon,
        button {
            font-family: 'Tahoma', 'Roboto', 'Verdana', sans-serif;
        }
        
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        
        .controls {
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }
        
        .controls-left {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        
        .timeline-horizontal-container {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
        }
        
        .timeline-date-display, .timeline-horloge-display {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #e0e0e0;
            white-space: nowrap;
        }
        
        .timeline-hourglass, .horloge-icon {
            font-size: 12px;
        }
        
        .epoch-date-item-horizontal {
            display: inline-flex;
            align-items: center;
            font-size: 9px;
            color: #888;
            padding: 0 5px;
            margin: 0 2px;
        }
        
        .epoch-date-horizontal {
            font-size: 9px;
            color: #aaa;
            white-space: nowrap;
        }
        
        .epochs-container-horizontal {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .epoch-btn-horizontal {
            font-size: 24px;
            /* font-family héritée de la règle générale pour button */
            background: none !important;
            border: none !important;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer !important;
            padding: 5px;
            transition: filter 0.3s ease, text-shadow 0.3s ease;
            width: 40px;
            height: 40px;
            position: relative;
            /* Par défaut : noir et blanc sans glow (glow uniquement pour selected) */
            filter: grayscale(100%);
            /* Pas de text-shadow par défaut pour les boutons non sélectionnés */
            text-shadow: none;
        }
        
        /* Rollover : swap de rendu sur la couleur (inverse le grayscale), le contour ne change pas */
        .epoch-btn-horizontal:hover {
            /* Si non sélectionné : swap vers couleur, contour blanc au rollover */
            filter: grayscale(0%);
            /* Glow blanc au rollover pour les boutons non sélectionnés */
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.9),
                0 0 4px rgba(255, 255, 255, 0.7),
                0 0 6px rgba(255, 255, 255, 0.5);
        }
        
        /* Rollover spécifique pour les boutons non sélectionnés : forcer le glow blanc */
        .epoch-btn-horizontal:not(.selected):hover {
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.9),
                0 0 4px rgba(255, 255, 255, 0.7),
                0 0 6px rgba(255, 255, 255, 0.5) !important;
        }
        
        /* Bouton sélectionné : couleur avec contour vert autour du logo */
        .epoch-btn-horizontal.selected {
            filter: grayscale(0%) drop-shadow(0 0 3px rgba(0, 255, 0, 0.8)) drop-shadow(0 0 6px rgba(0, 255, 0, 0.5)) !important;
            /* Couleur normale avec blur vert */
            /* Contour vert autour du logo - ne change pas au rollover */
            text-shadow: 0 0 2px rgba(0, 255, 0, 0.9),
                0 0 4px rgba(0, 255, 0, 0.7),
                0 0 6px rgba(0, 255, 0, 0.5),
                0 0 8px rgba(0, 255, 0, 0.3) !important;
        }
        
        .epoch-btn-horizontal.selected:hover {
            /* Si sélectionné : swap vers noir et blanc, contour reste vert */
            filter: grayscale(100%) drop-shadow(0 0 3px rgba(0, 255, 0, 0.8)) drop-shadow(0 0 6px rgba(0, 255, 0, 0.5)) !important;
            text-shadow: 0 0 2px rgba(0, 255, 0, 0.9),
                0 0 4px rgba(0, 255, 0, 0.7),
                0 0 6px rgba(0, 255, 0, 0.5),
                0 0 8px rgba(0, 255, 0, 0.3) !important;
        }
        
        .timeline-events-logos {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .timeline-event-logo {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
            filter: grayscale(100%);
        }
        
        .timeline-event-logo:hover {
            transform: scale(1.1);
            filter: grayscale(0%);
        }
        
        .controls-right {
            display: flex;
            flex-direction: row;
            gap: 10px;

        }
        
        .control-group {
            display: flex;
            flex-direction: column;

        }
        
        label {
            font-size: 11px;
            color: #aaa;
        }
        
        select, input[type="number"] {

            border: 1px solid #555;

        .icon-button {
            font-size: 18px;
            /* font-family héritée de la règle générale pour button */
            background: none !important;
            border: none !important;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer !important;
            padding: 5px;
            transition: filter 0.3s ease, text-shadow 0.3s ease;
            width: 45px;
            height: 45px;
            position: relative;
            /* Par défaut : noir et blanc sans glow (glow uniquement pour selected) */
            filter: grayscale(100%);
            /* Pas de text-shadow par défaut pour les boutons non sélectionnés */
            text-shadow: none;
        }
        
        /* Rollover : swap de rendu sur la couleur (inverse le grayscale), le contour ne change pas */
        .icon-button:hover {
            /* Si non sélectionné : swap vers couleur, contour blanc au rollover */
            filter: grayscale(0%);
            /* Glow blanc au rollover pour les boutons non sélectionnés */
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.9),
                0 0 4px rgba(255, 255, 255, 0.7),
                0 0 6px rgba(255, 255, 255, 0.5);
        }
        
        /* Rollover spécifique pour les boutons non sélectionnés : forcer le glow blanc */
        .icon-button:not(.selected):hover {
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.9),
                0 0 4px rgba(255, 255, 255, 0.7),
                0 0 6px rgba(255, 255, 255, 0.5) !important;
        }
        
        /* Bouton sélectionné : couleur avec contour vert autour du logo */
        .icon-button.selected {
            filter: grayscale(0%) drop-shadow(0 0 3px rgba(0, 255, 0, 0.8)) drop-shadow(0 0 6px rgba(0, 255, 0, 0.5)) !important;
            /* Couleur normale avec blur vert */
            /* Contour vert autour du logo - ne change pas au rollover */
            text-shadow: 0 0 2px rgba(0, 255, 0, 0.9),
                0 0 4px rgba(0, 255, 0, 0.7),
                0 0 6px rgba(0, 255, 0, 0.5),
                0 0 8px rgba(0, 255, 0, 0.3) !important;
        }
        
        .icon-button.selected:hover {
            /* Si sélectionné : swap vers noir et blanc, contour reste vert */
            filter: grayscale(100%) drop-shadow(0 0 3px rgba(0, 255, 0, 0.8)) drop-shadow(0 0 6px rgba(0, 255, 0, 0.5)) !important;
            text-shadow: 0 0 2px rgba(0, 255, 0, 0.9),
                0 0 4px rgba(0, 255, 0, 0.7),
                0 0 6px rgba(0, 255, 0, 0.5),
                0 0 8px rgba(0, 255, 0, 0.3) !important;
        }
        
        .results {
            /* background: #2a2a2a; */
            padding: 10px;
            /* border-radius: 8px; */

        }

        }

        }
        
        .config-title {
            font-weight: bold;

            margin-bottom: 5px;

        }

        .formule-container.visible {

        }
        
        .results.replied .config-title {
            display: none;
        }

        .results.replied #alphabet-content,
        .results.replied #dico-content {
            display: none;

        /* Style pour les iframes dans Lexique et Syntaxe */
        #alphabet-content iframe,
        #dico-content iframe {
            width: 100%;
            height: 700px;
            border: none;
            background: #1a1a1a;
        }
        
        /* Pour Configuration et Convergence : couleur plus grise et comportement différent */
        #config,
        #convergence {
            background: #2a2a2a !important; /* Plus gris que #1a2a3a */
            border-left-color: #6a6a6a !important; /* Bordure plus grise */

        /* Configuration et Convergence : quand repliées, afficher les objets JSON mais cacher formules et titres */
        #config.replied .config-title,
        #convergence.replied .config-title {
            display: none;
        }
        
        #config.replied .formule,
        #convergence.replied .formule {
            display: none;
        }
        
        /* Les objets JSON restent visibles même quand repliées */
        #config.replied .config-value,
        #convergence.replied .config-value {
            display: block;
        }
        
        /* Aligner les titres avec les boutons à droite */
        .results h2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .toggle-button {
            background: #4a9eff;
            border: none;
            color: white;
            padding: 5px 10px;

            display: none;

        #convergence.details-visible .convergence-details-block {
            display: block;
        }
        
        .results h2 {
            display: flex;
            align-items: center;
            padding: 8px;

        }

            flex-direction: column;
            gap: 8px;
        }
        
        .config-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

            border-bottom: none;
        }
        
        .config-label {
            font-weight: bold;
            color: #aaa;
        }

</head>
<body>
    <div class="container">
        <h1>🧪 Test computeRadiativeTransfer</h1>
        
        <!-- Lexique des logos selon grammar.txt -->
        <div id="lexique" class="results replied" style="margin-bottom: 20px; background: #1a2a3a; border-left: 4px solid #4a9eff;">
            <h2 style="color: #4a9eff; margin-bottom: 10px;">🔡 Alphabet <button class="toggle-button" onclick="toggleLexique()">+</button></h2>
            <div id="alphabet-content">
                <iframe id="alphabet-iframe" src="alphabet.html" style="width: 100%; height: 800px; border: none; background: #1a1a1a;"></iframe>
            </div>
        </div>
        
        <!-- Syntaxe des logos -->
        <div id="syntaxe" class="results replied" style="margin-bottom: 20px; background: #1a2a3a; border-left: 4px solid #4a9eff;">
            <h2 style="color: #4a9eff; margin-bottom: 10px;">📖 Dictionnaire <button class="toggle-button" onclick="toggleSyntaxe()">+</button></h2>
            <div id="dico-content">
                <iframe id="dico-iframe" src="dico.html" style="width: 100%; height: 800px; border: none; background: #1a1a1a;"></iframe>
            </div>
        </div>
        
        <div class="controls">
            <div class="controls-left" style="position: relative; width: 100%;">
                <!-- En-tête window.TIMELINE (superposé en z-index) -->
                <div style="position: absolute; top: -8px; left: -5px; font-size: 10px; color: #888; z-index: 10; background: #2a2a2a; padding: 2px 5px;">> window.TIMELINE</div>
                
                <!-- Timeline horizontale (une seule ligne) -->
                <div class="timeline-horizontal-container" style="padding-top: 5px;">
                        <!-- 📜 Époque avec date -->
                        <div class="timeline-date-display" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; border-right: 1px solid #444;">
                            <span class="timeline-hourglass" style="font-size: 20px;">📜</span>
                            <span class="epoch-start-time" id="epoch-start-time" style="font-size: 10px; margin-top: 2px;">-5000 Ma</span>
                        </div>
                        
                        <!-- 📅 Date avec ticTime (Ma) + durée 1 tic -->
                        <div class="timeline-date-display" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; border-right: 1px solid #444;">
                            <span class="timeline-hourglass" style="font-size: 20px;">📅</span>
                            <span class="info-time" id="info-time" style="font-size: 10px; margin-top: 2px;">+0 Ma</span>
                            <span class="tic-duration" id="tic-duration" style="font-size: 9px; color: var(--muted, #888); margin-top: 1px;"></span>
                        </div>
                        
                        <!-- 🕰 Horloge avec événements (>> ticTime, Météorite, etc.) -->
                        <div class="timeline-horloge-display" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; border-right: 1px solid #444;">
                            <span class="horloge-icon" style="font-size: 20px;">🕰</span>
                            <div class="timeline-events-logos" id="timeline-events-logos" style="margin-top: 2px; display: flex; align-items: center; gap: 4px;">
                                <!-- >> ticTime puis logos (météorite, etc.) -->
                            </div>
                        </div>
                        
                        <!-- Boutons d'époques avec graduations intégrées -->
                        <div class="epochs-container-horizontal" id="epochs-container-horizontal" style="flex: 1; padding-left: 10px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap;">
                            <!-- Sera rempli dynamiquement avec boutons et graduations -->
                        </div>
                </div>
            </div>
            
            <div class="controls-right">
                <button class="icon-button" id="anim-toggle" onclick="toggleAnim()" title="Animation">🎬</button>
                <button class="icon-button" id="run-stop-btn" onclick="toggleRunStop()" title="Exécuter">▶️</button>
                <button class="icon-button" onclick="clearLog()" title="Effacer les logs">🗑️</button>
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;"><input type="checkbox" id="debug-io-cb" onchange="window.DEBUG_DATA_IO = this.checked;"> Debug I/O (🫧💧🪩🧲)</label>
            </div>
        </div>
        
        <div id="config" class="results replied">
            <h2>📋 Configuration <button class="toggle-button" onclick="toggleConfig()">Formules +</button></h2>
            <div id="config-content"></div>
        </div>
        
        <div id="convergence" class="results replied">
            <h2>⚙ Convergence <button class="toggle-button" onclick="toggleConvergence()">Formules +</button></h2>
            <div id="convergence-content"></div>
        </div>
        
        <div id="results" class="results" style="display: none;">
            <h2>📊 Résultats</h2>
            <div id="results-content"></div>
        </div>
        
    </div>

    <script>
        // Capturer toute erreur non gérée pour éviter plantage silencieux (ex: Hadéen)
        window.onerror = function (msg, url, line, col, err) {
            console.error('❌ Erreur non gérée:', msg, url, line, col, err && err.stack);
            return false;
        };
        window.addEventListener('unhandledrejection', function (e) {
            console.error('❌ Promise rejetée non gérée:', e.reason, e.reason && e.reason.stack);
        });

        // Fonction helper pour construire les clés de logos dans le HTML (utilise window.getLogoKey si disponible)
        function getLogoKeyHTML(...names) {
            if (typeof window !== 'undefined' && window.getLogoKey) {
                return window.getLogoKey(...names);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return names.map(name => window.LOGOS[name] || '').join('');
        }
        
        function getLogoHTML(name) {
            if (typeof window !== 'undefined' && window.getLogo) {
                return window.getLogo(name);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return window.LOGOS[name] || '';
        }
        
        // Intercepter console.log pour afficher dans la page
        const originalLog = console.log;
        const originalError = console.error;
        // Logs désactivés - la div de logs a été supprimée
        // console.log et console.error utilisent les fonctions originales
        
        function clearLog() {
            // Logs désactivés - la div de logs a été supprimée
        }
        
        function toggleAnim() {
            const animButton = document.getElementById('anim-toggle');
            if (animButton) {
                const isSelected = animButton.classList.contains('selected');
                if (isSelected) {
                    animButton.classList.remove('selected');
                } else {
                    animButton.classList.add('selected');
                }
                // Créer ou mettre à jour plot-anim-toggle-checkbox pour compatibilité avec compute.js
                let plotAnimToggleCheckbox = document.getElementById('plot-anim-toggle-checkbox');
                if (!plotAnimToggleCheckbox) {
                    plotAnimToggleCheckbox = document.createElement('input');
                    plotAnimToggleCheckbox.type = 'checkbox';
                    plotAnimToggleCheckbox.id = 'plot-anim-toggle-checkbox';
                    plotAnimToggleCheckbox.style.display = 'none';
                    document.body.appendChild(plotAnimToggleCheckbox);
                }
                plotAnimToggleCheckbox.checked = !isSelected;
            }
        }
        
        // Fonction helper pour convertir les chemins relatifs en chemins absolus depuis la racine
        // Depuis static/compute/, on doit remonter de 2 niveaux pour atteindre la racine
        function getImagePath(relativePath) {
            if (!relativePath) return relativePath;
            // Si le chemin commence déjà par http:// ou https:// ou /, le retourner tel quel
            if (relativePath.startsWith('http://') || relativePath.startsWith('https://') || relativePath.startsWith('/')) {
                return relativePath;
            }
            // Sinon, remonter de 2 niveaux depuis static/compute/ pour atteindre la racine
            return '../../' + relativePath;
        }
        
        // ============================================================================
        // UTILITAIRES PARTAGÉS POUR TIMELINE (verticale et horizontale)
        // ============================================================================
        
        // Créer un bouton d'époque (utilitaire partagé)
        function createEpochButton(epochId, orientation) {
            const button = document.createElement('button');
            button.className = orientation === 'horizontal' ? 'epoch-btn-horizontal' : 'epoch-btn';
            button.setAttribute('data-epoch', epochId);
            
            // Le logo est directement l'emoji
            button.textContent = epochId;
            button.style.fontFamily = "'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";

        // Formater une date en Ma depuis les années
        function formatDateMa(years) {
            const millions = Math.abs(years) / 1e6;
            if (millions >= 1) {
                const sign = years < 0 ? '-' : '';
                const millionsFormatted = millions.toFixed(0);
                return `${sign}${millionsFormatted}Ma`;
            }
            return `${years < 0 ? '-' : ''}${Math.abs(years)}`;
        }
        
        // ============================================================================
        // GÉNÉRATION TIMELINE HORIZONTALE
        // ============================================================================
        function generateHorizontalTimeline() {
            const epochsContainer = document.getElementById('epochs-container-horizontal');
            if (!epochsContainer || !window.TIMELINE) return;
            
            epochsContainer.innerHTML = '';
            
            // Dates importantes pour les graduations (en Ma)
            const importantDates = [-5000, 1800, 2025];
            let lastEpochDate = null;
            
            window.TIMELINE.forEach((item, index) => {
                if (item['📅']) {
                    const currentDate = item['▶'] / 1e6; // Convertir en Ma
                    
                    // Ajouter une graduation AVANT le bouton si nécessaire
                    if (index === 0) {
                        // Première époque : ajouter graduation -5000Ma
                        const graduation = createGraduation('-5000Ma', 'horizontal');
                        epochsContainer.appendChild(graduation);
                    } else if (lastEpochDate !== null) {
                        // Vérifier si on doit ajouter une graduation entre les boutons
                        const dateDiff = Math.abs(currentDate - lastEpochDate);
                        const isImportantDate = importantDates.some(d => Math.abs(currentDate - d) < 50);
                        
                        // Ajouter graduation si changement > 200Ma ou si c'est une date importante
                        if (dateDiff > 200 || isImportantDate) {
                            const graduation = createGraduation(formatDateMa(item['▶']), 'horizontal');
                            epochsContainer.appendChild(graduation);
                        }
                    }
                    
                    // Créer le bouton d'époque
                    const button = createEpochButton(item['📅'], 'horizontal');
                    button.onclick = () => selectEpoch(item['📅']);
                    epochsContainer.appendChild(button);
                    
                    lastEpochDate = currentDate;
                }
            });
            
            // Ajouter graduation finale (2025) après le dernier bouton si nécessaire
            const lastEpoch = window.TIMELINE[window.TIMELINE.length - 1];
            if (lastEpoch && lastEpoch['📅']) {
                const lastEpochEndDate = lastEpoch['◀'] / 1e6;
                if (Math.abs(lastEpochEndDate - 2025) < 50) {
                    const graduation = createGraduation('2025', 'horizontal');
                    epochsContainer.appendChild(graduation);
                }
            }
            
            // Sélectionner la première époque par défaut
            if (window.TIMELINE.length > 0) {
                const firstEpoch = window.TIMELINE.find(item => item['📅']);
                if (firstEpoch) {
                    selectEpoch(firstEpoch['📅']);
                }
            }
        }

        async function runTest() {
            setRunStopButtonRunning(true);
            window.ABORT_COMPUTE = false;
            window.CONFIG_INIT_SNAPSHOT = null;
            try {
                initializeGlobals();
                const DATA = window.DATA;
                let result = null;
                const dateConfig = window.getEpochDateConfig ? window.getEpochDateConfig() : null;
                if (!DATA['🔘']['🔘🎬']) {
                    DATA['🧮']['🧮🌡️'] = DATA['📅']['🌡️🧮'];
                }

                // 1. Config dès le debug (sans aucun calcul radiatif)
                if (window.initForConfig && !window.initForConfig()) {
                    console.error('❌ initForConfig a échoué');
                    return;
                }
                displayResults(null);
                await new Promise(r => setTimeout(r, 0)); // Laisser le DOM afficher la config
                if (window.ABORT_COMPUTE) { /* skip */ } else {

                // 2. Premier cycle de l'eau → affiché dans Convergence
                DATA['🧮']['previous'] = [];
                DATA['🧮']['🧮🔄🌊'] = 1;
                if (window.cycleDeLeau) await window.cycleDeLeau(1, true);
                if (window.ABORT_COMPUTE) { /* skip loop */ } else {
                if (window.displayConvergence) window.displayConvergence();
                await new Promise(r => setTimeout(r, 0));
                if (window.ABORT_COMPUTE) { /* skip loop */ } else {

                // 3. Calculs radiatifs ; après chaque sortie, cycle de l'eau ; si changé → recalcul radiatif
                let waterPass = 0;
                const maxWaterPass = 5;
                do {
                    result = await window.computeRadiativeTransfer(1, waterPass);
                    if (result === null || window.ABORT_COMPUTE) break;
                    if (window.displayConvergence) window.displayConvergence();
                    await new Promise(r => setTimeout(r, 0));
                    if (window.ABORT_COMPUTE) break;
                    const cycleResult = window.cycleDeLeau ? await window.cycleDeLeau(1, false) : { changed: false };
                    const changed = cycleResult ? cycleResult.changed : false;
                    if (window.displayConvergence) window.displayConvergence();
                    await new Promise(r => setTimeout(r, 0));
                    if (window.ABORT_COMPUTE) break;
                    if (changed && waterPass < maxWaterPass) waterPass++; else break;
                } while (true);

                } } }

                try {
                    if (result !== null) displayResults(result);
                    displayConvergence();
                } catch (displayErr) {
                    console.error('❌ Affichage après arrêt:', displayErr);
                }
                if (result !== null) {
                    console.log('✅ Test terminé avec succès');
                } else {
                    console.log('⏹ Calculs arrêtés');
                }
            } catch (error) {
                console.error('❌ Erreur lors du test:', error);
                document.getElementById('results').style.display = 'block';
                document.getElementById('results-content').innerHTML = `
                    <div class="error">
                        <strong>Erreur:</strong> ${error.message}
                        <pre>${error.stack}</pre>
                    </div>
                `;
            } finally {
                setRunStopButtonRunning(false);
            }
        }
        
        // Fonction pour calculer et afficher la formule de l'albedo
        function calculateAlbedoFormula(albedo, albedoReflectorCoeff) {
            if (!albedo || !albedoReflectorCoeff) return '';
            
            const elements = ['🌋', '🌊', '🌳', '🏖', '🧊', '⛅'];
            let total = 0;
            
            // Calculer le total
            elements.forEach(element => {
                const coverage_key = `🍰🪩${element}`;
                const coeff_key = `🪩🍰${element}`; // CORRECTION: clé correcte pour CONST['🪩🍰']
                const coverage = albedo[coverage_key] || 0;
                const coeff = albedoReflectorCoeff[coeff_key] || 0;
                total += coverage * coeff;
            });
            
            // essais graphique, ne modifie pas la formule : 
            const variableChar = '❀';//❉✪✩⛬✤ //<i></i>
            const elementsStr = elements.join(',');
            const formula = `🍰🪩📿<span style="font-size: 10px;"> = Σ(</span>🍰🪩<span style="font-size: 10px;">${variableChar} × </span>🪩🍰<span style="font-size: 10px;">${variableChar}</span><span style="font-size: 10px;">) | ${variableChar} <strong style="font-size: 1.1em;">∈</strong> { </span>${elementsStr}<span style="font-size: 10px;"> }</span>`;
            
            // Formater albedoReflectorCoeff pour l'affichage
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                return value.toFixed(3);
            };
            const formatValue = (value) => {
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'string') return `'${value}'`;
                return String(value);
            };
            const coeffEntries = Object.entries(albedoReflectorCoeff).map(([k, v]) => `'${k}':${formatValue(v)}`);
            const coeffStr = `{${coeffEntries.join(', ')}}`;
            
            // Formule simplifiée : seulement la formule principale et les coefficients
            let formulasHtml = `<strong>${formula}</strong>`;
            formulasHtml += `<br>${coeffStr}`;
            
            // Ajouter les formules de calcul de chaque couverture
            formulasHtml += `<br><br><strong>Formules de couverture :</strong><br>`;
            formulasHtml += `🍰🪩🌊 = Volume_océan / Profondeur_moyenne / Surface_planète<br>`;
            formulasHtml += `&nbsp;&nbsp;&nbsp;&nbsp;= (Masse_eau_océan / Densité_eau) / Profondeur / (4πR²)<br>`;
            formulasHtml += `&nbsp;&nbsp;&nbsp;&nbsp;= (🍰💧🌊 × ⚖️💧 / 1000) / 3700 / (4πR²)<br>`;
            formulasHtml += `🍰🪩🌳 = min(0.5, 🍰🪩🌊 × (1 - T_surface_C / 30)) si T < 30°C et 🍰🪩🌊 > 0.1<br>`;
            formulasHtml += `🍰🪩🧊 = min(0.9, 🍰💧🧊 × 0.9) (fraction eau en glace → couverture surface)<br>`;
            formulasHtml += `🍰🪩🏖 = 1.0 - (🍰🪩🌋 + 🍰🪩🌊 + 🍰🪩🌳 + 🍰🪩🧊) (surface restante)<br>`;
            formulasHtml += `🍰🪩⛅ = Si moderne : 0.20 + 0.10 × ☁️ (plage 0.20-0.30). Si Hadéen/Archéen : C_max × ☁️<br>`;
            
            return `<div class="formule">${formulasHtml}</div>`;
        }
        
        // Fonction pour calculer et afficher les formules des flux
        function calculateFluxFormulas(flux, soleil, albedo) {
            if (!flux || !soleil || !albedo) return '';
            
            let formulas = [];
            const CONST = window.CONST;
            const DATA = window.DATA;
            
            // 🧲☀️🔽: 🧲☀️🎱 × (1 - 🍰🪩📿) = Flux solaire absorbé (formule = calcul dans calculations_flux.js)
            const solar_avg = soleil['🧲☀️🎱'];
            const albedo_val = albedo['🍰🪩📿'];
            const calculated = solar_avg * (1 - albedo_val);
            const actual = flux['🧲☀️🔽'];
            
            if (solar_avg == null || albedo_val == null || calculated == null || actual == null) {
                return '';
            }
            const matchSolar = (Math.abs(calculated - actual) < 0.01) ? ' ✓' : ` (affiché: ${actual.toFixed(2)})`;
            formulas.push(`<strong>🧲☀️🔽</strong>: <strong>🧲☀️🎱</strong> × (1 - <strong>🍰🪩📿</strong>) = ${solar_avg.toFixed(2)} × (1 - ${albedo_val.toFixed(4)}) = ${calculated.toFixed(2)} W/m²${matchSolar}`);
            
            // 🧲🌕🔽: Flux géothermique (constant)
            if (flux['🧲🌕🔽'] !== undefined) {
                formulas.push(`<strong>🧲🌕🔽</strong>: Flux géothermique (constant) = ${flux['🧲🌕🔽'].toFixed(2)} W/m²`);
            }
            
            // 🧲🌑🔼: σ × T⁴ = Flux émis par la surface (corps noir) — T = DATA['🧮']['🧮🌡️'] (même clé que le calcul)
            if (flux['🧲🌑🔼'] !== undefined && DATA && DATA['🧮'] && DATA['🧮']['🧮🌡️'] != null) {
                const T = DATA['🧮']['🧮🌡️'];
                const sigma = CONST.STEFAN_BOLTZMANN;
                const calculated = sigma * Math.pow(T, 4);
                const actual = flux['🧲🌑🔼'];
                const match = (Math.abs(calculated - actual) < 0.01) ? ' ✓' : ` (affiché: ${actual.toFixed(2)}, écart: ${(actual - calculated).toFixed(2)})`;
                formulas.push(`<strong>🧲🌑🔼</strong>: σ × T⁴ = ${sigma.toExponential(2)} × ${T.toFixed(2)}⁴ = ${calculated.toFixed(2)} W/m²${match}`);
                formulas.push(`&nbsp;&nbsp;&nbsp;&nbsp;Flux émis par la surface (corps noir). ⚠️ Ce n'est PAS le flux qui sort au sommet (c'est 🧲🌈🔼)`);
            }
            
            // 🧲🌈🔼: Σ[λ=0.1→100μm] I_λ(z_max) × Δλ = Aire sous courbe spectrale réelle
            if (flux['🧲🌈🔼'] !== undefined) {
                formulas.push(`<strong>🧲🌈🔼</strong>: Σ[λ=0.1→100μm] I_λ(z_max) × Δλ = ${flux['🧲🌈🔼'].toFixed(2)} W/m²`);
                formulas.push(`&nbsp;&nbsp;&nbsp;&nbsp;Aire sous courbe spectrale réelle (émission au sommet atmosphère, après transfert radiatif couche par couche)`);
            }
            
            // 🧲🪩🔼: 🧲☀️🎱 - 🧲☀️🔽 = 🧲☀️🎱 × 🍰🪩📿 = Flux réfléchi par albedo
            if (flux['🧲🪩🔼'] !== undefined && soleil && soleil['🧲☀️🎱'] !== undefined && flux['🧲☀️🔽'] !== undefined) {
                const solar_avg = soleil['🧲☀️🎱'];
                const calculated1 = solar_avg - flux['🧲☀️🔽'];
                const calculated2 = albedo && albedo['🍰🪩📿'] !== undefined ? solar_avg * albedo['🍰🪩📿'] : calculated1;
                const actual = flux['🧲🪩🔼'];
                formulas.push(`<strong>🧲🪩🔼</strong>: <strong>🧲☀️🎱</strong> - <strong>🧲☀️🔽</strong> = <strong>🧲☀️🎱</strong> × <strong>🍰🪩📿</strong> = ${calculated2.toFixed(2)} W/m²`);
            }
            
            // 🔺🧲: 🧲☀️🔽 + 🧲🌕🔽 - 🧲🌈🔼 (formule = calcul dans calculations_flux.js)
            if (flux['🔺🧲'] !== undefined && flux['🧲☀️🔽'] !== undefined && flux['🧲🌕🔽'] !== undefined && flux['🧲🌈🔼'] !== undefined) {
                const calculated = flux['🧲☀️🔽'] + flux['🧲🌕🔽'] - flux['🧲🌈🔼'];
                const actual = flux['🔺🧲'];
                const matchDelta = (Math.abs(calculated - actual) < 0.01) ? ' ✓' : ` (affiché: ${actual.toFixed(2)})`;
                formulas.push(`<strong>🔺🧲</strong>: <strong>🧲☀️🔽</strong> + <strong>🧲🌕🔽</strong> - <strong>🧲🌈🔼</strong> = ${flux['🧲☀️🔽'].toFixed(2)} + ${flux['🧲🌕🔽'].toFixed(2)} - ${flux['🧲🌈🔼'].toFixed(2)} = ${calculated.toFixed(2)} W/m²${matchDelta}`);
                formulas.push(`&nbsp;&nbsp;&nbsp;&nbsp;Delta équilibre radiatif (flux entrant - flux sortant). En équilibre: 🔺🧲 ≈ 0`);
            }
            
            if (formulas.length === 0) return '';
            
            return `<div class="formule">${formulas.join('<br>')}</div>`;
        }
        
        // Fonction json2html pour convertir un objet JSON en HTML formaté
        // Utilise JSON.stringify puis formate pour correspondre à grammar.txt (guillemets simples)
        function json2html(obj, title, source, objName = null, categoryKey = null) {
            if (!obj) return '';
            
            // Formater les nombres : notation scientifique pour grands nombres, 3 décimales toujours
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                if (value === 0) return '0.000';
                // Utiliser notation scientifique si |value| > 1000 ou |value| < 0.001
                if (Math.abs(value) > 1000 || (Math.abs(value) < 0.001 && value !== 0)) {
                    return value.toExponential(3);
                }
                // Sinon, 3 décimales
                return value.toFixed(3);
            };
            
            // Formater récursivement l'objet
            const formatValue = (value) => {
                if (value === null) return 'null';
                if (value === undefined) return 'undefined';
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'boolean') return value.toString();
                if (typeof value === 'string') return `'${value}'`;
                if (Array.isArray(value)) {
                    return '[' + value.map(formatValue).join(', ') + ']';
                }
                if (typeof value === 'object') {
                    const entries = Object.entries(value).map(([k, v]) => `'${k}':${formatValue(v)}`);
                    return '{' + entries.join(', ') + '}';
                }
                return String(value);
            };
            
            // Construire la chaîne JSON formatée
            let jsonStr = formatValue(obj);
            
            // Ajouter le logo si categoryKey fourni (sans objName)
            if (categoryKey) {
                // Utiliser juste le logo, sans nom de description
                jsonStr = `${categoryKey}=${jsonStr}`;
            } else if (objName) {
                // Si pas de categoryKey mais objName, utiliser juste objName
                jsonStr = `${objName}=${jsonStr}`;
            }
            
            // Ne pas afficher le titre (description) - juste le JSON avec le logo
            // Ajouter les formules depuis FORM si categoryKey fourni
            let formuleHtml = '';
            if (categoryKey && window.FORM && window.FORM[categoryKey]) {
                const formulas = [];
                for (const key in obj) {
                    if (window.FORM[categoryKey][key]) {
                        let formula = window.FORM[categoryKey][key];
                        // Ignorer les formules dont la description commence par "!" (variables internes aux calculs)
                        if (formula.startsWith('!')) continue;
                        // Remplacer %1, %2, %3... par les valeurs réelles depuis obj[key]
                        // %1 = valeur actuelle, %2 = valeur précédente (si disponible), etc.
                        const value = obj[key];
                        if (typeof value === 'number') {
                            // Formater selon la valeur (notation scientifique si grand/petit)
                            const formatValue = (val) => {
                                if (val === 0) return '0.000';
                                if (Math.abs(val) > 1000 || (Math.abs(val) < 0.001 && val !== 0)) {
                                    return val.toExponential(3);
                                }
                                return val.toFixed(3);
                            };
                            formula = formula.replace(/%1/g, formatValue(value));
                            formula = formula.replace(/%2/g, formatValue(value)); // Pour l'instant, %2 = %1
                        }
                        // Rendre les symboles mathématiques plus visibles
                        formula = formula.replace(/∀/g, '<strong style="font-size: 1.1em;">∀</strong>');
                        formula = formula.replace(/∈/g, '<strong style="font-size: 1.1em;">∈</strong>');
                        formulas.push(`${key}: ${formula}`);
                    }
                }
                if (formulas.length > 0) {
                    formuleHtml = `<div class="formule">${formulas.join('<br>')}</div>`;
                }
            }
            
            let html = `
                <div class="config-section">
                    <div class="config-value">${jsonStr}</div>
                    ${formuleHtml ? `<div class="formule-container notVisible">${formuleHtml}</div>` : ''}
                </div>
            `;
            return html;
        }
        
        // Fonction pour formater JSON avec notation scientifique pour les grands/petits nombres
        function formatJSONCompact(obj) {
            return JSON.stringify(obj, (key, value) => {
                if (typeof value === 'number') {
                    // Utiliser notation scientifique si > 1000 ou < 0.001
                    if (Math.abs(value) > 1000 || (Math.abs(value) < 0.001 && value !== 0)) {
                        return value.toExponential(3);
                    }
                    // Sinon, garder la notation décimale avec 3 décimales max
                    return parseFloat(value.toFixed(3));
                }
                return value;
            });
        }
        
        function displayResults(result) {
            const DATA = window.DATA;
            const CONST = window.CONST;
            const configDiv = document.getElementById('config');
            const configContent = document.getElementById('config-content');
            
            if (!configDiv || !configContent) return;
            
            // Récupérer l'époque et le nom depuis DATA
            const EPOCH = DATA['📅'];
            const epochId = DATA['📜']['🗿'];
            const epochName = window.CHARS_DESC[epochId] || epochId;
            
            // Calculer la date actuelle (📅) : EPOCH['▶'] - ticTime effect
            const ticTimeMa = DATA['📜']['📿💫'] * 50;
            const currentDateMa = (EPOCH['▶'] / 1e6) - ticTimeMa;
            const currentDateStr = currentDateMa >= 0 ? `-${currentDateMa.toFixed(0)}Ma` : `${Math.abs(currentDateMa).toFixed(0)}Ma`;
            
            // Mettre à jour le titre avec le nom de l'époque et la description
            const configTitle = configDiv.querySelector('h2');
            if (configTitle) {
                const button = configTitle.querySelector('.toggle-button');
                const buttonText = button ? button.textContent : 'Formules +';
                configTitle.innerHTML = `📋 Configuration : ${epochId} ${epochName} | 📅: ${currentDateStr} <button class="toggle-button" onclick="toggleConfig()">${buttonText}</button>`;
            }
            
            let html = '';
            
            // Config minimale : pas de flux, pas de spectre. 🫧💧🪩🧲 sont dans Convergence (cycle eau + radiatif).
            html += json2html(DATA['🔘'], null, null, null, '🔘');
            html += json2html(DATA['📜'], null, null, null, '📜');
            html += json2html(EPOCH['🕰'], null, null, null, '🕰');
            html += json2html(DATA['⚖️'], null, null, null, '⚖️');
            html += json2html(DATA['🌕'] || {}, null, null, null, '🌕');
            html += json2html(DATA['☀️'] || {}, null, null, null, '☀️');

            configContent.innerHTML = html;
            configDiv.style.display = 'block';
            
            // 🔒 Ne pas appeler displayConvergence() ici pour éviter les boucles infinies
            // displayConvergence() sera appelé séparément si nécessaire
        }
        
        // Fonction pour comparer deux objets et retourner seulement les différences
        function getDifferences(current, previous) {
            if (!previous) return current; // Première itération : afficher tout
            
            const diff = {};
            for (const key in current) {
                const currentVal = current[key];
                const previousVal = previous[key];
                
                // Comparer les valeurs (tolérance pour les nombres)
                if (typeof currentVal === 'number' && typeof previousVal === 'number') {
                    if (Math.abs(currentVal - previousVal) > 0.0001) {
                        diff[key] = currentVal;
                    }
                } else if (typeof currentVal === 'object' && currentVal !== null && typeof previousVal === 'object' && previousVal !== null) {
                    // Objets imbriqués : comparer récursivement
                    const nestedDiff = getDifferences(currentVal, previousVal);
                    if (Object.keys(nestedDiff).length > 0) {
                        diff[key] = nestedDiff;
                    }
                } else if (currentVal !== previousVal) {
                    // Valeurs différentes
                    diff[key] = currentVal;
                }
            }
            return diff;
        }
        
        function displayConvergence() {
            try {
            const DATA = window.DATA;
            const CONST = window.CONST || { KELVIN_TO_CELSIUS: 273.15 };
            const convergenceDiv = document.getElementById('convergence');
            const convergenceContent = document.getElementById('convergence-content');
            
            if (!convergenceDiv || !convergenceContent) return;
            if (!DATA || !DATA['🧮']) {
                convergenceContent.innerHTML = '<div class="config-value">Aucune donnée de convergence disponible</div>';
                convergenceDiv.style.display = 'block';
                return;
            }
            
            // Mettre à jour le titre avec la température en °C
            const convergenceTitle = convergenceDiv.querySelector('h2');
            if (convergenceTitle) {
                const T_K = DATA['🧮']['🧮🌡️'];
                const temp_C = (T_K != null && Number.isFinite(T_K)) ? (T_K - CONST.KELVIN_TO_CELSIUS).toFixed(3) : '—';
                const formulesButton = convergenceTitle.querySelector('.toggle-formules');
                const formulesButtonText = formulesButton ? formulesButton.textContent : 'Formules +';
                const detailsVisible = convergenceDiv.classList.contains('details-visible');
                const detailsButtonText = detailsVisible ? 'Détails −' : 'Détails +';
                convergenceTitle.innerHTML = `⚙ Convergence : ${temp_C}°C <button class="toggle-button toggle-details" onclick="toggleConvergenceDetails(); return false;">${detailsButtonText}</button><button class="toggle-button toggle-formules" onclick="toggleConvergence()">${formulesButtonText}</button>`;
            }
            
            let html = '';
            
            // Afficher les détails de convergence si disponible (exclure Init = Configuration)
            // Par cycle eau : 🫧, 💧, 🪩 une fois. À chaque calcul radiatif : 🧮 et 🧲 uniquement.
            const history = Array.isArray(DATA['🧮']['previous']) ? DATA['🧮']['previous'] : [];
            if (Array.isArray(history) && history.length > 0) {
                const iterations_to_show = history.filter(s => s.phase !== 'Init' || s.innerIter === -1);
                const radiatif_only = iterations_to_show.filter(s => s.innerIter != null);
                const last_state = radiatif_only.length ? radiatif_only[radiatif_only.length - 1] : (iterations_to_show[iterations_to_show.length - 1] || history[history.length - 1]);

                // Grouper par cycle eau (outerIter)
                const byCycle = new Map();
                iterations_to_show.forEach(state => {
                    const k = state.outerIter !== undefined ? state.outerIter : 0;
                    if (!byCycle.has(k)) byCycle.set(k, []);
                    byCycle.get(k).push(state);
                });
                const outerOrder = [...byCycle.keys()].sort((a, b) => Number(a) - Number(b));

                outerOrder.forEach(outerIter => {
                    const states = byCycle.get(outerIter);
                    const cycleState = states.find(s => s.phase === 'CycleEau');
                    const radiatifStates = states.filter(s => s.innerIter != null).sort((a, b) => (a.innerIter || 0) - (b.innerIter || 0));

                    // 💧 cycle de l'eau : 🫧, 💧, 🪩 (calcul avec T0, sans flux)
                    html += `<div class="iteration-header"><strong>💧 cycle de l'eau ${outerIter}</strong></div>`;
                    if (cycleState && cycleState.data_snapshot) {
                        ['🫧', '💧', '🪩'].forEach(cat => {
                            if (cycleState.data_snapshot[cat]) html += json2html(cycleState.data_snapshot[cat], '', '', null, cat);
                        });
                    }

                    // 🌈 calcul radiatif 0..20 par tour (plusieurs tours si cycle eau a changé en zone liquide)
                    const byPass = new Map();
                    radiatifStates.forEach(s => {
                        const p = (s.waterPass != null) ? s.waterPass : 0;
                        if (!byPass.has(p)) byPass.set(p, []);
                        byPass.get(p).push(s);
                    });
                    [...byPass.keys()].sort((a, b) => a - b).forEach(waterPass => {
                        const passStates = byPass.get(waterPass).sort((a, b) => (a.innerIter || 0) - (b.innerIter || 0));
                        if (waterPass > 0) html += `<div class="iteration-header" style="margin-top:8px;color:var(--muted);">🌈 tour radiatif ${waterPass + 1} (cycle eau mis à jour)</div>`;
                        const safeNum = (v, def) => { if (v == null) return def; const n = Number(v); if (!Number.isFinite(n)) return def; return (Math.abs(n) >= 1e3 || (Math.abs(n) < 1e-2 && n !== 0)) ? n.toExponential(3) : n.toFixed(3); };
                        const safeNumTemp = (v, def) => { if (v == null) return def; const n = Number(v); if (!Number.isFinite(n)) return def; return n.toFixed(1); };
                        passStates.forEach(state => {
                            try {
                                if (!state || !state.data_snapshot) return;
                                const innerIter = state.innerIter;
                                const T = safeNumTemp(state.temperature_C, '-');
                                const albedo = safeNum(state.albedo, '-');
                                const phase = (state.phase != null) ? String(state.phase) : '-';
                                const delta = safeNum(state.delta_equilibre, '-');
                                const yinYang = state.yinYang != null ? state.yinYang : '-';
                                const iterLabel = (innerIter === -1) ? 'Init' : innerIter;
                                const dichoBounds = (state.phase === 'Dicho' && state.dichoT_low_C != null && state.dichoT_high_C != null)
                                    ? ` [🔽: ${safeNumTemp(state.dichoT_low_C, '-')}°C, 🔼: ${safeNumTemp(state.dichoT_high_C, '-')}°C]`
                                    : '';
                                const seuil = (state.data_snapshot['🧮'] && state.data_snapshot['🧮']['🧲🔬'] != null) ? state.data_snapshot['🧮']['🧲🔬'] : null;
                                const seuilStr = seuil != null ? safeNum(seuil, '-') : '-';
                                const deltaVal = state.delta_equilibre != null ? Number(state.delta_equilibre) : NaN;
                                const arretOk = (Number.isFinite(deltaVal) && seuil != null && Math.abs(deltaVal) <= seuil) ? 'oui' : 'non';
                                html += `<div class="iteration-header">🌈 calcul radiatif ${iterLabel} :: {T°: ${T}°C, Albedo: ${albedo}} => Δ: ${delta} W/m² => ⚧: ${phase} => ☯: ${yinYang} => arrêt |Δ|≤${seuilStr} W/m²: ${arretOk}${dichoBounds}</div>`;
                                html += '<div class="convergence-details-block">';
                                if (state.data_snapshot['🧮']) {
                                    const m = { ...state.data_snapshot['🧮'] };
                                    delete m.previous;
                                    html += json2html(m, '', '', null, '🧮');
                                }
                                if (state.data_snapshot['🧲']) html += json2html(state.data_snapshot['🧲'], '', '', null, '🧲');
                                html += '</div>';
                            } catch (stateErr) {
                                console.warn('État de convergence ignoré (données invalides):', stateErr);
                            }
                        });
                    });
                });

                // Afficher la température finale (dernier calcul radiatif) — T° toujours en décimal, 1 décimale
                const safeNumLast = (v) => { if (v == null) return '—'; const n = Number(v); if (!Number.isFinite(n)) return '—'; return (Math.abs(n) >= 1e3 || (Math.abs(n) < 1e-2 && n !== 0)) ? n.toExponential(3) : n.toFixed(3); };
                const safeNumTempLast = (v) => { if (v == null) return '—'; const n = Number(v); if (!Number.isFinite(n)) return '—'; return n.toFixed(1); };
                const Tc = safeNumTempLast(last_state && last_state.temperature_C);
                const Tk = safeNumTempLast(last_state && last_state.temperature_K);
                html += `<div class="config-value"><strong>Température finale: ${Tc}°C (${Tk}K)</strong></div>`;
            }
            
            // Toujours afficher le panneau même si html est vide
            convergenceContent.innerHTML = html || '<div class="config-value">Aucune donnée de convergence disponible</div>';
            convergenceDiv.style.display = 'block';
            } catch (err) {
                console.error('❌ displayConvergence:', err);
                const convergenceContent = document.getElementById('convergence-content');
                if (convergenceContent) convergenceContent.innerHTML = `<div class="config-value error">Erreur affichage: ${err.message}</div>`;
            }
        }
        
        // 🔒 Exposer displayConvergence sur window pour que calculations_flux.js puisse l'appeler
        window.displayConvergence = displayConvergence;
