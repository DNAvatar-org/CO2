<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test computeRadiativeTransfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Police emoji pour les logos */
        @font-face {
            font-family: 'EmojiFont';
            src: local('Apple Color Emoji'),
                 local('Segoe UI Emoji'),
                 local('Noto Color Emoji'),
                 local('Android Emoji'),
                 local('EmojiOne Color'),
                 local('Twemoji Mozilla');
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        /* Appliquer la police emoji aux éléments contenant des logos */
        .config-value,
        .config-title,
        code,
        pre {
            font-family: 'EmojiFont', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Android Emoji', monospace, sans-serif;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }
        
        .controls-left {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
        }
        
        .timeline-horizontal-container {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
        }
        
        .timeline-date-display, .timeline-horloge-display {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #e0e0e0;
            white-space: nowrap;
        }
        
        .timeline-hourglass, .horloge-icon {
            font-size: 16px;
        }
        
        .epochs-container-horizontal {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .epoch-btn-horizontal {
            font-size: 24px;
            font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
            background: none !important;
            border: none !important;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer !important;
            padding: 5px;
            transition: filter 0.3s ease, text-shadow 0.3s ease;
            width: 40px;
            height: 40px;
            position: relative;
            filter: grayscale(100%);
            text-shadow: none;
        }
        
        .epoch-btn-horizontal:hover {
            filter: grayscale(0%);
            text-shadow: 0 0 8px rgba(81, 207, 102, 0.6);
        }
        
        .epoch-btn-horizontal.selected {
            filter: grayscale(0%);
            text-shadow: 0 0 12px rgba(81, 207, 102, 1);
            box-shadow: 0 0 0 2px rgba(81, 207, 102, 0.8);
        }
        
        .timeline-events-logos {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .timeline-event-logo {
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.3s ease;
            filter: grayscale(100%);
        }
        
        .timeline-event-logo:hover {
            transform: scale(1.1);
            filter: grayscale(0%);
        }
        
        .controls-right {
            display: flex;
            flex-direction: row;
            gap: 10px;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-size: 12px;
            color: #aaa;
        }
        
        select, input[type="number"] {
            background: #3a3a3a;
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            width: 200px;
        }
        
        button {
            background: #4a9eff;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #3a8eef;
        }
        
        .icon-button {
            background: #3a3a3a;
            border: 2px solid #555;
            color: #e0e0e0;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .icon-button:hover {
            background: #4a4a4a;
            border-color: #666;
        }
        
        .icon-button.selected {
            background: #51cf66;
            border-color: #51cf66;
            color: white;
        }
        
        .icon-button.selected:hover {
            background: #40bf55;
            border-color: #40bf55;
        }
        
        .results {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .results h2 {
            margin-bottom: 15px;
            color: #fff;
        }
        
        .result-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        .result-section h3 {
            margin-bottom: 10px;
            color: #4a9eff;
        }
        
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }
        
        .result-item:last-child {
            border-bottom: none;
        }
        
        .result-label {
            color: #aaa;
        }
        
        .result-value {
            color: #fff;
            font-weight: bold;
        }
        
        .error {
            color: #ff6b6b;
            background: #3a1a1a;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        
        .log {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 2px 0;
            color: #aaa;
        }
        
        .log-entry.error {
            color: #ff6b6b;
        }
        
        .log-entry.success {
            color: #51cf66;
        }
        
        .config-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        .config-title {
            font-weight: bold;
            color: #4a9eff;
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .config-value {
            color: beige;
            margin-top: 5px;
            font-family: 'EmojiFont', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Android Emoji', monospace, sans-serif;
        }
        
        .formule {
            color: gray;
            margin-top: -5px;
            margin-left: 35px;
            font-size: 11px;
        }
        
        .results.replied .config-title {
            display: none;
        }
        
        .results.replied .config-section {
            margin-bottom: 0;
            padding: 5px;
        }
        
        .results.replied .formule {
            display: none;
        }
        
        .toggle-button {
            background: #4a9eff;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .toggle-button:hover {
            background: #3a8eef;
        }
        
        .results h2 {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #0a0a0a;
            border-radius: 4px;
        }
        
        .config-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .config-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        
        .config-item:last-child {
            border-bottom: none;
        }
        
        .config-label {
            font-weight: bold;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test computeRadiativeTransfer</h1>
        
        <!-- Légende des logos selon grammar.txt -->
        <div class="results" style="margin-bottom: 20px; background: #1a2a3a; border-left: 4px solid #4a9eff;">
            <h2 style="color: #4a9eff; margin-bottom: 10px;">📖 Légende des logos</h2>
            <div id="legend-content">
                <!-- La légende sera générée dynamiquement par window.generateLegend() -->
            </div>
        </div>
        
        <div class="controls">
            <div class="controls-left">
                <!-- Timeline horizontale -->
                <div class="timeline-horizontal-container">
                    <!-- Date de l'époque -->
                    <div class="timeline-date-display">
                        <span class="timeline-hourglass">📅</span>
                        <span class="epoch-start-time" id="epoch-start-time">-5000 Ma</span>
                    </div>
                    
                    <!-- Horloge / TicTime -->
                    <div class="timeline-horloge-display">
                        <span class="horloge-icon">🕰</span>
                        <span class="info-time" id="info-time">Actions</span>
                    </div>
                    
                    <!-- Boutons d'époques -->
                    <div class="epochs-container-horizontal" id="epochs-container-horizontal">
                        <!-- Sera rempli dynamiquement -->
                    </div>
                    
                    <!-- Boutons d'actions (événements) -->
                    <div class="timeline-events-logos" id="timeline-events-logos">
                        <!-- Sera rempli dynamiquement -->
                    </div>
                </div>
            </div>
            
            <div class="controls-right">
                <button class="icon-button" id="anim-toggle" onclick="toggleAnim()" title="Animation">🎬</button>
                <button class="icon-button" onclick="runTest()" title="Exécuter">▶️</button>
                <button class="icon-button" onclick="clearLog()" title="Effacer les logs">🗑️</button>
            </div>
        </div>
        
        <div id="config" class="results replied" style="display: none;">
            <h2>📋 Configuration <button class="toggle-button" onclick="toggleConfig()">x</button></h2>
            <div id="config-content"></div>
        </div>
        
        <div id="convergence" class="results replied" style="display: none;">
            <h2>⚙ Convergence <button class="toggle-button" onclick="toggleConvergence()">x</button></h2>
            <div id="convergence-content"></div>
        </div>
        
        <div id="results" class="results" style="display: none;">
            <h2>📊 Résultats</h2>
            <div id="results-content"></div>
        </div>
        
        <div class="log">
            <h3>📝 Logs de la console</h3>
            <div id="log-content"></div>
        </div>
    </div>

    <!-- Charger les dépendances dans l'ordre -->
    <script src="../../organigramme/configOrganigramme.js"></script>
    <script src="grammar.js"></script>
    <script src="../timeline/configTimeline.js"></script>
    <script src="../timeline/timeline.js"></script>
    <script src="../events.js"></script>
    <script src="../physics.js"></script>
    <script src="../calculations.js"></script>
    <script src="../calculations_h2o.js"></script>
    <script src="../calculations_albedo.js"></script>
    <script src="../calculations_atm.js"></script>
    <script src="compute.js"></script>
    <script src="calculations_flux.js"></script>
    
    <script>
        // Fonction helper pour construire les clés de logos dans le HTML (utilise window.getLogoKey si disponible)
        function getLogoKeyHTML(...names) {
            if (typeof window !== 'undefined' && window.getLogoKey) {
                return window.getLogoKey(...names);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return names.map(name => window.LOGOS[name] || '').join('');
        }
        
        function getLogoHTML(name) {
            if (typeof window !== 'undefined' && window.getLogo) {
                return window.getLogo(name);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return window.LOGOS[name] || '';
        }
        
        // Intercepter console.log pour afficher dans la page
        const originalLog = console.log;
        const originalError = console.error;
        const logContent = document.getElementById('log-content');
        
        function addLogEntry(message, type = 'log') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLogEntry(args.join(' '), 'log');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLogEntry(args.join(' '), 'error');
        };
        
        function clearLog() {
            logContent.innerHTML = '';
        }
        
        function toggleAnim() {
            const animButton = document.getElementById('anim-toggle');
            if (animButton) {
                const isSelected = animButton.classList.contains('selected');
                if (isSelected) {
                    animButton.classList.remove('selected');
                } else {
                    animButton.classList.add('selected');
                }
                // Créer ou mettre à jour plot-anim-toggle pour compatibilité
                let plotAnimToggle = document.getElementById('plot-anim-toggle');
                if (!plotAnimToggle) {
                    plotAnimToggle = document.createElement('input');
                    plotAnimToggle.type = 'checkbox';
                    plotAnimToggle.id = 'plot-anim-toggle';
                    plotAnimToggle.style.display = 'none';
                    document.body.appendChild(plotAnimToggle);
                }
                plotAnimToggle.checked = !isSelected;
            }
        }
        
        // Fonction helper pour convertir les chemins relatifs en chemins absolus depuis la racine
        // Depuis static/compute/, on doit remonter de 2 niveaux pour atteindre la racine
        function getImagePath(relativePath) {
            if (!relativePath) return relativePath;
            // Si le chemin commence déjà par http:// ou https:// ou /, le retourner tel quel
            if (relativePath.startsWith('http://') || relativePath.startsWith('https://') || relativePath.startsWith('/')) {
                return relativePath;
            }
            // Sinon, remonter de 2 niveaux depuis static/compute/ pour atteindre la racine
            return '../../' + relativePath;
        }
        
        // Générer la timeline horizontale
        function generateHorizontalTimeline() {
            const epochsContainer = document.getElementById('epochs-container-horizontal');
            if (!epochsContainer || !window.configTimeline || !window.configTimeline.timeline) return;
            
            epochsContainer.innerHTML = '';
            
            window.configTimeline.timeline.forEach(item => {
                if (item.type === 'epoch') {
                    const button = document.createElement('button');
                    button.className = 'epoch-btn-horizontal';
                    button.setAttribute('data-epoch', item.id || item.name);
                    button.onclick = () => selectEpoch(item.id || item.name);
                    
                    // Si le logo est un fichier image
                    if (item.logo && typeof item.logo === 'string' && (item.logo.endsWith('.svg') || item.logo.endsWith('.png'))) {
                        const img = document.createElement('img');
                        img.src = getImagePath(item.logo);
                        img.alt = item.name;
                        img.style.width = '24px';
                        img.style.height = '24px';
                        img.style.objectFit = 'contain';
                        img.style.display = 'block';
                        img.style.margin = '0 auto';
                        img.style.pointerEvents = 'none';
                        button.appendChild(img);
                    } else {
                        // Sinon c'est un emoji/texte
                        button.textContent = item.logo || '?';
                        button.style.fontFamily = "'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
                    }
                    
                    epochsContainer.appendChild(button);
                }
            });
            
            // Sélectionner la première époque par défaut
            if (window.configTimeline.timeline.length > 0) {
                const firstEpoch = window.configTimeline.timeline.find(item => item.type === 'epoch');
                if (firstEpoch) {
                    selectEpoch(firstEpoch.id || firstEpoch.name);
                }
            }
        }
        
        // Sélectionner une époque
        function selectEpoch(epochId) {
            window.currentEpochName = epochId;
            
            // Mettre à jour les boutons
            document.querySelectorAll('.epoch-btn-horizontal').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.getAttribute('data-epoch') === epochId) {
                    btn.classList.add('selected');
                }
            });
            
            // Mettre à jour l'époque
            if (window.configTimeline && window.configTimeline.timeline) {
                const epoch = window.configTimeline.timeline.find(item => 
                    item.type === 'epoch' && (item.id === epochId || item.name === epochId)
                );
                if (epoch) {
                    window.epoch = epoch;
                    
                    // Mettre à jour la date de l'époque
                    const epochStartTime = document.getElementById('epoch-start-time');
                    if (epochStartTime && epoch.date) {
                        epochStartTime.textContent = epoch.date;
                    }
                }
            }
            
            // Mettre à jour les actions (boutons d'événements)
            updateEpochActions();
            
            // Réinitialiser le temps
            if (typeof window !== 'undefined') {
                window.infoTimeMa = 0;
                updateTimelineDisplay();
            }
        }
        
        // Mettre à jour l'affichage de la timeline
        function updateTimelineDisplay() {
            const infoTimeDisplay = document.getElementById('info-time');
            if (infoTimeDisplay) {
                const infoTimeMa = window.infoTimeMa || 0;
                if (infoTimeMa === 0) {
                    infoTimeDisplay.textContent = 'Actions';
                } else {
                    const deltaMa = infoTimeMa.toFixed(1).replace(/\.?0+$/, '');
                    infoTimeDisplay.textContent = `+${deltaMa} Ma`;
                }
            }
        }
        
        // Mettre à jour les actions selon l'époque (version simplifiée de events.js)
        function updateEpochActions() {
            const eventsLogos = document.getElementById('timeline-events-logos');
            if (!eventsLogos) return;
            
            eventsLogos.innerHTML = '';
            
            const currentEpochName = window.currentEpochName || 'Corps noir';
            const epoch = window.epoch;
            
            if (!epoch || !epoch.events) return;
            
            // Bouton météorite
            if (epoch.events.meteor) {
                const meteorBtn = document.createElement('img');
                meteorBtn.src = getImagePath('fonts/pics/ice_meteorite.png');
                meteorBtn.alt = 'Météorite';
                meteorBtn.className = 'timeline-event-logo btn-events';
                meteorBtn.title = 'Météorite de glace';
                meteorBtn.addEventListener('click', () => {
                    // Ajouter +50Ma
                    if (typeof window !== 'undefined') {
                        window.infoTimeMa = (window.infoTimeMa || 0) + 50;
                        updateTimelineDisplay();
                    }
                });
                eventsLogos.appendChild(meteorBtn);
            }
        }
        
        // Initialiser les variables globales nécessaires
        function initializeGlobals() {
            // Initialiser window.currentEpochName depuis le bouton sélectionné
            const selectedBtn = document.querySelector('.epoch-btn-horizontal.selected');
            if (selectedBtn) {
                window.currentEpochName = selectedBtn.getAttribute('data-epoch');
            } else {
                window.currentEpochName = 'corps-noir'; // Par défaut
            }
            
            // Initialiser window.epoch depuis timeline (les époques sont aux indices pairs)
            if (window.configTimeline && window.configTimeline.timeline) {
                const epochIndex = window.configTimeline.timeline.findIndex(item => 
                    item.type === 'epoch' && (item.id === window.currentEpochName || item.name === window.currentEpochName)
                );
                if (epochIndex >= 0) {
                    window.epoch = window.configTimeline.timeline[epochIndex];
                } else {
                    // Fallback : première époque
                    window.epoch = window.configTimeline.timeline.find(item => item.type === 'epoch');
                }
            }
            
            // Initialiser window.getGeologicalPeriodByName si nécessaire
            if (!window.getGeologicalPeriodByName && window.configTimeline && window.configTimeline.timeline) {
                window.getGeologicalPeriodByName = function(name) {
                    return window.configTimeline.timeline.find(epoch => epoch.id === name);
                };
            }
            
            // Initialiser window.h2oTotalFromMeteorites (plus de champ input, initialisé à 0)
            window.h2oTotalFromMeteorites = 0;
            
            // Initialiser window.isH2O_eds, window.isCO2_eds, window.isCH4_eds (pour getEnabledStates)
            window.isH2O_eds = true;
            window.isCO2_eds = true;
            window.isCH4_eds = true;
            window.isAlbedo = true;
            
            // Initialiser window.enabledStates
            if (window.getEnabledStates) {
                window.getEnabledStates();
            }
            
            // Initialiser window.T0 (old_T0 n'existe plus, utilise dateConfig['🌡️🏮'] qui vient de window.T0)
            const animBtn = document.getElementById('anim-toggle');
            const animEnabled = animBtn ? animBtn.classList.contains('selected') : false;
            if (animEnabled) {
                // Si anim activé, initialiser T0 à 180K pour test (sera utilisé comme old_T0 dans dateConfig)
                if (window.T0 === undefined || window.T0 === null) {
                    window.T0 = 180.0;
                }
            }
            // Initialiser T0 si nécessaire
            if (window.T0 === undefined || window.T0 === null) {
                window.T0 = 180.0;
            }
            
            // Initialiser window.infoTimeMa
            window.infoTimeMa = 0;
            
            // Initialiser window.waterVaporEnabled
            window.waterVaporEnabled = true;
            
            // Initialiser window.h2oVaporPercent
            window.h2oVaporPercent = 0;
            
            // Initialiser window.convergencePrecision_K
            window.convergencePrecision_K = 0.1;
            
            // Créer ou mettre à jour plot-anim-toggle pour compatibilité
            let plotAnimToggle = document.getElementById('plot-anim-toggle');
            if (!plotAnimToggle) {
                plotAnimToggle = document.createElement('input');
                plotAnimToggle.type = 'checkbox';
                plotAnimToggle.id = 'plot-anim-toggle';
                plotAnimToggle.style.display = 'none';
                document.body.appendChild(plotAnimToggle);
            }
            plotAnimToggle.checked = animEnabled;
            
            // Mettre à jour le bouton anim
            if (animBtn) {
                if (animEnabled) {
                    animBtn.classList.add('selected');
                } else {
                    animBtn.classList.remove('selected');
                }
            }
        }
        
        async function runTest() {
            try {
                initializeGlobals();
                
                // Afficher la grammaire complète selon grammar.txt
                const getKey = getLogoKeyHTML;
                const get = getLogoHTML;
                console.log('📖 Grammar.txt - Structure complète des objets:');
                console.log('');

        // Fonction pour calculer et afficher la formule de l'albedo
        function calculateAlbedoFormula(albedo, albedoReflectorCoeff) {
            if (!albedo || !albedoReflectorCoeff) return '';
            
            const elements = ['🌋', '🌊', '🌳', '🏖', '🧊', '⛅'];
            let total = 0;
            
            // Calculer le total
            elements.forEach(element => {
                const coverage_key = `🥒🪞${element}`;
                const coeff_key = `🥒${element}🪞`;
                const coverage = albedo[coverage_key] || 0;
                const coeff = albedoReflectorCoeff[coeff_key] || 0;
                total += coverage * coeff;
            });
            
            // essais graphique, ne modifie pas la formule : 
            const variableChar = '❀';//❉✪✩⛬✤ //<i></i>
            const elementsStr = elements.join(',');
            const formula = `🥒🪞🎓<span style="font-size: 15px;"> = Σ(</span>🥒🪞<span style="font-size: 15px;">${variableChar} × </span>🥒<span style="font-size: 15px;">${variableChar}</span>🪞<span style="font-size: 15px;">) | ${variableChar} ∈ { </span>${elementsStr}<span style="font-size: 15px;"> }</span> => ${total.toFixed(4)}`;
            
            // Formater albedoReflectorCoeff pour l'affichage
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                return value.toFixed(2);
            };
            const formatValue = (value) => {
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'string') return `'${value}'`;
                return String(value);
            };
            const coeffEntries = Object.entries(albedoReflectorCoeff).map(([k, v]) => `'${k}':${formatValue(v)}`);
            const coeffStr = `{${coeffEntries.join(', ')}}`;
            
            // Ajouter les formules de calcul des couvertures
            let coverageFormulas = [];
            const epoch = window.epoch;
            const T_surface_K = window.T0 || 255;
            const T_surface_C = T_surface_K - 273.15;
            const isHadeen = epoch?.id === 'hadeen';
            const ocean_coverage = albedo['🥒🪞🌊'] || 0;
            const ice_coverage = albedo['🥒🪞🧊'] || 0;
            const forest_coverage = albedo['🥒🪞🌳'] || 0;
            const volcano_coverage = albedo['🥒🪞🌋'] || 0;
            const desert_coverage = albedo['🥒🪞🏖'] || 0;
            const cloud_coverage = albedo['🥒🪞⛅'] || 0;
            
            // Formules de calcul des couvertures
            if (isHadeen) {
                coverageFormulas.push(`🥒🪞🌋 = 1.00 (Hadéen: volcan 100%)`);
                coverageFormulas.push(`🥒🪞🏖 = 0.00 (Hadéen: désert 0%)`);
            } else {
                if (volcano_coverage > 0) {
                    coverageFormulas.push(`🥒🪞🌋 = min(1.0, 🧲🌕 / 10000) si 🧲🌕 > 1000 W/m²`);
                }
                if (ocean_coverage > 0) {
                    coverageFormulas.push(`🥒🪞🌊 = 🥒💧🌊 (depuis h2o)`);
                }
                if (ice_coverage > 0) {
                    coverageFormulas.push(`🥒🪞🧊 = 🥒💧🧊 (depuis h2o)`);
                }
                if (forest_coverage > 0) {
                    coverageFormulas.push(`🥒🪞🌳 = min(0.5, 🥒🪞🌊 × (1 - 🌡️/30)) si 🌡️ < 30°C et 🥒🪞🌊 > 0.1`);
                }
                if (desert_coverage > 0) {
                    coverageFormulas.push(`🥒🪞🏖 = ${desert_coverage.toFixed(2)} (depuis config, pas calculé comme surface restante)`);
                } else {
                    coverageFormulas.push(`🥒🪞🏖 = 0.00 (non défini dans config, pas de désert par défaut)`);
                }
            }
            if (cloud_coverage > 0) {
                coverageFormulas.push(`🥒🪞⛅ = 🥒💧⛅ (depuis h2o)`);
            }
            
            let formulasHtml = formula;
            if (coverageFormulas.length > 0) {
                formulasHtml += '<br><small>Formules couvertures:</small><br><small>' + coverageFormulas.join('<br>') + '</small>';
            }
            
            return `<div class="formule">${formulasHtml}<br>albedoReflectorCoeff=${coeffStr}</div>`;
        }
        
        // Fonction pour calculer et afficher les formules des flux
        function calculateFluxFormulas(flux, soleil, albedo) {
            if (!flux) return '';
            
            let formulas = [];
            
            // Formule pour 🧲☀️🔽 (flux solaire absorbé)
            // SOURCE RÉELLE : window.flux['🧲☀️🔽'] est calculé avec calculateSolarFluxAbsorbed()
            // qui utilise maintenant window.soleil['🧲☀️🎱'] comme source unique
            // Par définition : 🧲☀️🎱 = 🧲☀️📜 / 4 (rapporté au rayon au sol pour les m²)
            // 🧲☀️🔽 = 🧲☀️🎱 × (1 - 🥒🪞🎓) (on enlève l'albedo, c'est le flux au sol reçu du soleil)
            if (flux['🧲☀️🔽'] !== undefined && soleil && soleil['🧲☀️🎱'] !== undefined && albedo && albedo['🥒🪞🎓'] !== undefined) {
                const solar_avg = soleil['🧲☀️🎱'];
                const albedo_val = albedo['🥒🪞🎓'];
                const calculated = solar_avg * (1 - albedo_val);
                const actual = flux['🧲☀️🔽'];
                
                // Vérifier que le calcul correspond (tolérance 0.01 W/m²)
                const match = Math.abs(calculated - actual) < 0.01 ? '✓' : '⚠';
                formulas.push(`<strong>🧲☀️🔽</strong> = <strong>🧲☀️🎱</strong> × (1 - <strong>🥒🪞🎓</strong>) = ${solar_avg.toFixed(2)} × (1 - ${albedo_val.toFixed(4)}) = ${calculated.toFixed(2)} ${match} (réel: ${actual.toFixed(2)})`);
            }
            
            // Formule pour 🧲🔼 (flux sortant - Stefan-Boltzmann σT⁴)
            // Le flux sortant est calculé comme σT⁴ (corps noir) ou via calculateFluxForT0 (spectral)
            if (flux['🧲🔼'] !== undefined) {
                formulas.push(`<strong>🧲🔼</strong> = σT⁴ (corps noir) ou calcul spectral si disponible`);
            }
            
            if (formulas.length === 0) return '';
            
            return `<div class="formule">${formulas.join('<br>')}</div>`;
        }
        
        // Fonction json2html pour convertir un objet JSON en HTML formaté
        // Utilise JSON.stringify puis formate pour correspondre à grammar.txt (guillemets simples)
        function json2html(obj, title, source, objName = null) {
            if (!obj) return '';
            
            // Formater les nombres : notation scientifique pour grands nombres, 2 décimales toujours
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                if (value === 0) return '0.00';
                // Utiliser notation scientifique si |value| >= 1000 ou |value| < 0.01
                if (Math.abs(value) >= 1000 || (Math.abs(value) < 0.01 && value !== 0)) {
                    return value.toExponential(2);
                }
                // Sinon, 2 décimales
                return value.toFixed(2);
            };
            
            // Formater récursivement l'objet
            const formatValue = (value) => {
                if (value === null) return 'null';
                if (value === undefined) return 'undefined';
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'boolean') return value.toString();
                if (typeof value === 'string') return `'${value}'`;
                if (Array.isArray(value)) {
                    return '[' + value.map(formatValue).join(', ') + ']';
                }
                if (typeof value === 'object') {
                    const entries = Object.entries(value).map(([k, v]) => `'${k}':${formatValue(v)}`);
                    return '{' + entries.join(', ') + '}';
                }
                return String(value);
            };
            
            // Construire la chaîne JSON formatée
            let jsonStr = formatValue(obj);
            
            // Ajouter le nom de l'objet si fourni
            if (objName) {
                jsonStr = `${objName}=${jsonStr}`;
            }
            
            let html = `
                <div class="config-section">
                    <div class="config-title">${title} ${source ? `[${source}]` : ''}</div>
            `;
            // La formule sera ajoutée ici si nécessaire (pour albedo)
            html += `
                    <div class="config-value" style="font-family: monospace;">${jsonStr}</div>
                </div>
            `;
            return html;
        }

                console.log(`✅ Timeline chargée: ${window.configTimeline.timeline.length} époques`);
                // Générer la timeline horizontale
                generateHorizontalTimeline();
            } else {
                console.error('❌ Timeline non chargée');
            }
        });
    </script>
</body>
</html>
