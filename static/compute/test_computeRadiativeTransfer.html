<!DOCTYPE html>

<head>

    <style>

<body>
    <div class="container">
        <h1>🧪 Test computeRadiativeTransfer</h1>
        
        <!-- Lexique des logos selon grammar.txt -->
        <div id="lexique" class="results replied" style="margin-bottom: 20px; background: #1a2a3a; border-left: 4px solid #4a9eff;">
            <h2 style="color: #4a9eff; margin-bottom: 10px;">📖 Lexique <button class="toggle-button" onclick="toggleLexique()">+</button></h2>
            <div id="alphabet-content">
                <iframe id="alphabet-iframe" src="alphabet.html" style="width: 100%; height: 400px; border: none; background: #1a1a1a;"></iframe>
            </div>
        </div>
        
        <!-- Syntaxe des logos -->
        <div id="syntaxe" class="results replied" style="margin-bottom: 20px; background: #1a2a3a; border-left: 4px solid #4a9eff;">
            <h2 style="color: #4a9eff; margin-bottom: 10px;">📝 Syntaxe <button class="toggle-button" onclick="toggleSyntaxe()">+</button></h2>
            <div id="dico-content">
                <iframe id="dico-iframe" src="dico.html" style="width: 100%; height: 400px; border: none; background: #1a1a1a;"></iframe>
            </div>
        </div>
        
        <div class="controls">
            <div class="controls-left">
                <!-- Timeline horizontale -->
                <div class="timeline-horizontal-container">
                    <!-- Date de l'époque -->
                    <div class="timeline-date-display">
                        <span class="timeline-hourglass">📅</span>
                        <span class="epoch-start-time" id="epoch-start-time">-5000 Ma</span>
                    </div>
                    
                    <!-- Horloge / TicTime -->
                    <div class="timeline-horloge-display">
                        <span class="horloge-icon">🕰</span>
                        <span class="info-time" id="info-time">+0 Ma</span>
                        <div class="timeline-events-logos" id="timeline-events-logos">
                            <!-- Logos d'événements (météorites, etc.) -->
                        </div>
                    </div>
                    
                    <!-- Boutons d'époques -->
                    <div class="epochs-container-horizontal" id="epochs-container-horizontal">
                        <!-- Sera rempli dynamiquement -->
                    </div>
                </div>
            </div>
            
            <div class="controls-right">
                <button class="icon-button" id="anim-toggle" onclick="toggleAnim()" title="Animation">🎬</button>
                <button class="icon-button" onclick="runTest()" title="Exécuter">▶️</button>
                <button class="icon-button" onclick="clearLog()" title="Effacer les logs">🗑️</button>
            </div>
        </div>
        
        <div id="config" class="results replied" style="display: none;">
            <h2>📋 Configuration <button class="toggle-button" onclick="toggleConfig()">+</button></h2>
            <div id="config-content"></div>
        </div>
        
        <div id="convergence" class="results replied" style="display: none;">
            <h2>⚙ Convergence <button class="toggle-button" onclick="toggleConvergence()">+</button></h2>
            <div id="convergence-content"></div>
        </div>
        
        <div id="results" class="results" style="display: none;">
            <h2>📊 Résultats</h2>
            <div id="results-content"></div>
        </div>
        
    </div>

    <!-- Charger les dépendances dans l'ordre -->
    <script src="alphabet.js"></script>
    <script src="dico.js"></script>
    <script src="../../organigramme/configOrganigramme.js"></script>

    <script src="../calculations_h2o.js"></script>
    <script src="../calculations_albedo.js"></script>
    <script src="../calculations_atm.js"></script>
    <script src="compute.js"></script>
    <script src="calculations_flux.js"></script>
    
    <script>
        // Fonction helper pour construire les clés de logos dans le HTML (utilise window.getLogoKey si disponible)
        function getLogoKeyHTML(...names) {
            if (typeof window !== 'undefined' && window.getLogoKey) {
                return window.getLogoKey(...names);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return names.map(name => window.LOGOS[name] || '').join('');
        }
        
        function getLogoHTML(name) {
            if (typeof window !== 'undefined' && window.getLogo) {
                return window.getLogo(name);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return window.LOGOS[name] || '';
        }
        
        // Intercepter console.log pour afficher dans la page
        const originalLog = console.log;
        const originalError = console.error;
        // Logs désactivés - la div de logs a été supprimée
        // console.log et console.error utilisent les fonctions originales
        
        function clearLog() {
            // Logs désactivés - la div de logs a été supprimée
        }
        
        function toggleAnim() {
            const animButton = document.getElementById('anim-toggle');
            if (animButton) {
                const isSelected = animButton.classList.contains('selected');
                if (isSelected) {
                    animButton.classList.remove('selected');
                } else {
                    animButton.classList.add('selected');
                }
                // Créer ou mettre à jour plot-anim-toggle-checkbox pour compatibilité avec compute.js
                let plotAnimToggleCheckbox = document.getElementById('plot-anim-toggle-checkbox');
                if (!plotAnimToggleCheckbox) {
                    plotAnimToggleCheckbox = document.createElement('input');
                    plotAnimToggleCheckbox.type = 'checkbox';
                    plotAnimToggleCheckbox.id = 'plot-anim-toggle-checkbox';
                    plotAnimToggleCheckbox.style.display = 'none';
                    document.body.appendChild(plotAnimToggleCheckbox);
                }
                plotAnimToggleCheckbox.checked = !isSelected;
            }
        }
        
        // Fonction helper pour convertir les chemins relatifs en chemins absolus depuis la racine
        // Depuis static/compute/, on doit remonter de 2 niveaux pour atteindre la racine
        function getImagePath(relativePath) {
            if (!relativePath) return relativePath;
            // Si le chemin commence déjà par http:// ou https:// ou /, le retourner tel quel
            if (relativePath.startsWith('http://') || relativePath.startsWith('https://') || relativePath.startsWith('/')) {
                return relativePath;
            }
            // Sinon, remonter de 2 niveaux depuis static/compute/ pour atteindre la racine
            return '../../' + relativePath;
        }
        
        // Générer la timeline horizontale
        function generateHorizontalTimeline() {
            const epochsContainer = document.getElementById('epochs-container-horizontal');
            if (!epochsContainer || !window.TIMELINE) return;
            
            epochsContainer.innerHTML = '';
            
            window.TIMELINE.forEach(item => {
                if (item['📅']) {
                    const button = document.createElement('button');
                    button.className = 'epoch-btn-horizontal';
                    const epochId = item['📅'];
                    button.setAttribute('data-epoch', epochId);
                    button.onclick = () => selectEpoch(epochId);
                    
                    // Le logo est maintenant dans charsImages ou directement l'emoji
                    const logoEmoji = epochId;
                    button.textContent = logoEmoji;
                    // font-family héritée de la règle CSS générale pour button
                    
                    epochsContainer.appendChild(button);
                }
            });
            
            // Sélectionner la première époque par défaut
            if (window.TIMELINE.length > 0) {
                const firstEpoch = window.TIMELINE.find(item => item['📅']);
                if (firstEpoch) {
                    selectEpoch(firstEpoch['📅']);
                }
            }
        }
        
        // Sélectionner une époque (utilise l'index directement)
        function selectEpoch(epochId) {
            // Trouver l'index de l'époque dans TIMELINE
            const epochIndex = window.TIMELINE.findIndex(item => item['📅'] === epochId);
            if (epochIndex < 0) {
                console.error(`[selectEpoch] Époque ${epochId} non trouvée`);
                return;
            }
            
            // Utiliser l'index directement (pas de copie)
            window.currentEpochIndex = epochIndex;
            window.currentEpochName = epochId; // Garder pour compatibilité affichage
            
            // Mettre à jour DATA['📅'] avec l'objet epoch complet
            if (!window.DATA) window.DATA = {};
            if (!window.DATA['📜']) window.DATA['📜'] = {};
            window.DATA['📅'] = window.TIMELINE[epochIndex];
            window.DATA['📜']['👉'] = epochIndex;
            window.DATA['📜']['🗿'] = epochId; // Logo de l'époque (emoji), pas la description
            
            // Mettre à jour les boutons
            document.querySelectorAll('.epoch-btn-horizontal').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.getAttribute('data-epoch') === epochId) {
                    btn.classList.add('selected');
                }
            });
            
            // Mettre à jour la date de l'époque (depuis '▶')
            const EPOCH = window.TIMELINE[epochIndex];
            const epochStartTime = document.getElementById('epoch-start-time');
            if (epochStartTime && EPOCH && EPOCH['▶'] !== undefined) {
                epochStartTime.textContent = `-${(EPOCH['▶'] / 1e6).toFixed(0)} Ma`;
            }
            
            // Mettre à jour les actions (boutons d'événements)
            updateEpochActions();
            
            // Réinitialiser le temps
            if (typeof window !== 'undefined' && window.DATA) {
                if (!window.DATA['📜']) window.DATA['📜'] = {};
                window.DATA['📜']['📿💫'] = 0;
                updateTimelineDisplay();
            }
        }
        
        // Mettre à jour l'affichage de la timeline
        function updateTimelineDisplay() {
            const infoTimeDisplay = document.getElementById('info-time');
            if (infoTimeDisplay) {
                const DATA = window.DATA;
                const infoTimeMa = (DATA['📜'] && DATA['📜']['📿💫']) ? DATA['📜']['📿💫'] * 50 : 0;
                const deltaMa = infoTimeMa.toFixed(1).replace(/\.?0+$/, '');

        // Fonction pour calculer et afficher la formule de l'albedo
        function calculateAlbedoFormula(albedo, albedoReflectorCoeff) {
            if (!albedo || !albedoReflectorCoeff) return '';
            
            const elements = ['🌋', '🌊', '🌳', '🏖', '🧊', '⛅'];
            let total = 0;
            
            // Calculer le total
            elements.forEach(element => {
                const coverage_key = `🍰🪞${element}`;
                const coeff_key = `🍰${element}🪞`;
                const coverage = albedo[coverage_key];
                const coeff = albedoReflectorCoeff[coeff_key];
                total += coverage * coeff;
            });
            
            // essais graphique, ne modifie pas la formule : 
            const variableChar = '❀';//❉✪✩⛬✤ //<i></i>
            const elementsStr = elements.join(',');
            const formula = `🍰🪞📿<span style="font-size: 10px;"> = Σ(</span>🍰🪞<span style="font-size: 10px;">${variableChar} × </span>🍰<span style="font-size: 10px;">${variableChar}</span>🪞<span style="font-size: 10px;">) | ${variableChar} ∈ { </span>${elementsStr}<span style="font-size: 10px;"> }</span> => ${total.toFixed(4)}`;
            
            // Formater albedoReflectorCoeff pour l'affichage
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                return value.toFixed(2);
            };
            const formatValue = (value) => {
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'string') return `'${value}'`;
                return String(value);
            };
            const coeffEntries = Object.entries(albedoReflectorCoeff).map(([k, v]) => `'${k}':${formatValue(v)}`);
            const coeffStr = `{${coeffEntries.join(', ')}}`;
            
            // Ajouter les formules de calcul des couvertures
            let coverageFormulas = [];
            const DATA = window.DATA;
            const EPOCH = DATA['📅'];
            const T_surface_K = DATA['⏳']['🌡️'] || 255;
            const T_surface_C = T_surface_K - 273.15;
            const isHadeen = EPOCH && EPOCH['📅'] === '🌋';
            const ocean_coverage = albedo['🍰🪞🌊'];
            const ice_coverage = albedo['🍰🪞🧊'];
            const forest_coverage = albedo['🍰🪞🌳'];
            const volcano_coverage = albedo['🍰🪞🌋'];
            const desert_coverage = albedo['🍰🪞🏖'];
            const cloud_coverage = albedo['🍰🪞⛅'];
            
            // Formules de calcul des couvertures
            if (isHadeen) {
                coverageFormulas.push(`🍰🪞🌋 = 1.00 (Hadéen: volcan 100%)`);
                coverageFormulas.push(`🍰🪞🏖 = 0.00 (Hadéen: désert 0%)`);
            } else {
                if (volcano_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🌋 = min(1.0, 🧲🌕 / 10000) si 🧲🌕 > 1000 W/m²`);
                }
                if (ocean_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🌊 = 🍰💧🌊 (depuis h2o)`);
                }
                if (ice_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🧊 = 🍰💧🧊 (depuis h2o)`);
                }
                if (forest_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🌳 = min(0.5, 🍰🪞🌊 × (1 - 🌡️/30)) si 🌡️ < 30°C et 🍰🪞🌊 > 0.1`);
                }
                if (desert_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🏖 = ${desert_coverage.toFixed(2)} (depuis config, pas calculé comme surface restante)`);
                } else {
                    coverageFormulas.push(`🍰🪞🏖 = 0.00 (non défini dans config, pas de désert par défaut)`);
                }
            }
            if (cloud_coverage > 0) {
                coverageFormulas.push(`🍰🪞⛅ = 🍰💧⛅ (depuis h2o)`);
            }
            
            let formulasHtml = formula;
            if (coverageFormulas.length > 0) {
                formulasHtml += '<br><small>Formules couvertures:</small><br><small>' + coverageFormulas.join('<br>') + '</small>';
            }
            
            return `<div class="formule">${formulasHtml}<br>albedoReflectorCoeff=${coeffStr}</div>`;
        }
        
        // Fonction pour calculer et afficher les formules des flux
        function calculateFluxFormulas(flux, soleil, albedo) {
            if (!flux) return '';
            
            let formulas = [];
            
            // Formule pour 🧲☀️🔽 (flux solaire absorbé)
            // SOURCE RÉELLE : window.flux['🧲☀️🔽'] est calculé avec calculateSolarFluxAbsorbed()
            // qui utilise maintenant window.soleil['🧲☀️🎱'] comme source unique
            // Par définition : 🧲☀️🎱 = 🧲☀️📜 / 4 (rapporté au rayon au sol pour les m²)
            // 🧲☀️🔽 = 🧲☀️🎱 × (1 - 🍰🪞📿) (on enlève l'albedo, c'est le flux au sol reçu du soleil)
            if (flux['🧲☀️🔽'] !== undefined && soleil && soleil['🧲☀️🎱'] !== undefined && albedo && albedo['🍰🪞📿'] !== undefined) {
                const solar_avg = soleil['🧲☀️🎱'];
                const albedo_val = albedo['🍰🪞📿'];
                const calculated = solar_avg * (1 - albedo_val);
                const actual = flux['🧲☀️🔽'];
                
                // Vérifier que le calcul correspond (tolérance 0.01 W/m²)
                const match = Math.abs(calculated - actual) < 0.01 ? '✓' : '⚠';
                formulas.push(`<strong>🧲☀️🔽</strong> = <strong>🧲☀️🎱</strong> × (1 - <strong>🥒🪞🎓</strong>) = ${solar_avg.toFixed(2)} × (1 - ${albedo_val.toFixed(4)}) = ${calculated.toFixed(2)} ${match} (réel: ${actual.toFixed(2)})`);
            }
            
            // Formule pour 🧲🔼 (flux sortant - Stefan-Boltzmann σT⁴)
            // Le flux sortant est calculé comme σT⁴ (corps noir) ou via calculateFluxForT0 (spectral)
            if (flux['🧲🔼'] !== undefined) {
                formulas.push(`<strong>🧲🔼</strong> = σT⁴ (corps noir) ou calcul spectral si disponible`);
            }
            
            if (formulas.length === 0) return '';
            
            return `<div class="formule">${formulas.join('<br>')}</div>`;
        }
        
        // Fonction json2html pour convertir un objet JSON en HTML formaté
        // Utilise JSON.stringify puis formate pour correspondre à grammar.txt (guillemets simples)
        function json2html(obj, title, source, objName = null, categoryKey = null) {
            if (!obj) return '';
            
            // Formater les nombres : notation scientifique pour grands nombres, 2 décimales toujours
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                if (value === 0) return '0.00';
                // Utiliser notation scientifique si |value| >= 1000 ou |value| < 0.01
                if (Math.abs(value) >= 1000 || (Math.abs(value) < 0.01 && value !== 0)) {
                    return value.toExponential(2);
                }
                // Sinon, 2 décimales
                return value.toFixed(2);
            };
            
            // Formater récursivement l'objet
            const formatValue = (value) => {
                if (value === null) return 'null';
                if (value === undefined) return 'undefined';
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'boolean') return value.toString();
                if (typeof value === 'string') return `'${value}'`;
                if (Array.isArray(value)) {
                    return '[' + value.map(formatValue).join(', ') + ']';
                }
                if (typeof value === 'object') {
                    const entries = Object.entries(value).map(([k, v]) => `'${k}':${formatValue(v)}`);
                    return '{' + entries.join(', ') + '}';
                }
                return String(value);
            };
            
            // Construire la chaîne JSON formatée
            let jsonStr = formatValue(obj);
            
            // Ajouter le nom de l'objet avec logo si categoryKey fourni
            if (objName) {
                if (categoryKey) {
                    // Utiliser le logo de la catégorie + description si disponible
                    const desc = window.DESC && window.DESC[categoryKey] ? '' : ''; // Description sera dans le titre
                    jsonStr = `${categoryKey}${objName}=${jsonStr}`;
                } else {
                    jsonStr = `${objName}=${jsonStr}`;
                }
            } else if (categoryKey) {
                // Si pas de objName mais categoryKey, utiliser juste le logo
                jsonStr = `${categoryKey}=${jsonStr}`;
            }
            
            let html = `
                <div class="config-section">
                    <div class="config-title">${title} ${source ? `[${source}]` : ''}</div>
                    <div class="config-value">${jsonStr}</div>
                    <div class="formule-container">
                        <!-- Les formules seront ajoutées ici -->
                    </div>
                </div>
            `;
            return html;
        }

                html += '<table style="width: 100%; border-collapse: collapse;">';
                html += '<thead><tr style="background: rgba(255,255,255,0.1);">';
                html += '<th style="padding: 4px; text-align: center;">It</th>';
                html += '<th style="padding: 4px; text-align: center;">T (K)</th>';
                html += '<th style="padding: 4px; text-align: center;">T (°C)</th>';
                html += '<th style="padding: 4px; text-align: right;">Flux entrant</th>';
                html += '<th style="padding: 4px; text-align: right;">Flux sortant</th>';
                html += '<th style="padding: 4px; text-align: right;">Delta</th>';
                html += '<th style="padding: 4px; text-align: right;">Tolérance</th>';
                html += '<th style="padding: 4px; text-align: center;">Phase</th>';
                html += '<th style="padding: 4px; text-align: right;">Albedo</th>';
                html += '</tr></thead><tbody>';
                
                DATA['⏳']['history'].forEach(state => {
                    // Utiliser temperature_C si disponible, sinon calculer depuis temperature_K
                    const temp_C = state.temperature_C !== undefined ? state.temperature_C.toFixed(2) : (state.temperature_K - 273.15).toFixed(2);
                    const flux_entrant_str = state.flux_entrant.toFixed(2);
                    const flux_sortant_str = state.flux_sortant_effectif > 1000 ? state.flux_sortant_effectif.toExponential(2) : state.flux_sortant_effectif.toFixed(2);
                    const delta_str = Math.abs(state.delta_equilibre) > 1000 ? state.delta_equilibre.toExponential(2) : state.delta_equilibre.toFixed(2);
                    const tolerance_str = state.tolerance.toFixed(2);
                    const albedo_str = state.albedo && state.albedo['🍰🪞📿'] !== undefined ? state.albedo['🍰🪞📿'].toFixed(4) : '-';
                    const is_converged = Math.abs(state.delta_equilibre) <= state.tolerance;
                    const row_style = is_converged ? 'background: rgba(0,255,0,0.1);' : '';
                    
                    html += `<tr style="${row_style}">`;
                    html += `<td style="padding: 2px; text-align: center;">${state.iteration}</td>`;
                    html += `<td style="padding: 2px; text-align: center;">${state.temperature_K.toFixed(2)}</td>`;
                    html += `<td style="padding: 2px; text-align: center;">${temp_C}</td>`;
                    html += `<td style="padding: 2px; text-align: right;">${flux_entrant_str}</td>`;
                    html += `<td style="padding: 2px; text-align: right;">${flux_sortant_str}</td>`;
                    html += `<td style="padding: 2px; text-align: right;">${delta_str}</td>`;
                    html += `<td style="padding: 2px; text-align: right;">${tolerance_str}</td>`;
                    html += `<td style="padding: 2px; text-align: center;">${state.phase || '-'}</td>`;
                    html += `<td style="padding: 2px; text-align: right;">${albedo_str}</td>`;
                    html += '</tr>';
                });
                
                html += '</tbody></table>';
                html += '</div></div>';
                
                // Afficher les DATA qui ont changé à chaque itération (si bouton + cliqué)
                // Comparer chaque itération avec la précédente pour voir ce qui a changé
                if (DATA['⏳']['history'].length > 1) {
                    html += '<div class="config-section">';
                    html += '<div class="config-title">📊 DATA modifiés par itération <button class="toggle-button" onclick="toggleDataChanges()">+</button></div>';
                    html += '<div class="config-value data-changes-container" style="display: none; max-height: 400px; overflow-y: auto; font-size: 11px; font-family: monospace;">';
                    
                    for (let i = 1; i < DATA['⏳']['history'].length; i++) {
                        const prevState = DATA['⏳']['history'][i - 1];
                        const currState = DATA['⏳']['history'][i];
                        const prevData = prevState.data_snapshot || {};
                        const currData = currState.data_snapshot || {};
                        
                        // Comparer les catégories principales
                        const categories = ['⏳', '💧', '🪞', '🧲', '📛'];
                        let changes = [];
                        
                        categories.forEach(cat => {
                            if (prevData[cat] && currData[cat]) {
                                const prev = JSON.stringify(prevData[cat]);
                                const curr = JSON.stringify(currData[cat]);
                                if (prev !== curr) {
                                    changes.push(`${cat}=${JSON.stringify(currData[cat])}`);
                                }
                            } else if (currData[cat]) {
                                changes.push(`${cat}=${JSON.stringify(currData[cat])}`);
                            }
                        });
                        
                        if (changes.length > 0) {
                            html += `<div style="margin-bottom: 10px;"><strong>Itération ${currState.iteration}:</strong><br>${changes.join('<br>')}</div>`;
                        }
                    }
                    
                    html += '</div></div>';
                }
            }
            
            // Afficher les données de convergence finales depuis DATA (dernier état, plié par défaut)
            if (DATA && DATA['⏳']) {
                // Créer une copie sans l'historique pour l'affichage
                const convergenceData = {...DATA['⏳']};
                delete convergenceData.history;
                html += json2html(convergenceData, '⚙ Convergence (final)', 'computeRadiativeTransfer@calculations_flux.js', 'convergence', '⏳');
            }
            if (DATA && DATA['🧲']) {
                html += json2html(DATA['🧲'], '🧲 Flux radiatif (final)', 'computeRadiativeTransfer@calculations_flux.js', 'flux', '🧲');
            }
            
            // Toujours afficher le panneau même si html est vide
            convergenceContent.innerHTML = html || '<div class="config-value">Aucune donnée de convergence disponible</div>';
            convergenceDiv.style.display = 'block';
        }
        
        function toggleConfig() {
            const configDiv = document.getElementById('config');
            const button = configDiv.querySelector('.toggle-button');
            const formuleContainers = configDiv.querySelectorAll('.formule-container');
            
            // Toggle l'affichage des formules
            formuleContainers.forEach(container => {
                if (container.style.display === 'none') {
                    container.style.display = 'block';
                    button.textContent = '−'; // Afficher moins quand les formules sont visibles
                } else {
                    container.style.display = 'none';
                    button.textContent = '+'; // Afficher plus quand les formules sont cachées
                }
            });
        }
        
        function toggleConvergence() {
            const convergenceDiv = document.getElementById('convergence');
            const button = convergenceDiv.querySelector('.toggle-button');
            const formuleContainers = convergenceDiv.querySelectorAll('.formule-container');
            
            // Toggle l'affichage des formules
            formuleContainers.forEach(container => {
                if (container.style.display === 'none') {
                    container.style.display = 'block';
                    button.textContent = '−'; // Afficher moins quand les formules sont visibles
                } else {
                    container.style.display = 'none';
                    button.textContent = '+'; // Afficher plus quand les formules sont cachées
                }
            });
        }
        
        function toggleLexique() {
            const lexiqueDiv = document.getElementById('lexique');
            const button = lexiqueDiv.querySelector('.toggle-button');
            if (lexiqueDiv.classList.contains('replied')) {
                lexiqueDiv.classList.remove('replied');
                button.textContent = 'x';
            } else {
                lexiqueDiv.classList.add('replied');
                button.textContent = '+';
            }
        }
        
        function toggleSyntaxe() {
            const syntaxeDiv = document.getElementById('syntaxe');
            const button = syntaxeDiv.querySelector('.toggle-button');
            if (syntaxeDiv.classList.contains('replied')) {
                syntaxeDiv.classList.remove('replied');
                button.textContent = 'x';
            } else {
                syntaxeDiv.classList.add('replied');
                button.textContent = '+';
            }
        }
        
        
        // Écouter les messages de redimensionnement des iframes
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'resize-iframe') {
                const iframe = event.data.source === 'alphabet' 
                    ? document.getElementById('alphabet-iframe')
                    : document.getElementById('dico-iframe');
                if (iframe && event.data.height) {
                    iframe.style.height = event.data.height + 'px';
                }
            }
        });
        
        // Initialiser au chargement
        window.addEventListener('DOMContentLoaded', function() {
            // Les contenus Alphabet et Dico sont maintenant chargés via iframe (alphabet.html et dico.html)
            console.log('📄 Page de test chargée');
            console.log('🔧 Initialisation des variables globales...');
            
            // S'assurer que TIMELINE est chargée
            if (window.TIMELINE) {
                console.log(`✅ Timeline chargée: ${window.TIMELINE.length} époques`);
                // Générer la timeline horizontale
                generateHorizontalTimeline();
            } else {
                console.error('❌ Timeline non chargée');
            }
        });
    </script>
</body>
</html>
