<body>
    <div class="container">
        <h1>🧪 Test computeRadiativeTransfer</h1>
        
        <!-- Lexique des logos selon grammar.txt -->
        <div id="lexique" class="results replied" style="margin-bottom: 20px; background: #1a2a3a; border-left: 4px solid #4a9eff;">
            <h2 style="color: #4a9eff; margin-bottom: 10px;">🔡 Alphabet(.js) > window.CHARS_DESC <button class="toggle-button" onclick="toggleLexique()">+</button></h2>
            <div id="alphabet-content">
                <iframe id="alphabet-iframe" src="alphabet.html" style="width: 100%; height: 400px; border: none; background: #1a1a1a;"></iframe>
            </div>
        </div>
        
        <!-- Syntaxe des logos -->
        <div id="syntaxe" class="results replied" style="margin-bottom: 20px; background: #1a2a3a; border-left: 4px solid #4a9eff;">
            <h2 style="color: #4a9eff; margin-bottom: 10px;">📖 Dico(.js) > window.DESC <button class="toggle-button" onclick="toggleSyntaxe()">+</button></h2>
            <div id="dico-content">
                <iframe id="dico-iframe" src="dico.html" style="width: 100%; height: 400px; border: none; background: #1a1a1a;"></iframe>
            </div>
        </div>
        
        <div class="controls">
            <div class="controls-left" style="position: relative; width: 100%;">
                <!-- En-tête window.TIMELINE (superposé en z-index) -->
                <div style="position: absolute; top: 0; left: 0; font-size: 10px; color: #888; z-index: 10; background: #2a2a2a; padding: 2px 5px;">> window.TIMELINE</div>
                
                <!-- Timeline horizontale (une seule ligne) -->
                <div class="timeline-horizontal-container" style="padding-top: 15px;">
                        <!-- 📜 Époque avec date -->
                        <div class="timeline-date-display" style="display: flex; flex-direction: column; align-items: center; padding: 0 10px; border-right: 1px solid #444;">
                            <span class="timeline-hourglass" style="font-size: 20px;">📜</span>
                            <span class="epoch-start-time" id="epoch-start-time" style="font-size: 10px; margin-top: 2px;">-5000 Ma</span>
                        </div>
                        
                        <!-- 📅 Date avec ticTime -->
                        <div class="timeline-date-display" style="display: flex; flex-direction: column; align-items: center; padding: 0 10px; border-right: 1px solid #444;">
                            <span class="timeline-hourglass" style="font-size: 20px;">📅</span>

                            </div>
                        </div>
                        
                        <!-- Boutons d'époques avec graduations intégrées -->

            </div>
            
            <div class="controls-right">
                <button class="icon-button" id="anim-toggle" onclick="toggleAnim()" title="Animation">🎬</button>
                <button class="icon-button" onclick="runTest()" title="Exécuter">▶️</button>
                <button class="icon-button" onclick="clearLog()" title="Effacer les logs">🗑️</button>
            </div>
        </div>
        
        <div id="config" class="results replied" style="display: none;">

    <script>
        // Fonction helper pour construire les clés de logos dans le HTML (utilise window.getLogoKey si disponible)
        function getLogoKeyHTML(...names) {
            if (typeof window !== 'undefined' && window.getLogoKey) {
                return window.getLogoKey(...names);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return names.map(name => window.LOGOS[name] || '').join('');
        }
        
        function getLogoHTML(name) {
            if (typeof window !== 'undefined' && window.getLogo) {
                return window.getLogo(name);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return window.LOGOS[name] || '';
        }
        
        // Intercepter console.log pour afficher dans la page
        const originalLog = console.log;
        const originalError = console.error;
        // Logs désactivés - la div de logs a été supprimée
        // console.log et console.error utilisent les fonctions originales
        
        function clearLog() {
            // Logs désactivés - la div de logs a été supprimée
        }
        
        function toggleAnim() {
            const animButton = document.getElementById('anim-toggle');
            if (animButton) {
                const isSelected = animButton.classList.contains('selected');
                if (isSelected) {
                    animButton.classList.remove('selected');
                } else {
                    animButton.classList.add('selected');
                }
                // Créer ou mettre à jour plot-anim-toggle-checkbox pour compatibilité avec compute.js
                let plotAnimToggleCheckbox = document.getElementById('plot-anim-toggle-checkbox');
                if (!plotAnimToggleCheckbox) {
                    plotAnimToggleCheckbox = document.createElement('input');
                    plotAnimToggleCheckbox.type = 'checkbox';
                    plotAnimToggleCheckbox.id = 'plot-anim-toggle-checkbox';
                    plotAnimToggleCheckbox.style.display = 'none';
                    document.body.appendChild(plotAnimToggleCheckbox);
                }
                plotAnimToggleCheckbox.checked = !isSelected;
            }
        }
        
        // Fonction helper pour convertir les chemins relatifs en chemins absolus depuis la racine
        // Depuis static/compute/, on doit remonter de 2 niveaux pour atteindre la racine
        function getImagePath(relativePath) {
            if (!relativePath) return relativePath;
            // Si le chemin commence déjà par http:// ou https:// ou /, le retourner tel quel
            if (relativePath.startsWith('http://') || relativePath.startsWith('https://') || relativePath.startsWith('/')) {
                return relativePath;
            }
            // Sinon, remonter de 2 niveaux depuis static/compute/ pour atteindre la racine
            return '../../' + relativePath;
        }
        
        // ============================================================================
        // UTILITAIRES PARTAGÉS POUR TIMELINE (verticale et horizontale)
        // ============================================================================
        
        // Créer un bouton d'époque (utilitaire partagé)
        function createEpochButton(epochId, orientation) {
            const button = document.createElement('button');
            button.className = orientation === 'horizontal' ? 'epoch-btn-horizontal' : 'epoch-btn';
            button.setAttribute('data-epoch', epochId);
            
            // Le logo est directement l'emoji
            button.textContent = epochId;
            button.style.fontFamily = "'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
            
            // Ajouter le tooltip personnalisé avec description depuis DESC
            if (window.CHARS_DESC && window.CHARS_DESC[epochId]) {
                // Utiliser addCustomTooltip si disponible, sinon title
                if (typeof addCustomTooltip === 'function') {
                    addCustomTooltip(button, window.CHARS_DESC[epochId]);
                } else {
                    button.title = window.CHARS_DESC[epochId];
                }
            }
            
            return button;
        }
        
        // Créer une graduation (utilitaire partagé)
        function createGraduation(dateText, orientation) {
            const graduation = document.createElement('div');
            graduation.className = orientation === 'horizontal' ? 'epoch-date-item-horizontal' : 'epoch-date-item';
            
            const date = document.createElement('span');
            date.className = orientation === 'horizontal' ? 'epoch-date-horizontal' : 'epoch-date';
            date.textContent = dateText;
            
            graduation.appendChild(date);
            return graduation;
        }
        
        // Formater une date en Ma depuis les années
        function formatDateMa(years) {
            const millions = Math.abs(years) / 1e6;
            if (millions >= 1) {
                const sign = years < 0 ? '-' : '';
                const millionsFormatted = millions.toFixed(0);
                return `${sign}${millionsFormatted}Ma`;
            }
            return `${years < 0 ? '-' : ''}${Math.abs(years)}`;
        }
        
        // ============================================================================

        function generateHorizontalTimeline() {
            const epochsContainer = document.getElementById('epochs-container-horizontal');
            if (!epochsContainer || !window.TIMELINE) return;
            
            epochsContainer.innerHTML = '';
            
            // Dates importantes pour les graduations (en Ma)
            const importantDates = [-5000, 1800, 2025];
            let lastEpochDate = null;
            
            window.TIMELINE.forEach((item, index) => {
                if (item['📅']) {
                    const currentDate = item['▶'] / 1e6; // Convertir en Ma
                    
                    // Ajouter une graduation AVANT le bouton si nécessaire
                    if (index === 0) {
                        // Première époque : ajouter graduation -5000Ma
                        const graduation = createGraduation('-5000Ma', 'horizontal');
                        epochsContainer.appendChild(graduation);
                    } else if (lastEpochDate !== null) {
                        // Vérifier si on doit ajouter une graduation entre les boutons
                        const dateDiff = Math.abs(currentDate - lastEpochDate);
                        const isImportantDate = importantDates.some(d => Math.abs(currentDate - d) < 50);
                        
                        // Ajouter graduation si changement > 200Ma ou si c'est une date importante
                        if (dateDiff > 200 || isImportantDate) {
                            const graduation = createGraduation(formatDateMa(item['▶']), 'horizontal');
                            epochsContainer.appendChild(graduation);
                        }
                    }
                    
                    // Créer le bouton d'époque
                    const button = createEpochButton(item['📅'], 'horizontal');
                    button.onclick = () => selectEpoch(item['📅']);
                    epochsContainer.appendChild(button);
                    
                    lastEpochDate = currentDate;
                }
            });
            
            // Ajouter graduation finale (2025) après le dernier bouton si nécessaire
            const lastEpoch = window.TIMELINE[window.TIMELINE.length - 1];
            if (lastEpoch && lastEpoch['📅']) {
                const lastEpochEndDate = lastEpoch['◀'] / 1e6;
                if (Math.abs(lastEpochEndDate - 2025) < 50) {
                    const graduation = createGraduation('2025', 'horizontal');
                    epochsContainer.appendChild(graduation);
                }
            }
            
            // Sélectionner la première époque par défaut
            if (window.TIMELINE.length > 0) {
                const firstEpoch = window.TIMELINE.find(item => item['📅']);
                if (firstEpoch) {
                    selectEpoch(firstEpoch['📅']);
                }
            }
        }

        // Fonction pour calculer et afficher la formule de l'albedo
        function calculateAlbedoFormula(albedo, albedoReflectorCoeff) {
            if (!albedo || !albedoReflectorCoeff) return '';
            
            const elements = ['🌋', '🌊', '🌳', '🏖', '🧊', '⛅'];
            let total = 0;
            
            // Calculer le total
            elements.forEach(element => {
                const coverage_key = `🍰🪞${element}`;
                const coeff_key = `🍰${element}🪞`;
                const coverage = albedo[coverage_key];
                const coeff = albedoReflectorCoeff[coeff_key];
                total += coverage * coeff;
            });
            
            // essais graphique, ne modifie pas la formule : 
            const variableChar = '❀';//❉✪✩⛬✤ //<i></i>
            const elementsStr = elements.join(',');
            const formula = `🍰🪞📿<span style="font-size: 10px;"> = Σ(</span>🍰🪞<span style="font-size: 10px;">${variableChar} × </span>🍰<span style="font-size: 10px;">${variableChar}</span>🪞<span style="font-size: 10px;">) | ${variableChar} ∈ { </span>${elementsStr}<span style="font-size: 10px;"> }</span> => ${total.toFixed(4)}`;
            
            // Formater albedoReflectorCoeff pour l'affichage
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                return value.toFixed(2);
            };
            const formatValue = (value) => {
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'string') return `'${value}'`;
                return String(value);
            };
            const coeffEntries = Object.entries(albedoReflectorCoeff).map(([k, v]) => `'${k}':${formatValue(v)}`);
            const coeffStr = `{${coeffEntries.join(', ')}}`;
            
            // Ajouter les formules de calcul des couvertures
            let coverageFormulas = [];
            const DATA = window.DATA;
            const EPOCH = DATA['📅'];
            const T_surface_K = DATA['⏳']['🌡️'] || 255;
            const T_surface_C = T_surface_K - 273.15;
            const isHadeen = DATA['📜']['🗿'] === '🔥';
            const ocean_coverage = albedo['🍰🪞🌊'];
            const ice_coverage = albedo['🍰🪞🧊'];
            const forest_coverage = albedo['🍰🪞🌳'];
            const volcano_coverage = albedo['🍰🪞🌋'];
            const desert_coverage = albedo['🍰🪞🏖'];
            const cloud_coverage = albedo['🍰🪞⛅'];
            
            // Formules de calcul des couvertures
            if (isHadeen) {
                coverageFormulas.push(`🍰🪞🌋 = 1.00 (Hadéen: volcan 100%)`);
                coverageFormulas.push(`🍰🪞🏖 = 0.00 (Hadéen: désert 0%)`);
            } else {
                if (volcano_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🌋 = min(1.0, 🧲🌕 / 10000) si 🧲🌕 > 1000 W/m²`);
                }
                if (ocean_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🌊 = 🍰💧🌊 (depuis h2o)`);
                }
                if (ice_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🧊 = 🍰💧🧊 (depuis h2o)`);
                }
                if (forest_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🌳 = min(0.5, 🍰🪞🌊 × (1 - 🌡️/30)) si 🌡️ < 30°C et 🍰🪞🌊 > 0.1`);
                }
                if (desert_coverage > 0) {
                    coverageFormulas.push(`🍰🪞🏖 = ${desert_coverage.toFixed(2)} (depuis config, pas calculé comme surface restante)`);
                } else {
                    coverageFormulas.push(`🍰🪞🏖 = 0.00 (non défini dans config, pas de désert par défaut)`);
                }
            }
            if (cloud_coverage > 0) {
                coverageFormulas.push(`🍰🪞⛅ = 🍰💧⛅ (depuis h2o)`);

            let formulasHtml = formula;

            return `<div class="formule">${formulasHtml}<br>albedoReflectorCoeff=${coeffStr}</div>`;

        // Fonction pour calculer et afficher les formules des flux
        function calculateFluxFormulas(flux, soleil, albedo) {
            if (!flux) return '';
            
            let formulas = [];
            
            // Formule pour 🧲☀️🔽 (flux solaire absorbé)
            // SOURCE RÉELLE : window.flux['🧲☀️🔽'] est calculé avec calculateSolarFluxAbsorbed()
            // qui utilise maintenant window.soleil['🧲☀️🎱'] comme source unique
            // Par définition : 🧲☀️🎱 = 🧲☀️📜 / 4 (rapporté au rayon au sol pour les m²)
            // 🧲☀️🔽 = 🧲☀️🎱 × (1 - 🍰🪞📿) (on enlève l'albedo, c'est le flux au sol reçu du soleil)
            if (flux['🧲☀️🔽'] !== undefined && soleil && soleil['🧲☀️🎱'] !== undefined && albedo && albedo['🍰🪞📿'] !== undefined) {
                const solar_avg = soleil['🧲☀️🎱'];
                const albedo_val = albedo['🍰🪞📿'];
                const calculated = solar_avg * (1 - albedo_val);
                const actual = flux['🧲☀️🔽'];
                
                // Vérifier que le calcul correspond (tolérance 0.01 W/m²)
                const match = Math.abs(calculated - actual) < 0.01 ? '✓' : '⚠';
                formulas.push(`<strong>🧲☀️🔽</strong> = <strong>🧲☀️🎱</strong> × (1 - <strong>🥒🪞🎓</strong>) = ${solar_avg.toFixed(2)} × (1 - ${albedo_val.toFixed(4)}) = ${calculated.toFixed(2)} ${match} (réel: ${actual.toFixed(2)})`);
            }
            
            // Formule pour 🧲🔼 (flux sortant - Stefan-Boltzmann σT⁴)
            // Le flux sortant est calculé comme σT⁴ (corps noir) ou via calculateFluxForT0 (spectral)
            if (flux['🧲🔼'] !== undefined) {
                formulas.push(`<strong>🧲🔼</strong> = σT⁴ (corps noir) ou calcul spectral si disponible`);
            }
            
            if (formulas.length === 0) return '';
            
            return `<div class="formule">${formulas.join('<br>')}</div>`;
        }
        
        // Fonction json2html pour convertir un objet JSON en HTML formaté
        // Utilise JSON.stringify puis formate pour correspondre à grammar.txt (guillemets simples)
        function json2html(obj, title, source, objName = null, categoryKey = null) {
            if (!obj) return '';
            
            // Formater les nombres : notation scientifique pour grands nombres, 2 décimales toujours
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                if (value === 0) return '0.00';
                // Utiliser notation scientifique si |value| >= 1000 ou |value| < 0.01
                if (Math.abs(value) >= 1000 || (Math.abs(value) < 0.01 && value !== 0)) {
                    return value.toExponential(2);
                }
                // Sinon, 2 décimales
                return value.toFixed(2);
            };
            
            // Formater récursivement l'objet
            const formatValue = (value) => {
                if (value === null) return 'null';
                if (value === undefined) return 'undefined';
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'boolean') return value.toString();
                if (typeof value === 'string') return `'${value}'`;
                if (Array.isArray(value)) {
                    return '[' + value.map(formatValue).join(', ') + ']';
                }
                if (typeof value === 'object') {
                    const entries = Object.entries(value).map(([k, v]) => `'${k}':${formatValue(v)}`);
                    return '{' + entries.join(', ') + '}';
                }
                return String(value);
            };
            
            // Construire la chaîne JSON formatée
            let jsonStr = formatValue(obj);
            
            // Ajouter le logo si categoryKey fourni (sans objName)
            if (categoryKey) {
                // Utiliser juste le logo, sans nom de description
                jsonStr = `${categoryKey}=${jsonStr}`;
            } else if (objName) {
                // Si pas de categoryKey mais objName, utiliser juste objName
                jsonStr = `${objName}=${jsonStr}`;
            }
            
            // Ne pas afficher le titre (description) - juste le JSON avec le logo
            // Ajouter les formules depuis FORM si categoryKey fourni
            let formuleHtml = '';
            if (categoryKey && window.FORM && window.FORM[categoryKey]) {
                const formulas = [];
                for (const key in obj) {
                    if (window.FORM[categoryKey][key]) {
                        formulas.push(`${key}: ${window.FORM[categoryKey][key]}`);
                    }
                }
                if (formulas.length > 0) {
                    formuleHtml = `<div class="formule">${formulas.join('<br>')}</div>`;
                }
            }
            
            let html = `
                <div class="config-section">
                    <div class="config-value">${jsonStr}</div>
                    <div class="formule-container">
                        ${formuleHtml}
                    </div>
                </div>
            `;
            return html;
        }

                html += json2html(DATA['🔘'], '', '', 'enabledStates', '🔘');
            }
            
            // 1. 📜 epochConfig [getEpochDateConfig@compute.js] - Configuration de l'époque (sans ticTime)
            if (DATA['📜']) {
                // Créer une copie sans ticTime pour epochConfig
                const epochConfig = {...DATA['📜']};
                delete epochConfig['📿💫']; // Retirer ticTime de epochConfig
                html += json2html(epochConfig, '', '', 'epochConfig', '📜');
            }
            
            // 2. 📜 dateConfig [getEpochDateConfig@compute.js] - Configuration avec ticTime (si ticTime > 0)
            if (DATA['📜'] && DATA['📜']['📿💫'] > 0) {
                html += json2html(DATA['📜'], '', '', 'dateConfig', '📜');
            }
            
            // 4. 🕰 Événements [EPOCH['🕰']] - utiliser EPOCH['🕰'] directement depuis TIMELINE
            if (EPOCH && EPOCH['🕰']) {
                html += json2html(EPOCH['🕰'], '', '', 'events', '🕰');
            }
            
            // 5. ⚖️ [getMasses@compute.js] - utiliser DATA directement
            if (DATA['⚖️']) {
                html += json2html(DATA['⚖️'], '', '', 'masses', '⚖️');
            }
            
            // 6. 🌬 Composition atmosphérique [calculateAtmosphereComposition@calculations_atm.js] - utiliser DATA directement
            if (DATA['🌬']) {
                html += json2html(DATA['🌬'], '', '', 'atm', '🌬');
            }
            
            // 7. 💧 Résultats H2O [calculateH2OParameters@calculations_h2o.js] - utiliser DATA directement
            if (DATA['💧']) {
                html += json2html(DATA['💧'], '', '', 'h2o', '💧');
            }
            
            // 8. 🪞 Albedo [calculateAlbedo@calculations_albedo.js] - utiliser DATA['🪞_initial'] (albedo initial, ne change plus)
            // Construire le HTML avec la formule dans le conteneur formule-container
            // Utiliser DATA['🪞_initial'] si disponible (albedo initial), sinon DATA['🪞'] (fallback)
            const albedoForConfig = DATA['🪞_initial'] || DATA['🪞'];
            if (albedoForConfig) {
                const albedoHtml = json2html(albedoForConfig, '', '', 'albedo', '🪞');
                const CONST = window.CONST;
                const formula = calculateAlbedoFormula(albedoForConfig, CONST['🪞🍰']);
                // Insérer la formule dans le conteneur formule-container
                html += albedoHtml.replace('<div class="formule-container">', `<div class="formule-container">${formula}`);
            }
            
            // 9. 🌕 Noyau [getNoyau@compute.js] - utiliser DATA directement
            if (DATA['🌕']) {
                html += json2html(DATA['🌕'], '', '', 'noyau', '🌕');
            }
            
            // 10. ☀️ Soleil [getSoleil@compute.js] - utiliser DATA directement
            if (DATA['☀️']) {
                html += json2html(DATA['☀️'], '', '', 'soleil', '☀️');
            }
            
            // 11. 🧲 Flux radiatif [computeRadiativeTransfer@calculations_flux.js]
            // Construire le HTML avec les formules dans le conteneur formule-container
            // DATA['🧲'] contient les flux radiatifs
            if (DATA['🧲']) {
                const fluxHtml = json2html(DATA['🧲'], '', '', 'flux', '🧲');
                const fluxFormulas = calculateFluxFormulas(DATA['🧲'], DATA['☀️'], DATA['🪞']);
                // Insérer les formules dans le conteneur formule-container
                html += fluxHtml.replace('<div class="formule-container"', `<div class="formule-container">${fluxFormulas}`);
            }
            
            // Toujours afficher les panneaux même si html est vide
            configContent.innerHTML = html || '<div class="config-value">Aucune donnée disponible</div>';
            configDiv.style.display = 'block';
            
            // Afficher la section Convergence
            displayConvergence();
        }
        
        function displayConvergence() {
            const DATA = window.DATA;
            const convergenceDiv = document.getElementById('convergence');
            const convergenceContent = document.getElementById('convergence-content');
            
            if (!convergenceDiv || !convergenceContent) return;
            
            // Mettre à jour le titre avec la température en °C
            const convergenceTitle = convergenceDiv.querySelector('h2');
            if (convergenceTitle && DATA && DATA['⏳'] && DATA['⏳']['🌡️']) {
                const temp_K = DATA['⏳']['🌡️'];
                const temp_C = (temp_K - 273.15).toFixed(2);
                convergenceTitle.innerHTML = `⚙ Convergence : ${temp_C}°C <button class="toggle-button" onclick="toggleConvergence()">+</button>`;
            }
            
            let html = '';
            
            // Afficher l'historique des itérations si disponible
            // Afficher ⏳ et 🧲 de toutes les itérations
            if (DATA && DATA['⏳'] && DATA['⏳']['history'] && DATA['⏳']['history'].length > 0) {
                DATA['⏳']['history'].forEach(state => {
                    // Afficher ⏳ de cette itération
                    if (state.data_snapshot && state.data_snapshot['⏳']) {
                        const iterationData = {...state.data_snapshot['⏳']};
                        delete iterationData.history;
                        html += json2html(iterationData, '', '', null, '⏳');
                    }
                    // Afficher 🧲 de cette itération (le plus important pour les calculs)
                    if (state.data_snapshot && state.data_snapshot['🧲']) {
                        html += json2html(state.data_snapshot['🧲'], '', '', null, '🧲');
                    }
                });
            }
            
            // Toujours afficher le panneau même si html est vide
            convergenceContent.innerHTML = html || '<div class="config-value">Aucune donnée de convergence disponible</div>';
            convergenceDiv.style.display = 'block';
        }
        
        function toggleConfig() {
            const configDiv = document.getElementById('config');
            const button = configDiv.querySelector('.toggle-button');
            const formuleContainers = configDiv.querySelectorAll('.formule-container');
            
            if (formuleContainers.length === 0) return;
            
            // Vérifier si au moins un conteneur est visible (style inline ou CSS)
            const isVisible = Array.from(formuleContainers).some(container => {
                const style = window.getComputedStyle(container);
                return style.display !== 'none';
            });
            
            // Toggle l'affichage des formules
            formuleContainers.forEach(container => {
                container.style.display = isVisible ? 'none' : 'block';
            });
            
            // Mettre à jour le bouton
            button.textContent = isVisible ? '+' : '−';
        }
        
        function toggleConvergence() {
            const convergenceDiv = document.getElementById('convergence');
            const button = convergenceDiv.querySelector('.toggle-button');
            const formuleContainers = convergenceDiv.querySelectorAll('.formule-container');
            
            if (formuleContainers.length === 0) return;
            
            // Vérifier si au moins un conteneur est visible (style inline ou CSS)
            const isVisible = Array.from(formuleContainers).some(container => {
                const style = window.getComputedStyle(container);
                return style.display !== 'none';
            });
            
            // Toggle l'affichage des formules
            formuleContainers.forEach(container => {
                container.style.display = isVisible ? 'none' : 'block';
            });
            
            // Mettre à jour le bouton
            button.textContent = isVisible ? '+' : '−';
        }
        
        function toggleLexique() {
            const lexiqueDiv = document.getElementById('lexique');
            const button = lexiqueDiv.querySelector('.toggle-button');
            if (lexiqueDiv.classList.contains('replied')) {
                lexiqueDiv.classList.remove('replied');
                button.textContent = 'x';
            } else {
                lexiqueDiv.classList.add('replied');
                button.textContent = '+';
            }
        }
        
        function toggleSyntaxe() {
            const syntaxeDiv = document.getElementById('syntaxe');
            const button = syntaxeDiv.querySelector('.toggle-button');
            if (syntaxeDiv.classList.contains('replied')) {
                syntaxeDiv.classList.remove('replied');
                button.textContent = 'x';
            } else {
                syntaxeDiv.classList.add('replied');
                button.textContent = '+';
            }
        }
        
        
        // Écouter les messages de redimensionnement des iframes
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'resize-iframe') {
                const iframe = event.data.source === 'alphabet' 
                    ? document.getElementById('alphabet-iframe')
                    : document.getElementById('dico-iframe');
                if (iframe && event.data.height) {
                    iframe.style.height = event.data.height + 'px';
                }
            }
        });
        
        // Initialiser au chargement
        window.addEventListener('DOMContentLoaded', function() {
            // Les contenus Alphabet et Dico sont maintenant chargés via iframe (alphabet.html et dico.html)
            console.log('📄 Page de test chargée');
            console.log('🔧 Initialisation des variables globales...');
            
            // S'assurer que TIMELINE est chargée
            if (window.TIMELINE) {
                console.log(`✅ Timeline chargée: ${window.TIMELINE.length} époques`);
                // Générer la timeline horizontale
                generateHorizontalTimeline();
            } else {
                console.error('❌ Timeline non chargée');
            }
        });
    </script>
</body>
</html>
