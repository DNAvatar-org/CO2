<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexique des logos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 10px;
            margin: 0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .legend-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 0;
        }
        
        .legend-column {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid #4a9eff;
        }
        
        .legend-column h3 {
            color: #4a9eff;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
        }
        
        .legend-item .logo {
            font-size: 18px;
            min-width: 25px;
        }
        
        .legend-item .description {
            font-size: 12px;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="legend-content">
            <!-- Le contenu sera généré par JavaScript -->
        </div>
    </div>
    
    <script src="../../organigramme/configOrganigramme.js"></script>
    <script src="grammar.js"></script>
    <script>
        // Générer la légende au chargement
        window.addEventListener('DOMContentLoaded', function() {
            const legendContent = document.getElementById('legend-content');
            if (legendContent && typeof window !== 'undefined' && window.generateLegend) {
                legendContent.innerHTML = window.generateLegend();
            } else {
                legendContent.innerHTML = '<p style="color: #ff6b6b;">Erreur : Impossible de générer la légende. Vérifiez que grammar.js est chargé.</p>';
            }
        });
    </script>
</body>
</html>
