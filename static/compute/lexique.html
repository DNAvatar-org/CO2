<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexique des logos</title>
    <link rel="stylesheet" href="legende.css">
</head>
<body>
    <div class="container">
        <div id="legend-content">
            <!-- Le contenu sera généré par JavaScript -->
        </div>
    </div>
    
    <script src="grammar.js"></script>
    <script src="../../organigramme/configOrganigramme.js"></script>
    <script>
        // Générer la légende au chargement
        window.addEventListener('DOMContentLoaded', function() {
            const legendContent = document.getElementById('legend-content');
            if (legendContent && typeof window !== 'undefined' && window.createLexique) {
                legendContent.innerHTML = window.createLexique();
                
                // Ajuster la hauteur de l'iframe au contenu
                setTimeout(() => {
                    const height = document.body.scrollHeight;
                    const heightWithMargin = Math.ceil(height * 1.05); // Ajouter 5% pour éviter la barre de scroll
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'resize-iframe', height: heightWithMargin, source: 'lexique' }, '*');
                    }
                }, 100);
            } else {
                legendContent.innerHTML = '<p style="color: #ff6b6b;">Erreur : Impossible de générer le lexique. Vérifiez que grammar.js est chargé.</p>';
            }
        });
        
        // Réajuster si le contenu change
        window.addEventListener('resize', function() {
            setTimeout(() => {
                const height = document.body.scrollHeight;
                const heightWithMargin = Math.ceil(height * 1.05); // Ajouter 5% pour éviter la barre de scroll
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'resize-iframe', height: heightWithMargin, source: 'lexique' }, '*');
                }
            }, 100);
        });
    </script>
</body>
</html>
