<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionnaire des clés</title>
    <link rel="stylesheet" href="legende.css">
</head>
<body>
    <div class="container">
        <div id="dico-content">
            <!-- Le contenu sera généré par JavaScript -->
        </div>
    </div>
    
    <script src="alphabet.js"></script>
    <script src="dico.js"></script>
    <script src="../../organigramme/configOrganigramme.js"></script>
    <script>
        // Générer le dictionnaire au chargement
        window.addEventListener('DOMContentLoaded', function() {
            const dicoContent = document.getElementById('dico-content');
            if (dicoContent && typeof window !== 'undefined' && window.createDicoHtml) {
                dicoContent.innerHTML = window.createDicoHtml();
                
                // Ajuster la hauteur de l'iframe au contenu
                setTimeout(() => {
                    const height = document.body.scrollHeight;
                    const heightWithMargin = Math.ceil(height * 1.05); // Ajouter 5% pour éviter la barre de scroll
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'resize-iframe', height: heightWithMargin, source: 'dico' }, '*');
                    }
                }, 100);
            } else {
                dicoContent.innerHTML = '<p style="color: #ff6b6b;">Erreur : Impossible de générer le dictionnaire. Vérifiez que alphabet.js et dico.js sont chargés.</p>';
            }
        });
        
        // Réajuster si le contenu change
        window.addEventListener('resize', function() {
            setTimeout(() => {
                const height = document.body.scrollHeight;
                const heightWithMargin = Math.ceil(height * 1.05); // Ajouter 5% pour éviter la barre de scroll
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'resize-iframe', height: heightWithMargin, source: 'dico' }, '*');
                }
            }, 100);
        });
    </script>
</body>
</html>
