<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📖 Dictionnaire</title>
    <link rel="stylesheet" href="../css/emoji-fonts.css">
    <link rel="stylesheet" href="../css/legende.css">
</head>
<body>
    <div class="container">
        <div id="dico-content">
            <!-- Le contenu sera généré par JavaScript -->
        </div>
    </div>
    
    <script src="../site_paths.js"></script>
    <script src="alphabet.js"></script>
    <script src="dico.js"></script>
    <script src="../../../API_BILAN/data/initDATA.js"></script>
    <script src="../../organigramme/configOrganigramme.js"></script>
    <script>
        (function () {
            function resizeIframe() {
                const height = document.body.scrollHeight;
                const heightWithMargin = Math.ceil(height * 1.05);
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'resize-iframe', height: heightWithMargin, source: 'dico' }, '*');
                }
            }

            function bindAlt0sec(root) {
                if (typeof window.addTooltipFromAttribute !== 'function') return;
                root.querySelectorAll('[data-tooltip]').forEach(function (el) {
                    window.addTooltipFromAttribute(el);
                    el.setAttribute('data-tooltip-initialized', 'true');
                });
            }

            function renderDico() {
                const dicoContent = document.getElementById('dico-content');
                if (dicoContent && window.createDicoHtml) {
                    dicoContent.innerHTML = window.createDicoHtml();
                    bindAlt0sec(dicoContent);
                    setTimeout(resizeIframe, 100);
                } else if (dicoContent) {
                    dicoContent.innerHTML = '<p style="color: #ff6b6b;">Erreur : Impossible de générer le dictionnaire. Vérifiez que alphabet.js et dico.js sont chargés.</p>';
                }
            }

            function loadTooltipsThenRender() {
                var tip = document.createElement('script');
                var base = (window.SITE_PATHS && window.SITE_PATHS.INTERFACES)
                    ? window.SITE_PATHS.INTERFACES
                    : '../../../../_interfaces/';
                tip.src = base + 'tooltips.js';
                tip.onload = renderDico;
                tip.onerror = renderDico;
                document.head.appendChild(tip);
            }

            window.addEventListener('DOMContentLoaded', loadTooltipsThenRender);
            window.addEventListener('resize', function () { setTimeout(resizeIframe, 100); });
        })();
    </script>
</body>
</html>
