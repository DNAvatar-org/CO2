<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cycles de Milankovitch</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <script src="static/astronomie.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-size: 12px;
            color: #aaa;
        }
        
        input[type="number"] {
            background: #3a3a3a;
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 8px;
            border-radius: 4px;
            width: 150px;
        }
        
        button {
            background: #4a9eff;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #3a8eef;
        }
        
        #chart {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            min-height: 600px;
        }
        
        .legend {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .legend h3 {
            margin-bottom: 10px;
            color: #fff;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cycles de Milankovitch</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Période de départ (années avant aujourd'hui)</label>
                <input type="number" id="startYear" value="-500000" step="10000">
            </div>
            <div class="control-group">
                <label>Période de fin (années avant aujourd'hui)</label>
                <input type="number" id="endYear" value="0" step="10000">
            </div>
            <div class="control-group">
                <label>Résolution (années par point)</label>
                <input type="number" id="resolution" value="1000" step="100" min="100">
            </div>
            <button onclick="updateChart()">Mettre à jour</button>
        </div>
        
        <div id="chart"></div>
        
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <div style="flex: 1;">
                <h3 style="margin-bottom: 10px; color: #fff;">Graphique compact (3 courbes principales)</h3>
                <div id="miniChart" style="width: 195px; height: 80px; background: #2a2a2a; border-radius: 4px;"></div>
            </div>
        </div>
        
        <div class="legend">
            <h3>Légende</h3>
            <div class="legend-item">
                <div class="legend-color" style="background: #ff6b6b;"></div>
                <span>Excentricité (cycles 100K et 400K)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #4ecdc4;"></div>
                <span>Obliquité (cycle 41K)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ffe66d;"></div>
                <span>Précession (cycles 23K et 19K)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #95e1d3;"></div>
                <span>Distance périhélie (UA)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #f38181;"></div>
                <span>Distance aphélie (UA)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #a8e6cf;"></div>
                <span>Intensité solaire périhélie (W/m²)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ffaaa5;"></div>
                <span>Intensité solaire aphélie (W/m²)</span>
            </div>
        </div>
    </div>
    
    <script>
        function generateData(startYear, endYear, resolution) {
            const years = [];
            const eccentricity = [];
            const obliquity = [];
            const precession = [];
            const perihelion = [];
            const aphelion = [];
            const intensityPerihelion = [];
            const intensityAphelion = [];
            
            for (let year = startYear; year <= endYear; year += resolution) {
                years.push(year);
                
                // Calculer les paramètres de Milankovitch
                const params = window.astronomie.calculateMilankovitchParameters(year);
                
                eccentricity.push(params.eccentricity);
                obliquity.push(params.obliquity);
                precession.push(params.precession);
                perihelion.push(params.distancePerihelion);
                aphelion.push(params.distanceAphelion);
                intensityPerihelion.push(params.solarIntensityPerihelion);
                intensityAphelion.push(params.solarIntensityAphelion);
            }
            
            return {
                years,
                eccentricity,
                obliquity,
                precession,
                perihelion,
                aphelion,
                intensityPerihelion,
                intensityAphelion
            };
        }
        
        function updateChart() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);
            const resolution = parseInt(document.getElementById('resolution').value);
            
            if (startYear >= endYear) {
                alert('La période de départ doit être antérieure à la période de fin');
                return;
            }
            
            const data = generateData(startYear, endYear, resolution);
            
            // Convertir les années en milliers d'années pour l'affichage
            const yearsKa = data.years.map(y => y / 1000);
            
            const traces = [
                {
                    x: yearsKa,
                    y: data.eccentricity,
                    name: 'Excentricité',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#ff6b6b', width: 2 },
                    yaxis: 'y',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Excentricité: %{y:.4f}<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.obliquity,
                    name: 'Obliquité (°)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#4ecdc4', width: 2 },
                    yaxis: 'y2',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Obliquité: %{y:.2f}°<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.precession,
                    name: 'Précession (°)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#ffe66d', width: 2 },
                    yaxis: 'y3',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Précession: %{y:.1f}°<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.perihelion,
                    name: 'Distance périhélie (UA)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#95e1d3', width: 2, dash: 'dash' },
                    yaxis: 'y4',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Périhélie: %{y:.4f} UA<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.aphelion,
                    name: 'Distance aphélie (UA)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#f38181', width: 2, dash: 'dash' },
                    yaxis: 'y4',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Aphélie: %{y:.4f} UA<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.intensityPerihelion,
                    name: 'Intensité solaire périhélie (W/m²)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#a8e6cf', width: 2 },
                    yaxis: 'y5',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Intensité périhélie: %{y:.2f} W/m²<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.intensityAphelion,
                    name: 'Intensité solaire aphélie (W/m²)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#ffaaa5', width: 2 },
                    yaxis: 'y5',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Intensité aphélie: %{y:.2f} W/m²<extra></extra>'
                }
            ];
            
            const layout = {
                title: {
                    text: 'Cycles de Milankovitch',
                    font: { color: '#fff', size: 20 }
                },
                paper_bgcolor: '#2a2a2a',
                plot_bgcolor: '#1a1a1a',
                font: { color: '#e0e0e0' },
                xaxis: {
                    title: 'Temps (milliers d\'années avant aujourd\'hui)',
                    gridcolor: '#444',
                    zeroline: false
                },
                yaxis: {
                    title: 'Excentricité',
                    side: 'left',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#ff6b6b'
                },
                yaxis2: {
                    title: 'Obliquité (°)',
                    side: 'right',
                    overlaying: 'y',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#4ecdc4',
                    position: 0.95
                },
                yaxis3: {
                    title: 'Précession (°)',
                    side: 'right',
                    overlaying: 'y',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#ffe66d',
                    position: 0.85
                },
                yaxis4: {
                    title: 'Distance (UA)',
                    side: 'right',
                    overlaying: 'y',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#95e1d3',
                    position: 0.75
                },
                yaxis5: {
                    title: 'Intensité solaire (W/m²)',
                    side: 'right',
                    overlaying: 'y',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#a8e6cf',
                    position: 0.65
                },
                legend: {
                    x: 1.02,
                    y: 1,
                    bgcolor: 'rgba(42, 42, 42, 0.8)',
                    bordercolor: '#555',
                    borderwidth: 1
                },
                hovermode: 'x unified',
                margin: { r: 200 }
            };
            
            Plotly.newPlot('chart', traces, layout, {
                responsive: true,
                displayModeBar: true,
                modeBarButtonsToRemove: ['lasso2d', 'select2d']
            });
        }
        
        function updateMiniChart() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);
            const resolution = parseInt(document.getElementById('resolution').value);
            
            const data = generateData(startYear, endYear, resolution);
            const yearsKa = data.years.map(y => y / 1000);
            
            // Normaliser les valeurs pour l'affichage compact (0-1)
            const normalize = (arr, min, max) => arr.map(v => (v - min) / (max - min));
            
            // Intensité solaire moyenne (entre périhélie et aphélie)
            const intensityMean = data.intensityPerihelion.map((p, i) => (p + data.intensityAphelion[i]) / 2);
            const intensityMin = Math.min(...intensityMean);
            const intensityMax = Math.max(...intensityMean);
            
            const traces = [
                {
                    x: yearsKa,
                    y: normalize(intensityMean, intensityMin, intensityMax),
                    name: 'Intensité solaire',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#a8e6cf', width: 1 },
                    showlegend: false
                }
            ];
            
            const layout = {
                paper_bgcolor: '#2a2a2a',
                plot_bgcolor: '#1a1a1a',
                font: { color: '#e0e0e0', size: 8 },
                margin: { l: 0, r: 0, t: 0, b: 20 },
                xaxis: {
                    title: { text: 'Milankovitch (Ka)', font: { size: 8 } },
                    gridcolor: '#444',
                    zeroline: false,
                    showgrid: false,
                    showline: false
                },
                yaxis: {
                    showticklabels: false,
                    showgrid: false,
                    zeroline: false,
                    showline: false,
                    range: [-0.1, 1.1]
                },
                showlegend: false,
                hovermode: false
            };
            
            Plotly.newPlot('miniChart', traces, layout, {
                responsive: false,
                displayModeBar: false,
                staticPlot: true
            });
        }
        
        function updateChart() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);
            const resolution = parseInt(document.getElementById('resolution').value);
            
            if (startYear >= endYear) {
                alert('La période de départ doit être antérieure à la période de fin');
                return;
            }
            
            const data = generateData(startYear, endYear, resolution);
            
            // Convertir les années en milliers d'années pour l'affichage
            const yearsKa = data.years.map(y => y / 1000);
            
            const traces = [
                {
                    x: yearsKa,
                    y: data.eccentricity,
                    name: 'Excentricité',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#ff6b6b', width: 2 },
                    yaxis: 'y',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Excentricité: %{y:.4f}<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.obliquity,
                    name: 'Obliquité (°)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#4ecdc4', width: 2 },
                    yaxis: 'y2',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Obliquité: %{y:.2f}°<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.precession,
                    name: 'Précession (°)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#ffe66d', width: 2 },
                    yaxis: 'y3',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Précession: %{y:.1f}°<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.perihelion,
                    name: 'Distance périhélie (UA)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#95e1d3', width: 2, dash: 'dash' },
                    yaxis: 'y4',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Périhélie: %{y:.4f} UA<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.aphelion,
                    name: 'Distance aphélie (UA)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#f38181', width: 2, dash: 'dash' },
                    yaxis: 'y4',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Aphélie: %{y:.4f} UA<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.intensityPerihelion,
                    name: 'Intensité solaire périhélie (W/m²)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#a8e6cf', width: 2 },
                    yaxis: 'y5',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Intensité périhélie: %{y:.2f} W/m²<extra></extra>'
                },
                {
                    x: yearsKa,
                    y: data.intensityAphelion,
                    name: 'Intensité solaire aphélie (W/m²)',
                    type: 'scatter',
                    mode: 'lines',
                    line: { color: '#ffaaa5', width: 2 },
                    yaxis: 'y5',
                    hovertemplate: 'Année: %{x:.1f} Ka<br>Intensité aphélie: %{y:.2f} W/m²<extra></extra>'
                }
            ];
            
            const layout = {
                title: {
                    text: 'Cycles de Milankovitch',
                    font: { color: '#fff', size: 20 }
                },
                paper_bgcolor: '#2a2a2a',
                plot_bgcolor: '#1a1a1a',
                font: { color: '#e0e0e0' },
                xaxis: {
                    title: 'Temps (milliers d\'années avant aujourd\'hui)',
                    gridcolor: '#444',
                    zeroline: false
                },
                yaxis: {
                    title: 'Excentricité',
                    side: 'left',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#ff6b6b'
                },
                yaxis2: {
                    title: 'Obliquité (°)',
                    side: 'right',
                    overlaying: 'y',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#4ecdc4',
                    position: 0.95
                },
                yaxis3: {
                    title: 'Précession (°)',
                    side: 'right',
                    overlaying: 'y',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#ffe66d',
                    position: 0.85
                },
                yaxis4: {
                    title: 'Distance (UA)',
                    side: 'right',
                    overlaying: 'y',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#95e1d3',
                    position: 0.75
                },
                yaxis5: {
                    title: 'Intensité solaire (W/m²)',
                    side: 'right',
                    overlaying: 'y',
                    gridcolor: '#444',
                    zeroline: false,
                    color: '#a8e6cf',
                    position: 0.65
                },
                legend: {
                    x: 1.02,
                    y: 1,
                    bgcolor: 'rgba(42, 42, 42, 0.8)',
                    bordercolor: '#555',
                    borderwidth: 1
                },
                hovermode: 'x unified',
                margin: { r: 200 }
            };
            
            Plotly.newPlot('chart', traces, layout, {
                responsive: true,
                displayModeBar: true,
                modeBarButtonsToRemove: ['lasso2d', 'select2d']
            });
            
            // Mettre à jour le mini graphique
            updateMiniChart();
        }
        
        // Initialiser le graphique au chargement
        window.addEventListener('DOMContentLoaded', () => {
            updateChart();
        });
    </script>
</body>
</html>
