<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Plaques Tectoniques — Editeur</title>
    <link rel="stylesheet" href="plate_editor.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>PLAQUES</h2>
    <div id="plate-list"></div>

    <h2>POSITION</h2>
    <div class="controls" id="rotation-controls">
        <div class="control-row">
            <label>↕ Lat</label>
            <input type="range" id="ctrl-dLat" min="-90" max="90" value="0" step="1">
            <button class="step-btn" id="btn-dLat-minus" type="button">-</button>
            <button class="step-btn" id="btn-dLat-plus" type="button">+</button>
            <span class="val" id="val-dLat">0</span>
        </div>
        <div class="control-row">
            <label>↔ Lon</label>
            <input type="range" id="ctrl-dLon" min="-180" max="180" value="0" step="1">
            <button class="step-btn" id="btn-dLon-minus" type="button">-</button>
            <button class="step-btn" id="btn-dLon-plus" type="button">+</button>
            <span class="val" id="val-dLon">0</span>
        </div>
        <div class="control-row">
            <label>Angle</label>
            <input type="range" id="ctrl-rotDeg" min="-180" max="180" value="0" step="1">
            <span class="val" id="val-rotDeg">0</span>
        </div>
    </div>

    <h2>EPOQUE</h2>
    <div class="epoch-bar" id="epoch-bar"></div>
    <h2 style="margin-top:10px" id="transition-title">TRANSITION</h2>
    <div class="interp-gauge" id="interp-gauge">
        <span class="seg-bound" id="seg-bound-left" aria-hidden="true">?</span>
        <input type="range" id="ctrl-segment-u" min="0" max="1000" value="0" step="1">
        <span class="seg-bound" id="seg-bound-right" aria-hidden="true">?</span>
    </div>

    <h2>EDITEUR</h2>
    <div class="controls">
        <div class="control-row">
            <label>Seuil</label>
            <input type="range" id="ctrl-seaLevel" min="0" max="100" value="37" step="1">
            <span class="val" id="val-seaLevel">0.37</span>
        </div>
    </div>

    <button class="btn" id="btn-copy-epoch">Copier époque</button>
    <button class="btn" id="btn-paste-epoch" disabled>Coller époque</button>
    <button class="btn" id="btn-export">Exporter JSON</button>
    <button class="btn" id="btn-export-png">Exporter PNGs</button>
    <button class="btn" id="btn-regen">Regénérer images</button>
</div>

<!-- Viewport -->
<div class="viewport">
    <div class="viewport-header">
        <span id="status-text">Plaque : aucune</span>
        <span style="flex:1"></span>
        <label style="font-size: 12px; color: #888;">
            <input type="checkbox" id="chk-wireframe"> Wireframe
        </label>
        <label style="font-size: 12px; color: #888;">
            <input type="checkbox" id="chk-heightmap"> Heightmap
        </label>
    </div>
    <div id="globe-container">
        <canvas id="globe-canvas"></canvas>
    </div>
    <div class="preview-bar">
        <div class="preview-box">
            <span>Heightmap</span>
            <canvas id="preview-height" width="512" height="256"></canvas>
            <div class="band-legend" id="band-legend"></div>
        </div>
        <div class="preview-box">
            <span>Biome</span>
            <canvas id="preview-biome" width="512" height="256"></canvas>
        </div>
    </div>
</div>

<script src="../static/lib/three.min.js"></script>
<script src="../static/plates/plate_positions.js"></script>
<script src="../static/plates/plate_positions_interp.js"></script>
<script src="../static/plates/plates_data.js"></script>
<script src="../static/plates/texture.js"></script>
<script src="../static/plates/plate_renderer.js"></script>
<script src="../static/plates/albedo_test_epochs.js"></script>
<script src="../static/plates/plate_editor_export.js"></script>
<script src="../static/plates/plate_editor_local.js"></script>
</body>
</html>
