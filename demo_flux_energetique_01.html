<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démo - Histogramme Flux Énergétique (World System Layout)</title>
    <link rel="stylesheet" href="./static/style.css">
    <style>
        .controle-simulation {
            padding: 0 !important;
            min-height: 800px;
            position: relative;
            overflow: visible;
        }
        .flux-diagram {
            width: 100%;
            height: 100%;
            position: relative;
            min-height: 900px;
        }
        .flux-cell {
            position: absolute;
            display: grid;
            grid-template-columns: 100px 60px 100px;
            grid-template-rows: 25px 65px 20px;
            width: 260px;
            height: 110px;
        }
        .flux-circle-bg {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            border: 4px solid;
            z-index: 1;
        }
        .flux-grid-item {
            display: flex;
            align-items: center;
        }
        .flux-grid-item-center {
            justify-content: center;
        }
        .flux-grid-item-left {
            justify-content: flex-end;
        }
        .flux-grid-item-right {
            justify-content: flex-start;
        }
        .flux-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            border: 4px solid;
            position: relative;
            z-index: 2;
        }
        .flux-label {
            padding: 0px 4px;
            border-radius: 4px;
            background: white;
            border: 1px solid #ddd;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            text-align: center;
            line-height: 1.5;
            z-index: 10;
        }
        .flux-label-name {
            color: #000;
        }
        .flux-label-blue {
            color: #667eea;
        }
        .flux-sphere {
            position: absolute;
            border-radius: 50%;
            border: 1.5px dashed #28a745;
            background: none;
            pointer-events: none;
        }
        .flux-arrow {
            position: absolute;
            background: #667eea;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panels">
            <div class="left-top">
                <div class="title-container">
                    <h1>World System</h1>
                    <p class="book-reference">Référence : <a href="https://www.youtube.com/watch?v=ewc8FBtEKPs" target="_blank" rel="noopener noreferrer">David Louapre - Science Étonnante</a></p>
                </div>
                <div class="controle-simulation">
                    <div class="flux-diagram" id="flux-diagram"></div>
                </div>
            </div>
        </div>
        
        <div class="right-panels">
            <div class="plot-container-wrapper">
                <div id="plot-container">
                    <div class="plot-overlay-title">Prévisualisation - Partie droite (graphique)</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fonction pour créer une cellule avec un tableau 3x3
        // Grille 3x3 : 5 divs utilisés (4 coins vides)
        //   - [1,1] = Logo (centre)
        //   - [1,0] = Entrée (haut)
        //   - [1,2] = Sortie (bas)
        //   - [0,1] ou [2,1] = Nom + infos (gauche ou droite selon proximité)
        function createCell(x, y, radius, fillColor, strokeColor, logo, labels, labelInput = null) {
            const container = document.getElementById('flux-diagram');
            
            // Cellule principale avec grille 3x3
            // Le cercle est en arrière-plan, la grille par-dessus pour que les textes se superposent
            const cell = document.createElement('div');
            cell.className = 'flux-cell';
            // Positionner le coin supérieur gauche de la grille, puis utiliser transform pour centrer précisément
            cell.style.left = x + 'px';
            cell.style.top = y + 'px';
            cell.style.transform = 'translate(-50%, -50%)'; // Centre la grille sur (x, y), donc le centre de [1,1] est à (x, y)
            
            // Cercle en arrière-plan (derrière le tableau)
            // Le centre de la case centrale [1,1] est à (130px, 55px) dans la grille
            // Avec transform: translate(-50%, -50%) sur la grille, ce centre sera à (x, y)
            const circleBg = document.createElement('div');
            circleBg.className = 'flux-circle-bg';
            const circleSize = radius * 2;
            circleBg.style.width = circleSize + 'px';
            circleBg.style.height = circleSize + 'px';
            // Positionner le cercle au centre de la grille (130px, 55px), puis centrer avec transform
            circleBg.style.left = '130px'; // Centre de la colonne centrale
            circleBg.style.top = '55px'; // Centre de la ligne centrale (110px / 2)
            circleBg.style.transform = 'translate(-50%, -50%)'; // Centre le cercle sur (130, 55)
            circleBg.style.backgroundColor = fillColor;
            circleBg.style.borderColor = strokeColor;
            circleBg.textContent = logo;
            cell.appendChild(circleBg);
            
            // Organisation des étiquettes
            let labelObj = {};
            if (Array.isArray(labels)) {
                labelObj = {
                    name: labels[0] || '',
                    txt1: labels[1] || null,
                    txt2: labels[2] || null,
                    txt3: labels[3] || null,
                    txt4: labels[4] || null
                };
            } else {
                labelObj = labels;
            }
            
            // Créer les 9 cases de la grille (par-dessus le cercle)
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const gridItem = document.createElement('div');
                    gridItem.className = 'flux-grid-item';
                    // Ajouter la classe selon la colonne pour justify-content
                    if (col === 0) {
                        gridItem.className += ' flux-grid-item-left'; // justify-content: flex-end
                    } else if (col === 1) {
                        gridItem.className += ' flux-grid-item-center'; // justify-content: center
                    } else if (col === 2) {
                        gridItem.className += ' flux-grid-item-right'; // justify-content: flex-start
                    }
                    gridItem.style.gridColumn = col + 1;
                    gridItem.style.gridRow = row + 1;
                    gridItem.style.position = 'relative';
                    gridItem.style.zIndex = 2; // Au-dessus du cercle
                    
                    // [1,1] = Vide (le logo est dans le cercle en arrière-plan)
                    // Les autres cases contiennent les étiquettes
                    // [1,0] = Entrée en haut
                    if (col === 1 && row === 0 && labelInput) {
                        const label = document.createElement('div');
                        label.className = 'flux-label flux-label-blue';
                        label.textContent = labelInput;
                        gridItem.appendChild(label);
                    }
                    // [1,2] = Sortie en bas
                    if (col === 1 && row === 2 && labelObj.txt1) {
                        const label = document.createElement('div');
                        label.className = 'flux-label flux-label-blue';
                        label.textContent = labelObj.txt1;
                        gridItem.appendChild(label);
                    }
                    // [2,1] = Nom + infos (toujours à droite)
                    if (col === 2 && row === 1) {
                        const sideLabels = [];
                        if (labelObj.name) sideLabels.push({ text: labelObj.name, isName: true });
                        if (labelObj.txt2) sideLabels.push({ text: labelObj.txt2, isName: false });
                        if (labelObj.txt3) sideLabels.push({ text: labelObj.txt3, isName: false });
                        if (labelObj.txt4) sideLabels.push({ text: labelObj.txt4, isName: false });
                        
                        // Créer un conteneur pour empiler les étiquettes verticalement
                        const labelContainer = document.createElement('div');
                        labelContainer.style.display = 'flex';
                        labelContainer.style.flexDirection = 'column';
                        labelContainer.style.gap = '4px';
                        labelContainer.style.alignItems = 'flex-start'; // Toujours à droite (col === 2)
                        
                        sideLabels.forEach(item => {
                            const label = document.createElement('div');
                            label.className = 'flux-label ' + (item.isName ? 'flux-label-name' : 'flux-label-blue');
                            label.textContent = item.text;
                            labelContainer.appendChild(label);
                        });
                        
                        gridItem.appendChild(labelContainer);
                    }
                    // Les 4 coins sont vides (pas de contenu)
                    
                    cell.appendChild(gridItem);
                }
            }
            
            container.appendChild(cell);
            return cell;
        }
        
        // Fonction pour créer une étiquette de flèche avec des divs
        function createArrowLabel(x, y, labels) {
            const container = document.getElementById('flux-diagram');
            const labelContainer = document.createElement('div');
            labelContainer.style.position = 'absolute';
            labelContainer.style.left = x + 'px';
            labelContainer.style.top = y + 'px';
            labelContainer.style.transform = 'translate(-50%, -50%)';
            labelContainer.style.zIndex = '10';
            
            let labelObj = {};
            if (Array.isArray(labels)) {
                labelObj = {
                    name: labels[0] || '',
                    txt1: labels[1] || null,
                    txt2: labels[2] || null,
                    txt3: labels[3] || null,
                    txt4: labels[4] || null
                };
            } else {
                labelObj = labels;
            }
            
            const createLabel = (text, offsetX, offsetY, isName = false) => {
                if (!text) return;
                const label = document.createElement('div');
                label.className = 'flux-label ' + (isName ? 'flux-label-name' : 'flux-label-blue');
                label.textContent = text;
                label.style.position = 'absolute';
                label.style.left = offsetX + 'px';
                label.style.top = offsetY + 'px';
                label.style.transform = 'translate(-50%, -50%)';
                labelContainer.appendChild(label);
            };
            
            // txt2 (au-dessus)
            if (labelObj.txt2) {
                createLabel(labelObj.txt2, 0, -25, false);
            }
            
            // Nom (au centre)
            if (labelObj.name) {
                createLabel(labelObj.name, 0, 0, true);
            }
            
            // txt1 (en dessous)
            if (labelObj.txt1) {
                createLabel(labelObj.txt1, 0, 25, false);
            }
            
            // txt3 (à gauche) et txt4 (à droite)
            if (labelObj.txt3) {
                createLabel(labelObj.txt3, -60, 0, false);
            }
            if (labelObj.txt4) {
                createLabel(labelObj.txt4, 60, 0, false);
            }
            
            container.appendChild(labelContainer);
            return labelContainer;
        }
        
        // Fonction pour créer une flèche avec des divs
        function createArrow(x1, y1, x2, y2) {
            const container = document.getElementById('flux-diagram');
            const arrow = document.createElement('div');
            arrow.className = 'flux-arrow';
            
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            
            arrow.style.left = x1 + 'px';
            arrow.style.top = y1 + 'px';
            arrow.style.width = length + 'px';
            arrow.style.height = '3px';
            arrow.style.transformOrigin = '0 50%';
            arrow.style.transform = `rotate(${angle}deg)`;
            
            // Pointe de flèche à la fin de la flèche (point d'arrivée)
            arrow.style.position = 'relative';
            const arrowhead = document.createElement('div');
            arrowhead.style.position = 'absolute';
            arrowhead.style.right = '-8px';
            arrowhead.style.top = '50%';
            arrowhead.style.transform = 'translateY(-50%)';
            arrowhead.style.width = '0';
            arrowhead.style.height = '0';
            // La pointe pointe vers la droite par défaut, elle sera tournée avec la flèche
            arrowhead.style.borderLeft = '8px solid #667eea';
            arrowhead.style.borderTop = '5px solid transparent';
            arrowhead.style.borderBottom = '5px solid transparent';
            arrow.appendChild(arrowhead);
            
            container.appendChild(arrow);
            return arrow;
        }
        
        // Fonction pour créer une sphère concentrique
        function createSphere(cx, cy, r, opacity) {
            const container = document.getElementById('flux-diagram');
            const sphere = document.createElement('div');
            sphere.className = 'flux-sphere';
            sphere.style.left = (cx - r) + 'px';
            sphere.style.top = (cy - r) + 'px';
            sphere.style.width = (r * 2) + 'px';
            sphere.style.height = (r * 2) + 'px';
            sphere.style.opacity = opacity;
            container.appendChild(sphere);
            return sphere;
        }
        
        // Création des cellules (cercles plus petits, radius=40, flèches plus grandes)
        // Le soleil émet ~3.8×10²⁶ W dans toutes les directions (4π stéradians)
        // Surface sphère à 1 UA (distance Terre-Soleil) = 4π × (1.5×10¹¹ m)² ≈ 2.83×10²³ m²
        // (PAS la surface de la Terre qui est ~5.1×10¹⁴ m², mais la sphère sur laquelle l'énergie se répartit)
        // 3.8×10²⁶ W / 2.83×10²³ m² ≈ 1361 W/m² (constante solaire)
        // 340.25 W/m² = 1361/4 (moyennisation géométrique : surface sphère 4πr² vs section πr²)
        const radius = 40; // Cercles plus petits
        const spacing = 180; // Espacement plus grand entre les cercles (flèches plus grandes)
        const centerX = 150; // Centre horizontal du diagramme
        const arrowMarginTop = 10; // Marge en haut des flèches (pour éviter que le triangle déborde sur la grille)
        const arrowMarginBottom = 15; // Marge en bas des flèches (grande)
        
        createCell(centerX, 50, radius, '#ffc107', '#ff9800', '🌞', {
            name: 'Soleil',
            txt1: '3.8×10²⁶ W'
        });
        createCell(centerX, 50 + spacing, radius, '#28a745', '#28a745', '🎱', {
            name: 'Geometrie',
            txt1: '340.25 W/m²'
        }, '1361 W/m²');
        createCell(centerX, 50 + spacing * 2, radius, '#667eea', '#667eea', '🪞', {
            name: 'Albédo',
            txt1: '70%'
        });
        createCell(centerX - 50, 50 + spacing * 3, radius, '#6c757d', '#6c757d', '🌀', {
            name: 'Espace',
            txt1: '238.18 W/m²'
        });
        createCell(centerX + 50, 50 + spacing * 3, radius, '#dc3545', '#dc3545', '🌍', {
            name: 'Surface',
            txt1: '102.08 W/m²'
        });
        createCell(centerX + 50, 50 + spacing * 3.5, radius, '#dc3545', '#dc3545', '🔥', {
            name: 'Émission IR',
            txt1: 'σT⁴'
        });
        createCell(centerX + 50, 50 + spacing * 4, radius, '#667eea', '#667eea', '🌵', {
            name: 'Effet de Serre',
            txt1: 'CO₂ 0ppm + H₂O 0%'
        });
        createCell(centerX, 50 + spacing * 4.5, radius, '#6c757d', '#6c757d', '🌀', {
            name: 'Espace',
            txt1: '102.08 W/m²'
        });
        createCell(centerX + 100, 50 + spacing * 4.5, radius, '#28a745', '#28a745', '🔂', {
            name: 'Réémis vers Surface',
            txt1: '0.00 W/m²'
        });
        
        // Sphères concentriques entre Soleil et Rayonnement Incident (visualisation de la dilution)
        // Le soleil émet dans toutes les directions (4π stéradians), l'énergie se dilue sur une sphère qui grandit (loi 1/r²)
        const sunY = 50;
        const incidentY = 50 + spacing;
        const distance = incidentY - sunY;
        
        // Dessiner des sphères concentriques (cercles en 2D) qui grandissent depuis le Soleil
        // Ces sphères illustrent comment l'énergie se dilue avec la distance
        for (let i = 1; i <= 4; i++) {
            const progress = i / 4; // 0.25, 0.5, 0.75, 1.0
            const sphereRadius = radius + (distance * progress * 0.8); // Grandit progressivement
            createSphere(centerX, sunY, sphereRadius, 0.2 + (progress * 0.2));
        }
        
        // Flèches : partent du bas du tableau (grille) et arrivent en haut du suivant (marge 5px)
        // La cellule fait 110px de haut et est centrée, donc bas = y + 55px, haut = y - 55px
        const cellHeight = 110;
        const cellHalfHeight = cellHeight / 2; // 55px
        const arrows = [
            // Soleil -> Rayonnement : avec étiquette "1UA" (verticale)
            { x1: centerX, y1: 50 + cellHalfHeight, x2: centerX, y2: 50 + spacing - cellHalfHeight, marginStart: 0, marginEnd: arrowMarginTop, label: { name: '1UA' } },
            // Rayonnement -> Albédo (verticale)
            { x1: centerX, y1: 50 + spacing + cellHalfHeight, x2: centerX, y2: 50 + spacing * 2 - cellHalfHeight, marginStart: 0, marginEnd: arrowMarginTop },
            // Albédo -> Espace (diagonale)
            { x1: centerX, y1: 50 + spacing * 2 + cellHalfHeight, x2: centerX - 50, y2: 50 + spacing * 3 - cellHalfHeight, marginStart: 0, marginEnd: arrowMarginTop },
            // Albédo -> Surface (diagonale)
            { x1: centerX, y1: 50 + spacing * 2 + cellHalfHeight, x2: centerX + 50, y2: 50 + spacing * 3 - cellHalfHeight, marginStart: 0, marginEnd: arrowMarginTop },
            // Surface -> Émission IR (verticale)
            { x1: centerX + 50, y1: 50 + spacing * 3 + cellHalfHeight, x2: centerX + 50, y2: 50 + spacing * 3.5 - cellHalfHeight, marginStart: 0, marginEnd: arrowMarginTop },
            // Émission IR -> Effet de Serre (verticale)
            { x1: centerX + 50, y1: 50 + spacing * 3.5 + cellHalfHeight, x2: centerX + 50, y2: 50 + spacing * 4 - cellHalfHeight, marginStart: 0, marginEnd: arrowMarginTop },
            // Effet de Serre -> Espace (diagonale)
            { x1: centerX + 50, y1: 50 + spacing * 4 + cellHalfHeight, x2: centerX, y2: 50 + spacing * 4.5 - cellHalfHeight, marginStart: 0, marginEnd: arrowMarginTop },
            // Effet de Serre -> Réémis (diagonale)
            { x1: centerX + 50, y1: 50 + spacing * 4 + cellHalfHeight, x2: centerX + 100, y2: 50 + spacing * 4.5 - cellHalfHeight, marginStart: 0, marginEnd: arrowMarginTop },
            // Réémis -> Surface (diagonale vers le haut, arrive en bas de Surface)
            { x1: centerX + 100, y1: 50 + spacing * 4.5 + cellHalfHeight, x2: centerX + 50, y2: 50 + spacing * 3 + cellHalfHeight, marginStart: 0, marginEnd: arrowMarginBottom }
        ];
        
        arrows.forEach(arrow => {
            // Calculer la direction de la flèche
            const dx = arrow.x2 - arrow.x1;
            const dy = arrow.y2 - arrow.y1;
            const length = Math.sqrt(dx * dx + dy * dy);
            const unitX = dx / length;
            const unitY = dy / length;
            
            // Déplacer les points le long de la direction par la marge
            const x1 = arrow.x1 + unitX * arrow.marginStart;
            const y1 = arrow.y1 + unitY * arrow.marginStart;
            const x2 = arrow.x2 - unitX * arrow.marginEnd;
            const y2 = arrow.y2 - unitY * arrow.marginEnd;
            
            createArrow(x1, y1, x2, y2);
            
            // Ajouter l'étiquette de flèche si présente
            if (arrow.label) {
                const midX = (x1 + x2) / 2;
                const midY = (y1 + y2) / 2;
                createArrowLabel(midX, midY, arrow.label);
            }
        });
    </script>
</body>
</html>
