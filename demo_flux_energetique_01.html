<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démo - Histogramme Flux Énergétique (World System Layout)</title>
    <link rel="stylesheet" href="./static/style.css">
    <link rel="stylesheet" href="organigramme/organigramme.css">
    </head>
    <body>
    <div class="container">
        <div class="left-panels">
            <div class="left-top">
                <div class="title-container">
                    <h1>World System</h1>
                    <p class="book-reference">Référence : <a href="https://www.youtube.com/watch?v=ewc8FBtEKPs" target="_blank" rel="noopener noreferrer">David Louapre - Science Étonnante</a></p>
                </div>
                <div class="controle-simulation">
                    <div class="flux-diagram" id="flux-diagram"></div>
                </div>
            </div>
        </div>
        
        <div class="right-panels">
            <div class="plot-container-wrapper">
                <div id="plot-container">
                    <div class="plot-overlay-title">Prévisualisation - Partie droite (graphique)</div>
                </div>
            </div>
        </div>
    </div>

    <script src="organigramme/configOrganigramme.js"></script>
    <script src="organigramme/organigramme.js"></script>
</body>
</html>
