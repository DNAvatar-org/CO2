<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="magma" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Base Magma Planet -->
  <circle cx="50" cy="50" r="48" fill="url(#magma)" />
  
  <!-- Cracks / Lava rivers -->
  <path d="M20,50 Q35,40 50,50 T80,50" fill="none" stroke="#ffcc00" stroke-width="2" opacity="0.8"/>
  <path d="M30,30 Q50,20 70,30" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.7"/>
  <path d="M25,70 Q45,80 65,70" fill="none" stroke="#ffcc00" stroke-width="2" opacity="0.8"/>
  
  <!-- Dark Crust Patches -->
  <path d="M10,40 Q20,20 40,30 T60,20 T80,30" fill="none" stroke="#330000" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M15,60 Q30,80 50,70 T85,65" fill="none" stroke="#330000" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>
