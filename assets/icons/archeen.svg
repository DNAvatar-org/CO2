<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ocean" cx="30%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#00bfff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00008b;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Global Ocean -->
  <circle cx="50" cy="50" r="48" fill="url(#ocean)" />
  
  <!-- Small Volcanic Islands (Proto-continents) -->
  <circle cx="35" cy="45" r="5" fill="#8b4513" opacity="0.9"/>
  <circle cx="65" cy="35" r="4" fill="#8b4513" opacity="0.9"/>
  <circle cx="55" cy="65" r="6" fill="#8b4513" opacity="0.9"/>
  <ellipse cx="25" cy="60" rx="3" ry="2" fill="#8b4513" opacity="0.9"/>
  
  <!-- Atmosphere/Clouds (thin) -->
  <path d="M20,30 Q40,25 60,30" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  <path d="M30,70 Q50,75 70,70" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
</svg>
