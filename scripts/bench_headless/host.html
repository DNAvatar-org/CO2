<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>banc headless API_BILAN</title></head><body>
<!--
  Page d'accueil minimale pour faire tourner API_BILAN sans interface.
  Charge le moteur par le loader commun (API_BILAN/loader/), avec les stubs hôtes de
  API_BILAN/demo/js/demo_host.js — les mêmes que le banc époques et la scie démo.
  Version 2.0.0 — 2026-10-10 : plus de liste de scripts recopiée ni de stubs inline.

  Deux détails qui coûtent une heure à retrouver si on les oublie :
   - le worker (posé par le loader depuis apiBase) est sur une AUTRE origine (port 8765) pour que
     new Worker() lève une SecurityError : worker_pool.js bascule alors sur son repli blob, seul
     moyen d'avoir les workers spectraux quand la page n'est pas servie à côté d'API_BILAN ;
   - ?cacheBust : sans lui Chrome sert les JS du cache et on mesure le code d'avant sa modification.
-->
<script>
'use strict';
window.__READY__ = false;
window.__CB__ = new URLSearchParams(location.search).get('cb');
window.__API__ = 'http://127.0.0.1:8765/bilan_radiatif/API_BILAN/';
// Les deux fichiers du loader, puis le loader charge tout le reste.
(function () {
    const boot = ['loader/engine_manifest.js', 'loader/loader.js'];
    function next(i) {
        if (i === boot.length) {
            window.BILAN_LOADER.load({
                apiBase: window.__API__,
                before: [window.__API__ + 'demo/js/demo_host.js'],
                after: [],
                cacheBust: '?cacheBust=' + window.__CB__,
                onLoaded: function () {}
            }).then(function () { window.__READY__ = true; },
                    function (e) { window.__LOAD_ERR__ = e.message; });
            return;
        }
        const s = document.createElement('script');
        s.src = window.__API__ + boot[i] + '?cacheBust=' + window.__CB__;
        s.onload = function () { next(i + 1); };
        s.onerror = function () { window.__LOAD_ERR__ = boot[i]; };
        document.body.appendChild(s);
    }
    next(0);
})();
</script>
</body></html>
