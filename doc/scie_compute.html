<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue scientifique</title>
    <link href="css/scie_compute.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="controls">
            <div class="controls-left" style="position: relative;">
                
                <!-- Timeline horizontale (une seule ligne) -->
                <div class="timeline-horizontal-container">
                        <!-- 📜 Époque avec date -->
                        <div class="timeline-date-display" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; border-right: 1px solid #444;">
                            <span class="timeline-hourglass" style="font-size: 20px;">📜</span>
                            <span class="epoch-start-time" id="epoch-start-time" style="font-size: 10px; margin-top: 2px;">-5000 Ma</span>
                        </div>
                        
                        <!-- 📅 Date avec ticTime (Ma) + durée 1 tic -->
                        <div class="timeline-date-display" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; border-right: 1px solid #444;">
                            <span class="timeline-hourglass" style="font-size: 20px;">📅</span>
                            <span class="info-time" id="info-time" style="font-size: 10px; margin-top: 2px;">+0 Ma</span>
                            <span class="tic-duration" id="tic-duration" style="font-size: 9px; color: var(--muted, #888); margin-top: 1px;"></span>
                        </div>
                        
                        <!-- 🕰 Horloge avec événements (>> ticTime, Météorite, etc.) -->
                        <div class="timeline-horloge-display" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; border-right: 1px solid #444;">
                            <span class="horloge-icon" style="font-size: 20px;">🕰</span>
                            <div class="timeline-events-logos" id="timeline-events-logos" style="margin-top: 2px; display: flex; align-items: center; gap: 4px;">
                                <!-- >> ticTime puis logos (météorite, etc.) -->
                            </div>
                        </div>
                        
                        <!-- Boutons 🎬 ▶️ sur 2 lignes : à droite des actions, à gauche de la frise -->
                        <div class="controls-buttons-stack">
                            <button class="icon-button selected" id="anim-toggle" onclick="toggleAnim()" title="Animation">🎬</button>
                            <button class="icon-button" id="run-stop-btn" onclick="toggleRunStop()" title="Exécuter">▶️</button>
                        </div>
                        
                        <!-- Boutons d'époques avec graduations intégrées -->
                        <div class="epochs-container-horizontal" id="epochs-container-horizontal" style="flex: 1; padding-left: 2px; display: flex; align-items: center; gap: 0; flex-wrap: wrap; min-width: 0;">
                            <!-- Sera rempli dynamiquement avec boutons et graduations -->
                        </div>
                </div>
            </div>
        </div>
        
        <div id="config" class="results replied">
            <h2>📋 Configuration <button class="toggle-button" onclick="toggleConfig()">Formules +</button></h2>
            <div id="config-content"></div>
        </div>
        
        <div id="convergence" class="results replied convergence-cycles-hidden">
            <h2>⚙ Convergence : —°C <span class="convergence-buttons"><button class="toggle-button toggle-cycles" onclick="toggleCycles(); return false;">Cycles +</button><button class="toggle-button toggle-details" onclick="toggleConvergenceDetails(); return false;">Détails +</button><button class="toggle-button toggle-formules" onclick="toggleConvergence()">Formules +</button></span></h2>
            <div id="convergence-content"></div>
        </div>
        
        <div id="results" class="results" style="display: none;">
            <h2>📊 Résultats</h2>
            <div id="results-content"></div>
        </div>
        
    </div>

    <!-- Charger les dépendances dans l'ordre (chemins depuis doc/) -->
    <script src="../static/debug.js"></script>
    <script src="../static/compute/alphabet.js"></script>
    <script src="../static/compute/dico.js"></script>
    <script src="../organigramme/configOrganigramme.js"></script>
    <script src="../static/timeline/configTimeline.js"></script>
    <script src="../static/timeline/timeline.js"></script>
    <script src="../static/events.js"></script>
    <script src="../static/physics.js"></script>
    <script src="../static/climate.js"></script>
    <script src="../static/FPS/FPS.js"></script>
    <script src="../static/calculations.js"></script>
    <script src="../static/calculations_h2o.js"></script>
    <script src="../static/calculations_albedo.js"></script>
    <script src="../static/calculations_atm.js"></script>
    <script src="../static/compute/compute.js"></script>
    <script src="../static/compute/calculations_flux.js"></script>
    
    <script>
        // Vérifier ressources critiques (ex: dico.js manquant → ERR_SOCKET_NOT_CONNECTED)
        (function checkCritical() {
            var key = 'co2_reload_attempts';
            var maxAttempts = 2;
            var attempts = parseInt(sessionStorage.getItem(key) || '0', 10);
            function ok() {
                if (!window.DATA || !window.DATA['⚖️'] || !window.TIMELINE || !window.CONST) return false;
                sessionStorage.setItem(key, '0');
                return true;
            }
            if (ok()) return;
            if (attempts >= maxAttempts) {
                console.warn('Ressources manquantes (DATA, TIMELINE, CONST) après ' + maxAttempts + ' tentatives. Vérifier la console.');
                sessionStorage.setItem(key, '0');
                return;
            }
            sessionStorage.setItem(key, String(attempts + 1));
            console.warn('Ressources manquantes, rechargement (' + (attempts + 1) + '/' + maxAttempts + ')...');
            location.reload();
        })();

        // Capturer toute erreur non gérée pour éviter plantage silencieux (ex: Hadéen)
        window.onerror = function (msg, url, line, col, err) {
            console.error('❌ Erreur non gérée:', msg, url, line, col, err && err.stack);
            return false;
        };
        window.addEventListener('unhandledrejection', function (e) {
            console.error('❌ Promise rejetée non gérée:', e.reason, e.reason && e.reason.stack);
        });

        // Fonction helper pour construire les clés de logos dans le HTML (utilise window.getLogoKey si disponible)
        function getLogoKeyHTML(...names) {
            if (typeof window !== 'undefined' && window.getLogoKey) {
                return window.getLogoKey(...names);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return names.map(name => window.LOGOS[name] || '').join('');
        }
        
        function getLogoHTML(name) {
            if (typeof window !== 'undefined' && window.getLogo) {
                return window.getLogo(name);
            }
            if (typeof window === 'undefined' || !window.LOGOS) {
                return '';
            }
            return window.LOGOS[name] || '';
        }
        
        // Intercepter console.log pour afficher dans la page
        const originalLog = console.log;
        const originalError = console.error;
        // Logs désactivés - la div de logs a été supprimée
        // console.log et console.error utilisent les fonctions originales
        
        function clearLog() {
            // Logs désactivés - la div de logs a été supprimée
        }
        
        function toggleAnim() {
            const animButton = document.getElementById('anim-toggle');
            if (animButton) {
                const isSelected = animButton.classList.contains('selected');
                if (isSelected) {
                    animButton.classList.remove('selected');
                } else {
                    animButton.classList.add('selected');
                }
                // Créer ou mettre à jour plot-anim-toggle-checkbox pour compatibilité avec compute.js
                let plotAnimToggleCheckbox = document.getElementById('plot-anim-toggle-checkbox');
                if (!plotAnimToggleCheckbox) {
                    plotAnimToggleCheckbox = document.createElement('input');
                    plotAnimToggleCheckbox.type = 'checkbox';
                    plotAnimToggleCheckbox.id = 'plot-anim-toggle-checkbox';
                    plotAnimToggleCheckbox.style.display = 'none';
                    document.body.appendChild(plotAnimToggleCheckbox);
                }
                plotAnimToggleCheckbox.checked = !isSelected;
            }
        }
        
        // Fonction helper pour convertir les chemins relatifs en chemins absolus depuis la racine
        // Depuis static/compute/, on doit remonter de 2 niveaux pour atteindre la racine
        function getImagePath(relativePath) {
            if (!relativePath) return relativePath;
            // Si le chemin commence déjà par http:// ou https:// ou /, le retourner tel quel
            if (relativePath.startsWith('http://') || relativePath.startsWith('https://') || relativePath.startsWith('/')) {
                return relativePath;
            }
            // Depuis doc/ : remonter d'un niveau pour atteindre la racine
            return '../' + relativePath;
        }
        
        // ============================================================================
        // UTILITAIRES PARTAGÉS POUR TIMELINE (verticale et horizontale)
        // ============================================================================
        
        // Créer un bouton d'époque (utilitaire partagé)
        function createEpochButton(epochId, orientation) {
            const button = document.createElement('button');
            button.className = orientation === 'horizontal' ? 'epoch-btn-horizontal' : 'epoch-btn';
            button.setAttribute('data-epoch', epochId);
            
            // Le logo est directement l'emoji
            button.textContent = epochId;
            button.style.fontFamily = "'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif";
            
            // Ajouter le tooltip personnalisé avec description depuis DESC
            if (window.CHARS_DESC && window.CHARS_DESC[epochId]) {
                // Utiliser addCustomTooltip si disponible, sinon title
                if (typeof addCustomTooltip === 'function') {
                    addCustomTooltip(button, window.CHARS_DESC[epochId]);
                } else {
                    button.title = window.CHARS_DESC[epochId];
                }
            }
            
            return button;
        }
        
        // Créer une graduation (utilitaire partagé)
        function createGraduation(dateText, orientation) {
            const graduation = document.createElement('div');
            graduation.className = orientation === 'horizontal' ? 'epoch-date-item-horizontal' : 'epoch-date-item';
            
            const date = document.createElement('span');
            date.className = orientation === 'horizontal' ? 'epoch-date-horizontal' : 'epoch-date';
            date.textContent = dateText;
            
            graduation.appendChild(date);
            return graduation;
        }
        
        // Formater une date en Ma depuis les années (▶ = years, convention géo: -X Ma = X Ma avant présent)
        function formatDateMa(years) {
            const millions = Math.abs(years) / 1e6;
            if (millions >= 1) {
                const sign = years > 0 ? '-' : '';
                return `${sign}${millions.toFixed(0)}Ma`;
            }
            return years >= 0 ? `+${years}` : `${years}`;
        }
        
        // ============================================================================
        // GÉNÉRATION TIMELINE HORIZONTALE
        // 3 lignes : noms (entre les |), | logos, dates (sous les |)
        // ============================================================================
        var EPOCH_NAME_MAP = { '⚫': 'Corps noir', '🔥': 'Hadéen', '🦠': 'Archéen', '🌿': 'Protérozoïque', '🦕': 'Mésozoïque', '🦴': 'Crétacé', '🦣': 'Cénozoïque', '🚂': 'Industriel', '📱': 'Aujourd\'hui' };
        function generateHorizontalTimeline() {
            const epochsContainer = document.getElementById('epochs-container-horizontal');
            if (!epochsContainer || !window.TIMELINE) return;
            
            epochsContainer.innerHTML = '';
            
            const rowEmojis = document.createElement('div');
            rowEmojis.className = 'epochs-row-emojis';
            
            const epochItems = window.TIMELINE.filter(item => item['📅']);
            
            epochItems.forEach((item, index) => {
                const cell = document.createElement('div');
                cell.className = 'epoch-cell-horizontal';
                
                const nameSpan = document.createElement('span');
                nameSpan.className = 'epoch-name-between';
                nameSpan.textContent = EPOCH_NAME_MAP[item['📅']] || item['📅'];
                const sep = document.createElement('span');
                sep.className = 'epoch-separator';
                sep.textContent = '|';
                const button = createEpochButton(item['📅'], 'horizontal');
                button.onclick = () => selectEpoch(item['📅']);
                const dateSpan = document.createElement('span');
                dateSpan.className = 'epoch-date-under';
                dateSpan.textContent = formatDateMa(item['▶']);
                
                cell.appendChild(nameSpan);
                cell.appendChild(sep);
                cell.appendChild(button);
                cell.appendChild(dateSpan);
                
                rowEmojis.appendChild(cell);
            });
            
            epochsContainer.appendChild(rowEmojis);
            
            // Sélectionner la première époque par défaut
            if (epochItems.length > 0) {
                selectEpoch(epochItems[0]['📅']);
            }
        }
        
        // ============================================================================
        // GÉNÉRATION TIMELINE VERTICALE (pour index.html)
        // ============================================================================
        function generateVerticalTimeline() {
            const epochsContainer = document.querySelector('.epochs-container-vertical') || document.querySelector('.epochs-container');
            if (!epochsContainer || !window.TIMELINE) return;
            
            epochsContainer.innerHTML = '';
            
            window.TIMELINE.forEach(item => {
                if (item['📅']) {
                    // Créer le bouton d'époque
                    const button = createEpochButton(item['📅'], 'vertical');
                    button.setAttribute('onclick', `setEpoch('${item['📅'].replace(/'/g, "\\'")}')`);
                    epochsContainer.appendChild(button);
                } else if (item.date) {
                    // Séparateur/graduation (comme dans generateTimelineFromConfig)
                    const graduation = createGraduation(item.date, 'vertical');
                    epochsContainer.appendChild(graduation);
                }
            });
        }
        
        // Sélectionner une époque (utilise l'index directement)
        function selectEpoch(epochId) {
            // Trouver l'index de l'époque dans TIMELINE
            const epochIndex = window.TIMELINE.findIndex(item => item['📅'] === epochId);
            if (epochIndex < 0) {
                console.error(`[selectEpoch] Époque ${epochId} non trouvée`);
                return;
            }
            
            // Mettre à jour DATA['📅'] avec l'objet epoch complet (source unique de vérité)
            if (!window.DATA) window.DATA = {};
            if (!window.DATA['📜']) window.DATA['📜'] = {};
            window.DATA['📅'] = window.TIMELINE[epochIndex];
            window.DATA['📜']['👉'] = epochIndex;
            window.DATA['📜']['🗿'] = epochId; // Logo de l'époque (emoji), pas la description
            
            // Mettre à jour les boutons
            document.querySelectorAll('.epoch-btn-horizontal').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.getAttribute('data-epoch') === epochId) {
                    btn.classList.add('selected');
                }
            });
            
            // Mettre à jour la date de l'époque (depuis '▶')
            updateTimelineDisplay();
            
            // Mettre à jour les actions (boutons d'événements)
            updateEpochActions();
            
            // Réinitialiser le temps
            if (typeof window !== 'undefined' && window.DATA) {
                if (!window.DATA['📜']) window.DATA['📜'] = {};
                window.DATA['📜']['📿💫'] = 0;
                updateTimelineDisplay();
            }
        }
        
        // Mettre à jour l'affichage de la timeline (📅 date en Ma, 1 tic = X Ma)
        function updateTimelineDisplay() {
            const infoTimeDisplay = document.getElementById('info-time');
            const ticDurationEl = document.getElementById('tic-duration');
            const epochStartTime = document.getElementById('epoch-start-time');
            const DATA = window.DATA;
            const EPOCH = (DATA && DATA['📜'] != null && window.TIMELINE) ? window.TIMELINE[DATA['📜']['👉']] : null;
            const durationMa = (DATA && DATA['📜'] && DATA['📜']['🔺⏳'] != null) ? DATA['📜']['🔺⏳'] : 50;
            const tic = (DATA && DATA['📜'] && DATA['📜']['📿💫'] != null) ? DATA['📜']['📿💫'] : 0;
            if (infoTimeDisplay && DATA && DATA['📜']) {
                if (EPOCH && EPOCH['🕰'] && EPOCH['🕰']['💫']) {
                    const startMa = (EPOCH['▶'] || 0) / 1e6;
                    const dateMa = startMa - tic * durationMa;
                    infoTimeDisplay.textContent = `${dateMa.toFixed(0)} Ma`;
                } else {
                    const infoTimeMa = tic * durationMa;
                    infoTimeDisplay.textContent = `+${infoTimeMa.toFixed(0)} Ma`;
                }
            }
            if (ticDurationEl) {
                if (EPOCH && EPOCH['🕰'] && EPOCH['🕰']['💫']) {
                    ticDurationEl.textContent = `1 tic = ${durationMa} Ma`;
                    ticDurationEl.style.display = '';
                } else {
                    ticDurationEl.style.display = 'none';
                }
            }
            if (epochStartTime && DATA && EPOCH) {
                const epochStart = (EPOCH['▶'] || 0) / 1e6;
                epochStartTime.textContent = `${epochStart.toFixed(0)} Ma`;
            }
        }
        
        // Mettre à jour les événements selon l'époque (version simplifiée de events.js)
        function updateEpochActions() {
            const eventsLogos = document.getElementById('timeline-events-logos');
            if (!eventsLogos) return;
            
            eventsLogos.innerHTML = '';
            
            const DATA = window.DATA;
            let EPOCH = DATA['📅'];
            if (!EPOCH && window.DATA && window.DATA['📜'] && window.DATA['📜']['👉'] !== undefined && window.TIMELINE) {
                EPOCH = window.TIMELINE[window.DATA['📜']['👉']];
                if (!DATA['📅']) {
                    DATA['📅'] = EPOCH;
                }
            }
            
            if (!EPOCH || !EPOCH['🕰']) return;
            
            // Bouton >> avancer ticTime (💫) — affiché si l'époque a 💫
            if (EPOCH['🕰']['💫']) {
                const ticBtn = document.createElement('button');
                ticBtn.type = 'button';
                ticBtn.className = 'icon-button btn-events';
                ticBtn.textContent = '>>';
                ticBtn.title = 'Avancer d\'un tic (refroidissement, flux géothermique)';
                ticBtn.addEventListener('click', () => {
                    if (typeof window !== 'undefined' && window.DATA && window.DATA['📜']) {
                        window.DATA['📜']['📿💫'] = (window.DATA['📜']['📿💫'] || 0) + 1;
                        if (typeof window.getEpochDateConfig === 'function') window.getEpochDateConfig();
                        if (typeof window.getNoyau === 'function') window.getNoyau();
                        updateTimelineDisplay();
                    }
                });
                eventsLogos.appendChild(ticBtn);
            }
            
            // Bouton météorite de glace (☄️)
            if (EPOCH['🕰'] && EPOCH['🕰']['☄️']) {
                const meteorBtn = document.createElement('img');
                meteorBtn.src = getImagePath('fonts/pics/ice_meteorite.png');
                meteorBtn.alt = 'Météorite';
                meteorBtn.className = 'timeline-event-logo btn-events';
                meteorBtn.title = 'Météorite de glace';
                meteorBtn.addEventListener('click', () => {
                    if (typeof window !== 'undefined' && window.DATA) {
                        window.DATA['📜']['📿💫'] = (window.DATA['📜']['📿💫'] || 0) + 1;
                        if (typeof window.getEpochDateConfig === 'function') window.getEpochDateConfig();
                        if (typeof window.getNoyau === 'function') window.getNoyau();
                        updateTimelineDisplay();
                    }
                });
                eventsLogos.appendChild(meteorBtn);
            }
            
            // Bouton impact majeur
            if (EPOCH['🕰'] && EPOCH['🕰']['🎇']) {
                const bigImpactBtn = document.createElement('img');
                bigImpactBtn.src = getImagePath('fonts/pics/big_impact.png');
                bigImpactBtn.alt = 'Impact majeur';
                bigImpactBtn.className = 'timeline-event-logo btn-events';
                bigImpactBtn.title = 'Impact majeur - Crée la lune';
                bigImpactBtn.addEventListener('click', () => {
                    selectEpoch(EPOCH['🕰']['🎇']['⏩']);
                });
                eventsLogos.appendChild(bigImpactBtn);
            }
        }
        
        // Initialiser les variables globales nécessaires
        function initializeGlobals() {
            // Initialiser window.currentEpochIndex depuis le bouton sélectionné
            const selectedBtn = document.querySelector('.epoch-btn-horizontal.selected');
            let epochId = null;
            if (selectedBtn) {
                epochId = selectedBtn.getAttribute('data-epoch');
            } else {
                epochId = '⚫'; // Par défaut : Corps noir
            }
            
            // Trouver l'index de l'époque dans TIMELINE
            const epochIndex = window.TIMELINE.findIndex(item => item['📅'] === epochId);
            const epochIndex_final = epochIndex >= 0 ? epochIndex : window.TIMELINE.findIndex(item => item['📅']);
            
            // Initialiser DATA['📅'] avec l'objet epoch complet (source unique de vérité)
            if (!window.DATA) window.DATA = {};
            if (!window.DATA['📜']) window.DATA['📜'] = {};
            window.DATA['📅'] = window.TIMELINE[epochIndex_final];
            window.DATA['📜']['👉'] = epochIndex_final;
            window.DATA['📜']['🗿'] = epochId; // Logo de l'époque (emoji), pas la description
            
            // Initialiser window.getGeologicalPeriodByName si nécessaire
            if (!window.getGeologicalPeriodByName) {
                window.getGeologicalPeriodByName = function(name) {
                    return window.TIMELINE.find(epoch => epoch['📅'] === name);
                };
            }
            
            // Initialiser DATA si nécessaire
            if (!window.DATA) window.DATA = {};
            if (!window.DATA['📜']) window.DATA['📜'] = {};
            if (!window.DATA['🔘']) window.DATA['🔘'] = {};
            if (!window.DATA['🧮']) window.DATA['🧮'] = {};
            
            // 🔒 Initialiser previous (historique de convergence) comme tableau vide
            if (!window.DATA['🧮']['previous']) {
                window.DATA['🧮']['previous'] = [];
            }
            
            // Récupérer le bouton animation et son état AVANT d'initialiser DATA
            const animBtn = document.getElementById('anim-toggle');
            const animEnabled = animBtn ? animBtn.classList.contains('selected') : false;
            
            // Initialiser les valeurs dans DATA
            window.DATA['📜']['📿💫'] = 0;
            // IMPORTANT: Si animation activée, on NE TOUCHE PAS à DATA['🧮']['🧮🌡️']
            // On garde la température actuelle pour continuité entre époques
            // Note: getEpochDateConfig() sera appelé plus tard et initialisera DATA['📅']['🌡️🧮']
            if (!animEnabled) {
                // Si animation désactivée, on initialisera avec DATA['📅']['🌡️🧮'] après getEpochDateConfig()
                // Pour l'instant, on initialise avec une valeur par défaut si nécessaire
                if (!window.DATA['🧮'] || !window.DATA['🧮']['🧮🌡️'] || window.DATA['🧮']['🧮🌡️'] === 0) {
                const epochIndex = window.DATA['📜'] && window.DATA['📜']['👉'] !== undefined ? window.DATA['📜']['👉'] : 0;
                const EPOCH = window.TIMELINE[epochIndex];
                    window.DATA['🧮']['🧮🌡️'] = EPOCH ? EPOCH['🌡️🧮'] : 180.0;
                }
            } else {
                // Si animation activée, on ne touche PAS à DATA['🧮']['🧮🌡️']
                // Elle sera utilisée dans calculateT0() ligne 38 comme T0_base
                if (!window.DATA['🧮'] || !window.DATA['🧮']['🧮🌡️'] || window.DATA['🧮']['🧮🌡️'] === 0) {
                    // Seulement si elle n'existe vraiment pas, on l'initialise
                    const epochIndex = window.DATA['📜'] && window.DATA['📜']['👉'] !== undefined ? window.DATA['📜']['👉'] : 0;
                    const EPOCH = window.TIMELINE[epochIndex];
                    window.DATA['🧮']['🧮🌡️'] = EPOCH ? EPOCH['🌡️🧮'] : 180.0;
                }
            }
            
            // Initialiser les états activés
            if (window.getEnabledStates) {
                window.getEnabledStates();
            }
            
            // Créer ou mettre à jour plot-anim-toggle-checkbox pour compatibilité avec compute.js
            let plotAnimToggleCheckbox = document.getElementById('plot-anim-toggle-checkbox');
            if (!plotAnimToggleCheckbox) {
                plotAnimToggleCheckbox = document.createElement('input');
                plotAnimToggleCheckbox.type = 'checkbox';
                plotAnimToggleCheckbox.id = 'plot-anim-toggle-checkbox';
                plotAnimToggleCheckbox.style.display = 'none';
                document.body.appendChild(plotAnimToggleCheckbox);
            }
            plotAnimToggleCheckbox.checked = animEnabled;
            
            // Mettre à jour DATA['🔘']['🔘🎬'] avec l'état d'animation
            if (!window.DATA['🔘']) window.DATA['🔘'] = {};
            window.DATA['🔘']['🔘🎬'] = animEnabled;
        }
        
        function setRunStopButtonRunning(running) {
            const btn = document.getElementById('run-stop-btn');
            if (!btn) return;

                const coverage = albedo[coverage_key] || 0;
                const coeff = albedoReflectorCoeff[coeff_key] || 0;

            formulasHtml += `🍰🪩⛅ = Si moderne : 0.20 + 0.10 × ☁️ (plage 0.20-0.30). Si Hadéen/Archéen : C_max × ☁️<br>`;

        // Fonction pour calculer et afficher les formules des flux
        function calculateFluxFormulas(flux, soleil, albedo) {
            if (!flux || !soleil || !albedo) return '';
            
            let formulas = [];
            const CONST = window.CONST;
            const DATA = window.DATA;
            
            // 🧲☀️🔽: 🧲☀️🎱 × (1 - 🍰🪩📿) = Flux solaire absorbé (formule = calcul dans calculations_flux.js)
            const solar_avg = soleil['🧲☀️🎱'];
            const albedo_val = albedo['🍰🪩📿'];
            const calculated = solar_avg * (1 - albedo_val);
            const actual = flux['🧲☀️🔽'];
            
            if (solar_avg == null || albedo_val == null || calculated == null || actual == null) {
                return '';
            }
            const matchSolar = (Math.abs(calculated - actual) < 0.01) ? ' ✓' : ` (affiché: ${actual.toFixed(2)})`;
            formulas.push(`<strong>🧲☀️🔽</strong>: <strong>🧲☀️🎱</strong> × (1 - <strong>🍰🪩📿</strong>) = ${solar_avg.toFixed(2)} × (1 - ${albedo_val.toFixed(4)}) = ${calculated.toFixed(2)} W/m²${matchSolar}`);
            
            // 🧲🌕🔽: Flux géothermique (constant)
            if (flux['🧲🌕🔽'] !== undefined) {
                formulas.push(`<strong>🧲🌕🔽</strong>: Flux géothermique (constant) = ${flux['🧲🌕🔽'].toFixed(2)} W/m²`);
            }
            
            // 🧲🌑🔼: σ × T⁴ = Flux émis par la surface (corps noir) — T = DATA['🧮']['🧮🌡️'] (même clé que le calcul)
            if (flux['🧲🌑🔼'] !== undefined && DATA && DATA['🧮'] && DATA['🧮']['🧮🌡️'] != null) {
                const T = DATA['🧮']['🧮🌡️'];
                const sigma = CONST.STEFAN_BOLTZMANN;
                const calculated = sigma * Math.pow(T, 4);
                const actual = flux['🧲🌑🔼'];
                const match = (Math.abs(calculated - actual) < 0.01) ? ' ✓' : ` (affiché: ${actual.toFixed(2)}, écart: ${(actual - calculated).toFixed(2)})`;
                formulas.push(`<strong>🧲🌑🔼</strong>: σ × T⁴ = ${sigma.toExponential(2)} × ${T.toFixed(2)}⁴ = ${calculated.toFixed(2)} W/m²${match}`);
                formulas.push(`&nbsp;&nbsp;&nbsp;&nbsp;Flux émis par la surface (corps noir). ⚠️ Ce n'est PAS le flux qui sort au sommet (c'est 🧲🌈🔼)`);
            }
            
            // 🧲🌈🔼: Σ[λ=0.1→100μm] I_λ(z_max) × Δλ = Aire sous courbe spectrale réelle
            if (flux['🧲🌈🔼'] !== undefined) {
                formulas.push(`<strong>🧲🌈🔼</strong>: Σ[λ=0.1→100μm] I_λ(z_max) × Δλ = ${flux['🧲🌈🔼'].toFixed(2)} W/m²`);
                formulas.push(`&nbsp;&nbsp;&nbsp;&nbsp;Aire sous courbe spectrale réelle (émission au sommet atmosphère, après transfert radiatif couche par couche)`);
            }
            
            // 🧲🪩🔼: 🧲☀️🎱 - 🧲☀️🔽 = 🧲☀️🎱 × 🍰🪩📿 = Flux réfléchi par albedo
            if (flux['🧲🪩🔼'] !== undefined && soleil && soleil['🧲☀️🎱'] !== undefined && flux['🧲☀️🔽'] !== undefined) {
                const solar_avg = soleil['🧲☀️🎱'];
                const calculated1 = solar_avg - flux['🧲☀️🔽'];
                const calculated2 = albedo && albedo['🍰🪩📿'] !== undefined ? solar_avg * albedo['🍰🪩📿'] : calculated1;
                const actual = flux['🧲🪩🔼'];
                formulas.push(`<strong>🧲🪩🔼</strong>: <strong>🧲☀️🎱</strong> - <strong>🧲☀️🔽</strong> = <strong>🧲☀️🎱</strong> × <strong>🍰🪩📿</strong> = ${calculated2.toFixed(2)} W/m²`);
            }
            
            // 🔺🧲: 🧲☀️🔽 + 🧲🌕🔽 - 🧲🌈🔼 = flux_entrant - flux_sortant (Δ>0→réchauffer, Δ<0→refroidir)
            if (flux['🔺🧲'] !== undefined && flux['🧲☀️🔽'] !== undefined && flux['🧲🌕🔽'] !== undefined && flux['🧲🌈🔼'] !== undefined) {
                const calculated = flux['🧲☀️🔽'] + flux['🧲🌕🔽'] - flux['🧲🌈🔼'];
                const actual = flux['🔺🧲'];
                const matchDelta = (Math.abs(calculated - actual) < 0.01) ? ' ✓' : ` (affiché: ${actual.toFixed(2)})`;
                formulas.push(`<strong>🔺🧲</strong>: <strong>🧲☀️🔽</strong> + <strong>🧲🌕🔽</strong> - <strong>🧲🌈🔼</strong> = ${flux['🧲☀️🔽'].toFixed(2)} + ${flux['🧲🌕🔽'].toFixed(2)} - ${flux['🧲🌈🔼'].toFixed(2)} = ${calculated.toFixed(2)} W/m²${matchDelta}`);
                formulas.push(`&nbsp;&nbsp;&nbsp;&nbsp;Delta équilibre radiatif (flux entrant - flux sortant). Δ>0→réchauffer, Δ<0→refroidir. En équilibre: 🔺🧲 ≈ 0`);
            }
            
            if (formulas.length === 0) return '';
            
            return `<div class="formule">${formulas.join('<br>')}</div>`;
        }
        
        // Fonction json2html pour convertir un objet JSON en HTML formaté
        // Utilise JSON.stringify puis formate pour correspondre à grammar.txt (guillemets simples)
        function json2html(obj, title, source, objName = null, categoryKey = null) {
            if (!obj) return '';
            
            // Formater les nombres : notation scientifique pour grands nombres, 3 décimales toujours
            const formatNumber = (value) => {
                if (typeof value !== 'number') return value;
                if (value === 0) return '0.000';
                // Utiliser notation scientifique si |value| > 1000 ou |value| < 0.001
                if (Math.abs(value) > 1000 || (Math.abs(value) < 0.001 && value !== 0)) {
                    return value.toExponential(3);
                }
                // Sinon, 3 décimales
                return value.toFixed(3);
            };
            
            // Formater récursivement l'objet
            const formatValue = (value) => {
                if (value === null) return 'null';
                if (value === undefined) return 'undefined';
                if (typeof value === 'number') return formatNumber(value);
                if (typeof value === 'boolean') return value.toString();
                if (typeof value === 'string') return `'${value}'`;
                if (Array.isArray(value)) {
                    return '[' + value.map(formatValue).join(', ') + ']';
                }
                if (typeof value === 'object') {
                    const entries = Object.entries(value).map(([k, v]) => `'${k}':${formatValue(v)}`);
                    return '{' + entries.join(', ') + '}';
                }
                return String(value);
            };
            
            // Construire la chaîne JSON formatée
            let jsonStr = formatValue(obj);
            
            // Ajouter le logo si categoryKey fourni (sans objName)
            if (categoryKey) {
                // Utiliser juste le logo, sans nom de description
                jsonStr = `${categoryKey}=${jsonStr}`;
            } else if (objName) {
                // Si pas de categoryKey mais objName, utiliser juste objName
                jsonStr = `${objName}=${jsonStr}`;
            }
            
            // Ne pas afficher le titre (description) - juste le JSON avec le logo
            // Ajouter les formules depuis FORM si categoryKey fourni
            let formuleHtml = '';
            if (categoryKey && window.FORM && window.FORM[categoryKey]) {
                const formulas = [];
                for (const key in obj) {
                    if (window.FORM[categoryKey][key]) {
                        let formula = window.FORM[categoryKey][key];
                        // Ignorer les formules dont la description commence par "!" (variables internes aux calculs)
                        if (formula.startsWith('!')) continue;
                        // Remplacer %1, %2, %3... par les valeurs réelles depuis obj[key]
                        // %1 = valeur actuelle, %2 = valeur précédente (si disponible), etc.
                        const value = obj[key];
                        if (typeof value === 'number') {
                            // Formater selon la valeur (notation scientifique si grand/petit)
                            const formatValue = (val) => {
                                if (val === 0) return '0.000';
                                if (Math.abs(val) > 1000 || (Math.abs(val) < 0.001 && val !== 0)) {
                                    return val.toExponential(3);
                                }
                                return val.toFixed(3);
                            };
                            formula = formula.replace(/%1/g, formatValue(value));
                            formula = formula.replace(/%2/g, formatValue(value)); // Pour l'instant, %2 = %1
                        }
                        // Rendre les symboles mathématiques plus visibles
                        formula = formula.replace(/∀/g, '<strong style="font-size: 1.1em;">∀</strong>');
                        formula = formula.replace(/∈/g, '<strong style="font-size: 1.1em;">∈</strong>');
                        formulas.push(`${key}: ${formula}`);
                    }
                }
                if (formulas.length > 0) {
                    formuleHtml = `<div class="formule">${formulas.join('<br>')}</div>`;
                }
            }
            
            let html = `
                <div class="config-section">
                    <div class="config-value">${jsonStr}</div>
                    ${formuleHtml ? `<div class="formule-container notVisible">${formuleHtml}</div>` : ''}
                </div>
            `;
            return html;
        }
        
        // Fonction pour formater JSON avec notation scientifique pour les grands/petits nombres
        function formatJSONCompact(obj) {
            return JSON.stringify(obj, (key, value) => {
                if (typeof value === 'number') {
                    // Utiliser notation scientifique si > 1000 ou < 0.001
                    if (Math.abs(value) > 1000 || (Math.abs(value) < 0.001 && value !== 0)) {
                        return value.toExponential(3);
                    }
                    // Sinon, garder la notation décimale avec 3 décimales max
                    return parseFloat(value.toFixed(3));
                }
                return value;
            });
        }

        // Fonction pour comparer deux objets et retourner seulement les différences
        function getDifferences(current, previous) {
            if (!previous) return current; // Première itération : afficher tout
            
            const diff = {};
            for (const key in current) {
                const currentVal = current[key];
                const previousVal = previous[key];
                
                // Comparer les valeurs (tolérance pour les nombres)
                if (typeof currentVal === 'number' && typeof previousVal === 'number') {
                    if (Math.abs(currentVal - previousVal) > 0.0001) {
                        diff[key] = currentVal;
                    }
                } else if (typeof currentVal === 'object' && currentVal !== null && typeof previousVal === 'object' && previousVal !== null) {
                    // Objets imbriqués : comparer récursivement
                    const nestedDiff = getDifferences(currentVal, previousVal);
                    if (Object.keys(nestedDiff).length > 0) {
                        diff[key] = nestedDiff;
                    }
                } else if (currentVal !== previousVal) {
                    // Valeurs différentes
                    diff[key] = currentVal;
                }
            }
            return diff;
        }
        
        function displayConvergence() {

            let html = '';
            
            // Afficher les détails de convergence si disponible (exclure Init = Configuration)
            // Par cycle eau : 🫧, 💧, 🪩 une fois. À chaque calcul radiatif : 🧮 et 🧲 uniquement.
            const history = Array.isArray(DATA['🧮']['previous']) ? DATA['🧮']['previous'] : [];
            if (Array.isArray(history) && history.length > 0) {
                const iterations_to_show = history.filter(s => s.phase !== 'Init' || s.innerIter === -1);
                const radiatif_only = iterations_to_show.filter(s => s.innerIter != null);
                const last_state = radiatif_only.length ? radiatif_only[radiatif_only.length - 1] : (iterations_to_show[iterations_to_show.length - 1] || history[history.length - 1]);

                // Ordre = ordre d'écriture (temps CPU), pas de tri ni regroupement
                const states = iterations_to_show;
                const safeNumTemp = (v, def) => { if (v == null) return def; const n = Number(v); if (!Number.isFinite(n)) return def; return n.toFixed(1); };
                const safeNum = (v, def) => { if (v == null) return def; const n = Number(v); if (!Number.isFinite(n)) return def; return (Math.abs(n) >= 1e3 || (Math.abs(n) < 1e-2 && n !== 0)) ? n.toExponential(3) : n.toFixed(3); };
                const safeNumDelta = (v, def) => {
                    if (v == null) return def;
                    const n = Number(v);
                    if (!Number.isFinite(n)) return def;
                    const a = Math.abs(n);
                    if (a >= 1e6) return (n < 0 ? '-' : '') + (a / 1e6).toFixed(1) + 'e6';
                    if (a >= 1e3) return (n < 0 ? '-' : '') + (a / 1e3).toFixed(1) + 'e3';
                    if (a < 1e-2 && n !== 0) return n.toExponential(2);
                    return n.toFixed(2);
                };
                states.forEach((state, idx) => {
                    try {
                        if (!state) return;
                        const waterIter = (state.waterIter != null) ? state.waterIter : ((state.waterPass != null) ? state.waterPass : 0);
                        const albedoIter = (state.albedoIter != null) ? state.albedoIter : ((state.waterPass != null) ? state.waterPass : 0);
                        if (state.phase === 'CycleEau') {
                            const cycleState = state;
                            const T_cycle = safeNumTemp((cycleState.data_snapshot && cycleState.data_snapshot['🧮'] && cycleState.data_snapshot['🧮']['🧮🌡️'] != null) ? cycleState.data_snapshot['🧮']['🧮🌡️'] - 273.15 : DATA['🧮']['🧮🌡️'] - 273.15, '-');
                            const compactEau = (cycleState.data_snapshot && cycleState.data_snapshot['💧']) ? formatJSONCompact(cycleState.data_snapshot['💧']).replace(/"/g, "'") : '';
                            html += `<div class="iteration-header convergence-cycle"><strong>💧 cycle de l'eau ${albedoIter}</strong> @${T_cycle}°C :${compactEau ? `<span class="convergence-inline-json"> ${compactEau}</span>` : ''}</div>`;
                            if (cycleState.data_snapshot) {
                                html += '<div class="convergence-cycle-eau-block convergence-cycle">';
                                ['🫧', '💧'].forEach(cat => {
                                    if (cycleState.data_snapshot[cat]) html += json2html(cycleState.data_snapshot[cat], '', '', null, cat);
                                });
                                html += '</div>';
                            }
                            return;
                        }
                        if (state.phase === 'CycleEauCrossing') {
                            const T_trans = (state.T_transition_C != null) ? safeNumTemp(state.T_transition_C, '-') : '-';
                            const P_atm = (state.P_atm != null) ? Number(state.P_atm).toFixed(2) : '-';
                            const compactEau = (state.data_snapshot && state.data_snapshot['💧']) ? formatJSONCompact(state.data_snapshot['💧']).replace(/"/g, "'") : '';
                            html += `<div class="iteration-header convergence-cycle"><strong>💧┴ = ${T_trans}°C [🎈=${P_atm} atm]</strong> :${compactEau ? `<span class="convergence-inline-json"> ${compactEau}</span>` : ''}</div>`;
                            if (state.data_snapshot) {
                                html += '<div class="convergence-cycle-eau-block convergence-cycle">';
                                ['🫧', '💧'].forEach(cat => {
                                    if (state.data_snapshot[cat]) html += json2html(state.data_snapshot[cat], '', '', null, cat);
                                });
                                html += '</div>';
                            }
                            return;
                        }
                        if (state.innerIter == null) return; // Init et radiatif uniquement
                        if (state.data_snapshot && state.data_snapshot['🪩']) {
                            const compactAlbedo = formatJSONCompact(state.data_snapshot['🪩']).replace(/"/g, "'");
                            const prevState = states[idx - 1];
                            const T_alb = safeNumTemp(
                                (state.innerIter === -1) ? state.temperature_C
                                    : (prevState && prevState.next_T_C != null ? prevState.next_T_C : state.temperature_C),
                                '-');
                            html += `<div class="iteration-header convergence-cycle"><strong>🪩 cycle albédo ${albedoIter}</strong> @${T_alb}°C :<span class="convergence-inline-json"> ${compactAlbedo}</span></div>`;
                        }
                        const innerIter = state.innerIter;
                        const T = safeNumTemp(state.temperature_C, '-');
                        const albedo = safeNum(state.albedo, '-');
                        const phase = (state.phase != null) ? String(state.phase) : '-';
                        const delta = safeNumDelta(state.delta_equilibre, '-');
                        const m = state.data_snapshot['🧮'] || {};
                        // ☯ = ancien signe (stocké au push) : permet de voir le changement de signe qui déclenche Dicho
                        const yy = (state.yinYang != null) ? Number(state.yinYang) : ((state.delta_equilibre != null) ? Math.sign(Number(state.delta_equilibre)) : 0);
                        const yinYangStr = (yy === 1) ? '+' : (yy === -1) ? '−' : '0';
                        const iterLabel = (innerIter === -1) ? 'Init' : (innerIter + 1);
                        const T_low_K = m['🧮🌡️🔽'];
                        const T_high_K = m['🧮🌡️🔼'];
                        const dichoBounds = (T_low_K != null && T_high_K != null)
                            ? ` [🔽: ${safeNumTemp(T_low_K - 273.15, '-')}°C, 🔼: ${safeNumTemp(T_high_K - 273.15, '-')}°C]`
                            : '';
                        const seuil = (m['🧲🔬'] != null) ? m['🧲🔬'] : null;
                        const seuilStr = seuil != null ? safeNum(seuil, '-') : '-';
                        const deltaVal = state.delta_equilibre != null ? Number(state.delta_equilibre) : NaN;
                        const arretOk = (Number.isFinite(deltaVal) && seuil != null && Math.abs(deltaVal) <= seuil) ? 'oui' : 'non';
                                const nextState = states[idx + 1];
                        // Init : next_T_C = T actuelle (pas de déplacement). Sinon : nextState ou state.next_T_C.
                                let nextT = (phase === 'Init' && state.next_T_C != null && Number.isFinite(state.next_T_C))
                            ? state.next_T_C.toFixed(1)
                            : (nextState && nextState.temperature_C != null && Number.isFinite(nextState.temperature_C))
                                ? nextState.temperature_C.toFixed(1)
                                : (state.next_T_C != null && Number.isFinite(state.next_T_C) ? state.next_T_C.toFixed(1) : '');
                        if (!nextT && phase === 'Dicho') {
                            if (T_low_K != null && T_high_K != null && Number.isFinite(T_low_K) && Number.isFinite(T_high_K))
                                nextT = ((T_low_K + T_high_K) / 2 - 273.15).toFixed(1);
                            else if (state.dichoT_low_C != null && state.dichoT_high_C != null)
                                nextT = ((state.dichoT_low_C + state.dichoT_high_C) / 2).toFixed(1);
                        }
                        const nextTSuffix = nextT ? ` => ${nextT}°C` : '';
                        html += `<div class="iteration-header">🌈 calcul radiatif ${iterLabel} @${T}°C : Albedo: ${albedo} => Δ: ${delta} W/m² .. ⚧: ${phase} & ☯: ${yinYangStr} => arrêt |Δ|≤${seuilStr} W/m²: ${arretOk}${dichoBounds}${nextTSuffix}</div>`;
                        html += '<div class="convergence-details-block">';
                        if (DATA['🧮']) {
                            const m = { ...DATA['🧮'] };
                            delete m.previous;
                            html += json2html(m, '', '', null, '🧮');
                        }
                        if (DATA['🧲']) html += json2html(DATA['🧲'], '', '', null, '🧲');
                        if (DATA['📛']) html += json2html(DATA['📛'], '', '', null, '📛');
                        html += '</div>';
                        } catch (stateErr) {
                            console.warn('État de convergence ignoré (données invalides):', stateErr);
                        }
                    });

                // Afficher la température finale (dernier calcul radiatif) — T° toujours en décimal, 1 décimale
                const safeNumLast = (v) => { if (v == null) return '—'; const n = Number(v); if (!Number.isFinite(n)) return '—'; return (Math.abs(n) >= 1e3 || (Math.abs(n) < 1e-2 && n !== 0)) ? n.toExponential(3) : n.toFixed(3); };
                const safeNumTempLast = (v) => { if (v == null) return '—'; const n = Number(v); if (!Number.isFinite(n)) return '—'; return n.toFixed(1); };
                // Breakdown EDS par gaz (📛)
                const breakdown = DATA['📛'];
                if (breakdown) {
                    const fmt = (v) => (v != null && Number.isFinite(v)) ? v.toFixed(2) : '—';
                    html += '<div class="config-value convergence-breakdown-block" style="margin-top:10px;padding:8px;background:rgba(0,0,0,0.2);border-radius:6px;">';
                    html += '<strong>EDS (effet de serre)</strong>: 🧲📛 = ' + fmt(breakdown['🧲📛']) + ' W/m²<br>';
                    html += '<strong>Répartition par gaz</strong> (🍰📛 ∈ [0, 1]):<br>';
                    if (breakdown['🍰📛🏭'] != null && breakdown['🍰📛🏭'] > 0) html += `&nbsp;• CO₂: ${fmt(breakdown['🍰📛🏭'])}<br>`;
                    if (breakdown['🍰📛💧'] != null && breakdown['🍰📛💧'] > 0) html += `&nbsp;• H₂O: ${fmt(breakdown['🍰📛💧'])}<br>`;
                    if (breakdown['🍰📛⛽'] != null && breakdown['🍰📛⛽'] > 0) html += `&nbsp;• CH₄: ${fmt(breakdown['🍰📛⛽'])}<br>`;
                    html += '</div>';
                }

                html += '<div class="config-value convergence-final-block">';
                // Température finale = DATA (état convergé), pas last_state (dernier push avant break)
                const T_final_K = DATA['🧮'] && DATA['🧮']['🧮🌡️'] != null ? DATA['🧮']['🧮🌡️'] : (last_state && last_state.temperature_K);
                const T_final_C = T_final_K != null ? T_final_K - CONST.KELVIN_TO_CELSIUS : (last_state && last_state.temperature_C);
                const Tc = safeNumTempLast(T_final_C);
                const Tk = safeNumTempLast(T_final_K);
                html += `<div class="config-value"><strong>Température finale: ${Tc}°C (${Tk}K)</strong></div>`;
                const P_atm = DATA['🫧']['🎈'];
                const T_boil_K = window.getBoilingPointKFromPressure(P_atm);
                const T_boil_C = (T_boil_K - 273.15).toFixed(1);
                const TcNum = T_final_C != null ? Number(T_final_C) : null;
                const aboveBoil = Number.isFinite(TcNum) && TcNum > T_boil_K - 273.15;
                html += `<div class="config-value">T_ébullition(🎈=${P_atm.toFixed(2)} atm) = ${T_boil_C}°C ${aboveBoil ? '→ T finale &gt; T_ébullition (eau bout)' : '→ liquide possible'}</div>`;
                const stopReason = DATA['🧮'] && DATA['🧮']['🧮🛑'];
                const deltaFinal = DATA['🧲'] && DATA['🧲']['🔺🧲'] != null ? Number(DATA['🧲']['🔺🧲']) : NaN;
                const seuilFinal = DATA['🧮'] && DATA['🧮']['🧲🔬'] != null ? Number(DATA['🧮']['🧲🔬']) : null;
                const stopLabels = { converged: 'Convergence |Δ|≤seuil', max_iter: 'Max itérations radiatives', abort: 'Arrêt manuel', crash: 'Crash algo', max_water: 'Max cycles eau' };
                const stopLabel = (stopReason && stopLabels[stopReason]) ? stopLabels[stopReason] : (stopReason || '—');
                const absDelta = Number.isFinite(deltaFinal) ? Math.abs(deltaFinal) : NaN;
                const deltaStr = Number.isFinite(absDelta) ? (absDelta >= 1e3 || (absDelta < 1e-2 && absDelta !== 0) ? absDelta.toExponential(2) : absDelta.toFixed(2) + '') : '—';
                const seuilStr = seuilFinal != null ? (Math.abs(seuilFinal) >= 1e3 || (Math.abs(seuilFinal) < 1e-2 && seuilFinal !== 0) ? seuilFinal.toExponential(2) : seuilFinal.toFixed(2) + '') : '—';
                const stopDetail = (stopReason === 'max_iter' && Number.isFinite(deltaFinal) && seuilFinal != null)
                    ? ` (|Δ|=${deltaStr} W/m² &gt; seuil ${seuilStr} W/m²)`
                    : (stopReason === 'converged' ? ` (|Δ|=${deltaStr} W/m² ≤ ${seuilStr} W/m²)` : '');
                html += `<div class="config-value"><strong>Arrêt:</strong> ${stopLabel}${stopDetail}</div>`;
                if (window.DEBUG_ANALYSE_DETAIL && window.DETAIL_LOG_TEXT) {
                    html += '<div class="config-value" style="margin-top:12px;padding:10px;background:rgba(0,0,0,0.25);border-radius:6px;font-family:monospace;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto;">';
                    html += '<strong>Détail premiers calculs:</strong><br><pre style="margin:8px 0 0 0;padding:0;">' + (window.DETAIL_LOG_TEXT || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</pre></div>';
                }
                html += '</div>';
            }
            
            // Toujours afficher le panneau même si html est vide
            convergenceContent.innerHTML = html || '<div class="config-value">Aucune donnée de convergence disponible</div>';
            convergenceDiv.style.display = 'block';
            // Log structuré pour analyses (window.DEBUG_ANALYSE = true)
            if (window.DEBUG_ANALYSE && window.DATA && window.DATA['📊']) {
                const D = window.DATA;
                const bins = D['📊'].lambda_range ? D['📊'].lambda_range.length : 0;
                const layers = D['📊'].z_range ? D['📊'].z_range.length : 0;
                const P = D['🫧'] && D['🫧']['🎈'] != null ? D['🫧']['🎈'] : null;
                const delta = D['🧲'] && D['🧲']['🔺🧲'] != null ? D['🧲']['🔺🧲'] : null;
                const eds = D['📛'] && D['📛']['🧲📛'] != null ? D['📛']['🧲📛'] : null;
                const T_final = D['🧮'] && D['🧮']['🧮🌡️'] != null ? D['🧮']['🧮🌡️'] : null;
                const T_cible = D['📅'] && D['📅']['🌡️🧮'] != null ? D['📅']['🌡️🧮'] : null;
                const epochId = D['📜'] && D['📜']['👉'] != null && window.TIMELINE ? (window.TIMELINE[D['📜']['👉']] && window.TIMELINE[D['📜']['👉']]['📅']) : null;
                console.log('[ANALYSE] convergence | epoch=' + (epochId || '?') + ' bins=' + bins + ' layers=' + layers + ' P_atm=' + (P != null ? P.toFixed(2) : '?') + ' delta_W=' + (delta != null ? delta.toFixed(2) : '?') + ' EDS=' + (eds != null ? eds.toFixed(2) : '?') + ' T_final_K=' + (T_final != null ? T_final.toFixed(2) : '?') + ' T_cible_K=' + (T_cible != null ? T_cible.toFixed(2) : '?'));
            }
            } catch (err) {
                console.error('❌ displayConvergence:', err);
                const convergenceContent = document.getElementById('convergence-content');
                if (convergenceContent) convergenceContent.innerHTML = `<div class="config-value error">Erreur affichage: ${err.message}</div>`;
            }
        }
        
        // 🔒 Exposer displayConvergence sur window pour que calculations_flux.js puisse l'appeler
        window.displayConvergence = displayConvergence;
        
        function toggleConfig() {
            const configDiv = document.getElementById('config');
            const button = configDiv.querySelector('.toggle-button');
            const formuleContainers = configDiv.querySelectorAll('.formule-container');
            
            // Toggle la classe 'replied' pour replier/déplier la section
            const isReplied = configDiv.classList.contains('replied');
            if (isReplied) {
                configDiv.classList.remove('replied');
                button.textContent = 'Results −';
                // Quand on déplie, afficher les formules si elles existent
                formuleContainers.forEach(container => {
                    container.classList.remove('notVisible');
                    container.classList.add('visible');
                });
            } else {
                configDiv.classList.add('replied');
                button.textContent = 'Formules +';
                // Quand on replie, cacher les formules
                formuleContainers.forEach(container => {
                    container.classList.remove('visible');
                    container.classList.add('notVisible');
                });
            }
        }
        
        function toggleConvergence() {
            const convergenceDiv = document.getElementById('convergence');
            const formulesButton = convergenceDiv.querySelector('h2 .toggle-formules');
            const formuleContainers = convergenceDiv.querySelectorAll('.formule-container');
            
            const isReplied = convergenceDiv.classList.contains('replied');
            if (isReplied) {
                convergenceDiv.classList.remove('replied');
                if (formulesButton) formulesButton.textContent = 'Results −';
                formuleContainers.forEach(container => {
                    container.classList.remove('notVisible');
                    container.classList.add('visible');
                });
            } else {
                convergenceDiv.classList.add('replied');
                if (formulesButton) formulesButton.textContent = 'Formules +';
                formuleContainers.forEach(container => {
                    container.classList.remove('visible');
                    container.classList.add('notVisible');
                });
            }
        }
        
        function toggleConvergenceDetails() {
            const convergenceDiv = document.getElementById('convergence');
            const detailsButton = convergenceDiv.querySelector('h2 .toggle-details');
            const detailsVisible = convergenceDiv.classList.toggle('details-visible');
            if (detailsButton) detailsButton.textContent = detailsVisible ? 'Détails −' : 'Détails +';
        }
        function toggleCycles() {
            const convergenceDiv = document.getElementById('convergence');
            const btn = convergenceDiv.querySelector('h2 .toggle-cycles');
            const hidden = convergenceDiv.classList.toggle('convergence-cycles-hidden');
            if (btn) btn.textContent = hidden ? 'Cycles +' : 'Cycles −';
        }
        
        function toggleLexique() {
            const lexiqueDiv = document.getElementById('lexique');
            const button = lexiqueDiv.querySelector('.toggle-button');
            if (lexiqueDiv.classList.contains('replied')) {
                lexiqueDiv.classList.remove('replied');
                button.textContent = 'x';
            } else {
                lexiqueDiv.classList.add('replied');
                button.textContent = '+';
            }
        }
        
        function toggleSyntaxe() {
            const syntaxeDiv = document.getElementById('syntaxe');
            const button = syntaxeDiv.querySelector('.toggle-button');
            if (syntaxeDiv.classList.contains('replied')) {
                syntaxeDiv.classList.remove('replied');
                button.textContent = 'x';
            } else {
                syntaxeDiv.classList.add('replied');
                button.textContent = '+';
            }
        }
        
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'resize-iframe') {
                const iframe = event.data.source === 'alphabet' 
                    ? document.getElementById('alphabet-iframe')
                    : document.getElementById('dico-iframe');
                if (iframe && event.data.height) {
                    iframe.style.height = event.data.height + 'px';
                }
            }
        });
        
        // Initialiser au chargement
        window.addEventListener('DOMContentLoaded', function() {
            // Les contenus Alphabet et Dico sont maintenant chargés via iframe (alphabet.html et dico.html)
            console.log('📄 Page de test chargée');
            console.log('🔧 Initialisation des variables globales...');
            
            // S'assurer que TIMELINE est chargée
            if (window.TIMELINE) {
                console.log(`✅ Timeline chargée: ${window.TIMELINE.length} époques`);
                // Générer la timeline horizontale
                generateHorizontalTimeline();
            } else {
                console.error('❌ Timeline non chargée');
            }
        });
    </script>
</body>
</html>
