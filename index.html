    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['$$', '$$']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    // Après le rendu MathJax, ajouter le code LaTeX sélectionnable sous chaque formule
                    setTimeout(() => {
                        document.querySelectorAll('.formula-item').forEach(item => {
                            if (!item.querySelector('.latex-source')) {
                                // Récupérer le code LaTeX original depuis le HTML
                                const htmlContent = item.innerHTML;
                                const latexMatch = htmlContent.match(/\$\$(.*?)\$\$/);
                                if (latexMatch && latexMatch[1]) {
                                    const latex = latexMatch[1].trim();
                                    const source = document.createElement('div');
                                    source.className = 'latex-source';
                                    source.textContent = latex;
                                    source.style.cssText = 'font-size: 9px; color: #666; margin-top: 4px; font-family: monospace; user-select: text; cursor: text; opacity: 0.7;';
                                    item.appendChild(source);
                                }
                            }
                        });
                    }, 500); // Attendre que MathJax ait fini de rendre
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* Onglets : vert si selected, gris si non-selected, rollovers colorés (comme epoch-btn/ergo-button) */
        .tabs-bar {
            position: fixed; top: 0; left: 0; z-index: 1000;
            display: flex; gap: 2px; padding: 0 0 0 10px; align-items: flex-start;
            min-height: 20px; margin: 0; 
        }
        .tabs-bar button {
            padding: 4px 14px 6px; height: 20px; line-height: 1; font-size: 12px;
            background: rgba(255,255,255,0.15); border: none; border-radius: 0 0 10px 10px;
            color: #888; cursor: pointer; box-sizing: border-box;
            transition: color 0.3s ease, box-shadow 0.3s ease;
            border-top: none;
            border-left: 1px solid rgba(255,255,255,0.15);
            border-bottom: 1px solid rgb(0,0,0);
            border-right: 1px solid rgb(0,0,0);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1), inset 0 -1px 0 rgba(0,0,0,0.2);
        }
        /* Non-selected : gris. Rollover : vert (base-color) */
        .tabs-bar button:not(.active) { color: #888; }
        .tabs-bar button:not(.active):hover { color: var(--base-color, #00ff00); }
        /* Selected : vert (base-color) */
        .tabs-bar button.active {
            color: var(--base-color, #00ff00);
            background: rgba(255,255,255,0.15);
            border-left: 1px solid rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            border-right: 1px solid rgba(255,255,255,0.12);
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.4), inset -1px -1px 0 rgba(255,255,255,0.08);
        }
        body { height: 100vh; overflow: hidden; } /* marge pour onglets, pas de scroll page */
        .tab-panel { flex: 1; min-height: 0; }
        .tab-panel:not(.active) { display: none !important; } /* hidden simple : un seul panel visible */
        .tab-panel.active { display: flex; flex-direction: column; min-height: 0; }
        #visu-panel.active { overflow: auto; overflow-x: hidden; margin: 5px 0 0 0; }
        #scie-panel.active { overflow: hidden; }
        #scie-panel iframe { flex: 1; min-height: 0; width: 100%; border: none; }
        .credits-footer { flex-shrink: 0; }
        /* Loader graphique : listing des modules, vert = chargé */
        .app-loader {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999; background: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; overflow: auto;
        }
        .app-loader.hidden { display: none; }
        .app-loader-title { color: var(--base-color, #0a0); font-size: 14px; margin-bottom: 12px; }
        .app-loader-list {
            list-style: none; margin: 0; padding: 0; max-width: 420px; width: 100%;
            font-family: monospace; font-size: 11px; color: #888;
        }
        .app-loader-list li { padding: 4px 8px; margin: 2px 0; border-radius: 4px; }
        .app-loader-list li.loaded { background: rgba(0, 160, 0, 0.35); color: var(--base-color, #0a0); }
    </style>
